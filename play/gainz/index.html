<style>
/* Gainz on Naturalé Design System: Earth & Meadow grounds, Bark ink, Moss for action, seasons for meaning. */
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --linen:#F4EFE6; --paper:#FFFDF8; --bark:#3B2F25; --bark-soft:#6B5A4A; --rule:#E0D6C4;
  --moss:#6B9B63; --sage:#6B9B63; --moss-ink:#456B3F; --open-bg:#4A7243; --open-fg:#FFFDF8;
  --rain:#2D63A6; --sun:#9A4A0A; --fire:#B42318; --sprout:#456B3F;
  --t1:#4A7243; --t2:#2D63A6; --t3:#9A4A0A; --t4:#B42318; --t5:#6B5A4A; --t6:#3B2F25; --t-ink:#FFFDF8;
  --pick:color-mix(in srgb,var(--sage) 20%,transparent);
  --scrim:rgba(59,47,37,.45); --lift:rgba(59,47,37,.18);
  /* legacy names the script still uses */
  --bg:var(--linen); --surface:var(--paper); --ink:var(--bark); --muted:var(--bark-soft); --line:var(--rule);
  --plate:var(--open-bg); --plate-ink:var(--open-fg); --up:var(--sprout); --danger:var(--fire);
  --display:"Young Serif",Georgia,"Times New Roman",serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:var(--body);
  --gust:cubic-bezier(.34,1.56,.64,1); --breeze:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --linen:#1D1914; --paper:#25201A; --bark:#EFE6D8; --bark-soft:#BCAB95; --rule:#3A3229;
    --moss:#9DC394; --moss-ink:#A9CF9F; --open-bg:#9DC394; --open-fg:#1D1914;
    --rain:#9CC3F0; --sun:#F5A65B; --fire:#F59A92; --sprout:#A9CF9F;
    --scrim:rgba(0,0,0,.6); --lift:rgba(0,0,0,.45);
    --t1:#9DC394; --t2:#9CC3F0; --t3:#F5A65B; --t4:#F59A92; --t5:#BCAB95; --t6:#EFE6D8; --t-ink:#1D1914;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --linen:#1D1914; --paper:#25201A; --bark:#EFE6D8; --bark-soft:#BCAB95; --rule:#3A3229;
  --moss:#9DC394; --moss-ink:#A9CF9F; --open-bg:#9DC394; --open-fg:#1D1914;
  --rain:#9CC3F0; --sun:#F5A65B; --fire:#F59A92; --sprout:#A9CF9F;
  --scrim:rgba(0,0,0,.6); --lift:rgba(0,0,0,.45);
  --t1:#9DC394; --t2:#9CC3F0; --t3:#F5A65B; --t4:#F59A92; --t5:#BCAB95; --t6:#EFE6D8; --t-ink:#1D1914;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--linen);color:var(--bark);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;font-synthesis:none}
button,input,select{font-family:inherit}
.wrap{max-width:560px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
h1{font-family:var(--display);font-weight:400;font-size:40px;line-height:1;letter-spacing:-.01em;margin:0}
.sync{font-size:13px;color:var(--bark-soft)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--bark);outline-offset:2px}

/* chips: pill, Earth on Meadow; picked = Moss droplet */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--paper);color:var(--bark);font:500 14px/1 var(--body);padding:10px 14px;min-height:40px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.chip[aria-pressed="true"]{background:var(--pick);border-color:color-mix(in srgb,var(--sage) 45%,transparent);color:var(--moss-ink);font-weight:600}
.chip:disabled{opacity:.6;cursor:default}

/* list card */
.list{background:var(--paper);border:1px solid var(--rule);border-radius:20px;overflow:hidden}
.ex{border-top:1px solid var(--rule);background:var(--paper);transition:transform .15s ease}
.ex:first-child{border-top:0}
.ex-row{display:flex;align-items:center;gap:10px;padding:12px 14px}
.ex-name{flex:1;min-width:0;background:none;border:0;padding:0;color:inherit;font:600 16px/1.3 var(--body);text-align:left;cursor:pointer}
.ex-name small{display:block;margin-top:2px;font-weight:500;font-size:13px;color:var(--bark-soft)}
.ex-name small.up{color:var(--sprout)}
.val{display:flex;align-items:center;gap:6px}
.val input{width:76px;text-align:right;font:600 22px/1 var(--body);font-variant-numeric:tabular-nums;color:var(--bark);background:var(--linen);border:1.5px solid transparent;border-radius:12px;padding:4px 10px;min-height:44px}
.val input:focus{border-color:var(--bark-soft);outline:none}
.unit{font-size:13px;color:var(--bark-soft);width:40px}
.unit.unitbtn{width:auto;min-width:40px;min-height:44px;border:0;background:transparent;font:500 13px var(--body);color:var(--moss-ink);text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer;padding:0 2px;text-align:left}
.save{flex:none;font:600 14px/1 var(--body);border:0;border-radius:999px;background:var(--bark);color:var(--paper);min-height:44px;padding:0 16px;cursor:pointer}
.tick{flex:none;display:grid;place-items:center;width:44px;height:44px;min-height:44px;border-radius:50%;border:2px solid var(--rule);background:transparent;color:transparent;font-size:18px;line-height:1;cursor:pointer;transition:background .2s,border-color .2s,color .2s,transform .45s var(--gust)}
.tick:hover{border-color:var(--bark-soft);color:var(--bark-soft)}
.tick.on{background:var(--open-bg);border-color:var(--open-bg);color:var(--open-fg)}
.tick.on:active{transform:scale(.92)}
.detail{display:none;padding:0 14px 14px}
.trend{margin:2px 0 12px;padding:12px 12px 8px;border-radius:16px;background:var(--linen)}
.trend figcaption{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--bark-soft)}
.trend figcaption b{font-size:14px;letter-spacing:0;text-transform:none;color:var(--bark);font-variant-numeric:tabular-nums}
.trend figcaption b.up{color:var(--sprout)} .trend figcaption b.down{color:var(--fire)}
.trend svg{display:block;width:100%;height:auto;overflow:visible}
.t-base{stroke:var(--rule);stroke-width:1}
.t-line{fill:none;stroke:var(--open-bg);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.t-dot{fill:var(--paper);stroke:var(--open-bg);stroke-width:2}
.t-dot.last{fill:var(--open-bg)}
.t-dot.best:not(.last){fill:var(--sun);stroke:var(--sun)}
.t-lbl{font:600 11px var(--body);fill:var(--bark-soft);font-variant-numeric:tabular-nums}
.t-lbl.strong{fill:var(--bark);font-size:12px} .t-lbl.best{fill:var(--sun)}
.trend-x{display:flex;justify-content:space-between;font-size:12px;color:var(--bark-soft)}
.trend-empty{margin:2px 0 12px;padding:12px 14px;border-radius:16px;background:var(--linen);font-size:14px;color:var(--bark-soft)}
.ex.open .detail{display:block}
.hist{list-style:none;margin:0 0 10px;padding:0;font-size:14px;color:var(--bark-soft)}
.hist li{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--rule)}
.hist li:first-child{border-top:0}
.hist b{color:var(--bark);font-weight:600;font-variant-numeric:tabular-nums}
.links{display:flex;gap:18px}
.link{background:none;border:0;padding:0;min-height:32px;color:var(--moss-ink);font:500 14px var(--body);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px;cursor:pointer}
.link.danger{color:var(--fire)}
.add{margin-top:12px;width:100%;font:600 15px var(--body);background:transparent;color:var(--bark);border:1.5px dashed color-mix(in srgb,var(--bark-soft) 45%,var(--rule));border-radius:999px;min-height:48px;cursor:pointer}
.add:hover{background:var(--paper)}
.add:disabled{opacity:.5;cursor:default}
.empty{padding:32px 16px;text-align:center;color:var(--bark-soft)}
.extags{display:block;font-weight:500;font-size:12px;color:var(--bark-soft);margin-bottom:6px}
.cathead{padding:12px 14px 6px;font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--moss-ink);border-top:1px solid var(--rule)}
.cathead:first-child{border-top:0}
.archbar{display:flex;width:100%;align-items:center;justify-content:space-between;padding:12px 14px;border:0;border-top:1px solid var(--rule);background:var(--paper);color:var(--bark-soft);font:600 14px var(--body);cursor:pointer;min-height:44px}
.ex.arch .ex-name{color:var(--bark-soft)}

/* buttons: pill, 48px, one primary per view */
.btn{display:inline-flex;align-items:center;justify-content:center;font:600 15px/1 var(--body);border:1px solid transparent;border-radius:999px;padding:0 20px;min-height:48px;cursor:pointer;background:var(--bark);color:var(--paper);transition:background .2s,color .2s,border-color .2s,transform .2s}
.btn:hover{background:var(--open-bg);color:var(--open-fg)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--paper);color:var(--bark);border-color:var(--rule)}
.btn.ghost:hover{background:var(--linen);border-color:var(--sage)}
.btn.danger,.btn.ghost.danger{color:var(--fire);border-color:color-mix(in srgb,var(--fire) 45%,transparent)}
.btn:disabled{background:var(--linen);color:var(--bark-soft);border-color:var(--rule);cursor:not-allowed}

/* tabs: segmented, Moss droplet on the current one */
.tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--rule);border-radius:999px;padding:5px;margin-bottom:16px}
.tab{flex:1;border:0;background:transparent;color:var(--bark);font:500 15px/1 var(--body);min-height:42px;border-radius:999px;cursor:pointer;transition:background .45s var(--gust),color .3s}
.tab[aria-selected="true"]{background:var(--pick);color:var(--moss-ink);font-weight:600}

/* plan card: Moss when there's work to do */
.plan{background:var(--open-bg);color:var(--open-fg);border-radius:20px;padding:16px 18px;margin-bottom:14px}
.plan.rest{background:var(--paper);color:var(--bark);border:1px solid var(--rule)}
.plan.back{background:color-mix(in srgb,var(--sun) 12%,var(--paper));color:var(--bark);border:1px solid color-mix(in srgb,var(--sun) 35%,transparent)}
.plan > span:first-child{display:block;font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.plan b{display:block;margin:4px 0 4px;font:400 30px/1.1 var(--display);letter-spacing:-.01em}
.plan span{font-size:14px;opacity:.9}
.plan .link{color:inherit;min-height:0}

/* date stepper */
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.nav{flex:none;display:grid;place-items:center;width:44px;height:44px;padding:0;border-radius:50%;border:1px solid var(--rule);background:var(--paper);color:var(--bark);font-size:20px;line-height:0;cursor:pointer;transition:border-color .2s,background .2s}
.nav:hover:not(:disabled){border-color:var(--sage);background:var(--linen)}
.nav:disabled{opacity:.35;cursor:default}
.datepick{position:relative;flex:1;background:var(--paper);border:1px solid var(--rule);border-radius:999px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 12px}
.datepick b{font:400 18px/1.15 var(--display)}
.datepick small{font-size:12px;color:var(--bark-soft)}
.datepick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0;margin:0;font-size:16px}
.datepick:focus-within{outline:3px solid var(--bark);outline-offset:2px}

/* history: calendar, day detail, summary */
.cal{background:var(--paper);border:1px solid var(--rule);border-radius:20px;padding:14px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head h3{margin:0;font:400 22px var(--display)}
.cal .nav{width:40px;height:40px}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-size:12px;font-weight:600;color:var(--bark-soft);text-align:center;padding-bottom:4px}
.day{aspect-ratio:1/1.15;border-radius:12px;border:0;background:var(--linen);color:var(--bark);padding:5px 2px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font:600 13px var(--body);font-variant-numeric:tabular-nums;cursor:pointer;min-width:0}
.day.blank{background:transparent;cursor:default}
.day.future{opacity:.4;cursor:default}
.nav svg{display:block;width:20px;height:20px}
.day .tag{font:500 11px/1.2 var(--body);max-width:100%;overflow:hidden;text-overflow:clip;white-space:nowrap}
.day.done{background:var(--c);color:var(--t-ink)}
.day.done .tag{font-weight:600;opacity:.92}
.day.rest .tag{color:var(--bark-soft);font-weight:500}
/* rings sit inside the cell, with a thin Earth line so they read on any colour */
.day.today{box-shadow:inset 0 0 0 2px var(--bark),inset 0 0 0 3.5px var(--paper)}
.day[aria-pressed="true"]{box-shadow:inset 0 0 0 2.5px var(--moss),inset 0 0 0 4px var(--paper)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--bark-soft)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.daydetail{margin-top:12px}
.sess{background:var(--paper);border:1px solid var(--rule);border-radius:20px;padding:14px 16px;margin-bottom:10px}
.sess h3{margin:0;font:400 22px var(--display)}
.sess .when{font-size:13px;color:var(--bark-soft);margin:2px 0 8px}
.sess ul{list-style:none;margin:0;padding:0;font-size:14px}
.sess li{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--rule)}
.sess li b{font-weight:600;font-variant-numeric:tabular-nums}
.sess .btn{margin-top:12px;min-height:44px;font-size:14px}
.sess .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sess .btns .btn{margin-top:0}
.summary{background:var(--paper);border:1px solid var(--rule);border-radius:20px;padding:14px 16px;margin-top:12px}
.summary h3{margin:0 0 6px;font:400 20px var(--display)}
.summary ul{list-style:none;margin:0;padding:0}
.summary li{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--rule);font-size:15px}
.summary li:first-child{border-top:0}
.summary li span{display:flex;align-items:center}
.summary i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:10px}
.summary b{font:600 18px var(--body);font-variant-numeric:tabular-nums}
.summary b small{font:500 13px var(--body) !important;color:var(--bark-soft) !important}
.summary .tot{font-size:13px;color:var(--bark-soft);margin-top:8px}

/* rest */
.chip.restchip{border-style:dashed}
.chip.restchip[aria-pressed="true"]{border-style:solid;background:color-mix(in srgb,var(--bark-soft) 16%,var(--paper));border-color:var(--bark-soft);color:var(--bark)}
.restpanel{padding:28px 16px;text-align:center}
.restpanel b{display:block;font:400 28px var(--display);margin-bottom:4px}
.restpanel p{margin:0 0 16px;color:var(--bark-soft);font-size:15px}

/* reorder */
.ex.dragging{transition:none;position:relative;z-index:5;box-shadow:0 12px 28px -8px var(--lift);border-radius:14px}
.handle{flex:none;width:28px;min-height:44px;margin-left:-6px;border:0;background:transparent;color:var(--bark-soft);font-size:18px;letter-spacing:-3px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;display:flex;align-items:center;justify-content:center}
.ex.dragging .handle{cursor:grabbing;color:var(--moss-ink)}
.ex.pressing{background:var(--linen)}
body.is-dragging{user-select:none;-webkit-user-select:none}

/* edit a day */
.editrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--rule)}
.editrow span{flex:1;font-size:14px}
.editrow input{width:80px;text-align:right;font:600 18px var(--body);font-variant-numeric:tabular-nums;color:var(--bark);background:var(--linen);border:1.5px solid var(--rule);border-radius:12px;padding:4px 8px;min-height:40px}
.editrow small{width:44px;font-size:12px;color:var(--bark-soft)}
.editrow .x{width:36px;height:36px;border-radius:50%;border:0;background:var(--linen);color:var(--fire);font-size:18px;cursor:pointer}
.editrow.removed span,.editrow.removed input{opacity:.35;text-decoration:line-through}
.editdate{display:flex;align-items:center;gap:8px;margin:4px 0 8px;font-size:14px;color:var(--bark-soft)}
.editdate input{flex:1;font:600 16px var(--body);color:var(--bark);background:var(--linen);border:1.5px solid var(--rule);border-radius:12px;padding:8px 10px;min-height:44px}
.editbar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--rule);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;justify-content:center;z-index:20;box-shadow:0 -10px 24px -12px var(--lift)}
.editbar .btn{flex:1;max-width:260px}
body.editing .wrap{padding-bottom:110px}
body.editing .tabs{opacity:.5}

/* toast: Bark capsule */
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-6px);background:var(--bark);color:var(--paper);font:600 14px var(--body);padding:11px 18px;border-radius:999px;box-shadow:0 12px 28px -10px var(--lift);opacity:0;transition:opacity .25s,transform .45s var(--breeze);pointer-events:none;white-space:nowrap;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* dialogs and sheets */
dialog{border:0;border-radius:24px;background:var(--paper);color:var(--bark);width:min(92vw,420px);padding:22px}
dialog::backdrop{background:var(--scrim)}
dialog h2{font:400 26px/1.15 var(--display);margin:0 0 14px}
dialog label{display:block;font-size:14px;font-weight:600;color:var(--bark);margin:14px 0 6px}
dialog input,dialog select{width:100%;font:400 16px var(--body);color:var(--bark);background:var(--paper);border:1.5px solid var(--bark-soft);border-radius:12px;padding:10px 14px;min-height:48px}
dialog select{-webkit-appearance:none;appearance:none;padding-right:40px;background-image:linear-gradient(45deg,transparent 50%,var(--bark) 50%),linear-gradient(135deg,var(--bark) 50%,transparent 50%);background-position:calc(100% - 22px) 52%,calc(100% - 16px) 52%;background-size:6px 6px;background-repeat:no-repeat}
dialog input::placeholder{color:var(--bark-soft);opacity:1}
dialog input:disabled,dialog select:disabled{background:var(--linen);border-color:var(--rule);color:var(--bark-soft)}
.drow{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
#askDlg p{margin:0 0 4px;font-size:16px;color:var(--bark-soft)}
.hint2{font-size:13px;color:var(--bark-soft);margin-top:6px}
dialog.sheet{margin:auto auto 0;width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
dialog.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--rule);margin:0 auto 14px}
dialog.sheet h2{font-size:24px;margin:0 0 10px}

/* people */
.hright{display:flex;align-items:center;gap:10px}
.avatar{width:44px;height:44px;min-width:44px;aspect-ratio:1;padding:0;line-height:1;border-radius:50%;border:0;color:#FFFDF8;font:400 17px var(--display);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--rule)}
.avatar.big{width:48px;height:48px;min-width:48px;font-size:19px;cursor:inherit;box-shadow:none}

<body>

  <div class="ronote" id="roNote" hidden></div>
  <div class="tabs" role="tablist"><button class="tab" role="tab" data-view="workout" aria-selected="true">Workout</button><button class="tab" role="tab" data-view="history" aria-selected="false">History</button></div>
  <section id="workoutView">
    <div class="datebar"><button class="nav" id="prevDay" aria-label="Previous day"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button><div class="datepick"><b id="dateLabel"></b><input type="date" id="wDate" aria-label="Workout date"></div><button class="nav" id="nextDay" aria-label="Next day"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button></div>
    <div id="plan"></div>
    <nav class="chips" id="chips" aria-label="Workout days"></nav>

    <button class="add" id="addBtn">Add exercise</button>

  <section id="historyView" hidden></section>
</div>
<div class="editbar" id="editBar" hidden><button class="btn ghost" data-act="cancelEdit">Discard</button><button class="btn" data-act="saveEdit">Save</button></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog id="pfSheet" class="sheet" aria-labelledby="pfTitle"><h2 id="pfTitle">Who's training?</h2><div id="pfList"></div><div class="splitbox" id="splitBox"></div></dialog>
<dialog id="askDlg"><h2 id="askTitle">Are you sure?</h2><p id="askMsg"></p><div class="drow"><button type="button" class="btn ghost" id="askNo">Cancel</button><button type="button" class="btn" id="askYes">OK</button></div></dialog>

<script>
(function(){
  var pad=function(n){return String(n).padStart(2,"0")}, iso=function(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
  var back=function(n){var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-n);return iso(d)};
  var SPLIT=["Upper A","Lower A","Upper B","Lower B"];
  var EX=[
    ["bp","Bench press","Upper A","kg",60,2.5],["row","Seated cable row","Upper A","kg",50,2.5],["ohp","Shoulder press","Upper A","kg",17.5,1.25],
    ["sq","Back squat","Lower A","kg",70,5],["rdl","Romanian deadlift","Lower A","kg",60,5],["lc","Leg curl","Lower A","kg",35,2.5],
    ["idb","Incline dumbbell press","Upper B","kg/side",20,1],["lat","Lat pulldown","Upper B","kg",52.5,2.5],["cur","Bicep curl","Upper B","kg/side",12.5,1],
    ["dl","Deadlift","Lower B","kg",90,5],["lng","Walking lunge","Lower B","kg/side",14,1],["calf","Calf raise","Lower B","kg",40,5],
    ["run","Treadmill run","Cardio","min",20,2]
  ];
  var exercises=EX.map(function(e){return {id:e[0],name:e[1],tags:[e[2]],unit:e[3]}});
  var days=[27,25,23,20,18,16,13,11,9,6,4,2], logs=[], t=1;
  days.forEach(function(ago,k){
    var day=SPLIT[k%4], cycle=Math.floor(k/4), date=back(ago);
    EX.forEach(function(e){ if(e[2]!==day) return; logs.push({id:"l"+(t++),exId:e[0],p:"p1",date:date,t:t,value:e[4]+e[5]*cycle,day:day}); });
    if(k%3===2) logs.push({id:"l"+(t++),exId:"run",p:"p1",date:date,t:t,value:20+2*cycle,day:"Cardio"});
  });
  window.__GAINZ_SEED__={exercises:exercises,groups:["Cardio"],logs:logs,
    profiles:[{id:"p1",name:"Sam",split:SPLIT.slice(),splitSince:back(27),rests:[],cardioAfter:["Lower B"]}]};
  try{ if(!localStorage.getItem("gainz-demo-v1")) localStorage.setItem("gainz-demo-v1", JSON.stringify(window.__GAINZ_SEED__)); }catch(e){}
})();
</script>
<script>
(function(){
  const LS = "gainz-demo-v1";
  const DEFAULT_ROT = ["Chest & Shoulders","Legs","Back","Arms"];
  let state = window.__GAINZ_SEED__ ? JSON.parse(JSON.stringify(window.__GAINZ_SEED__)) : {exercises:[], logs:[]};
  let filter = null, openId = null, editingId = null, remote = null, saveTimer = null, view = "workout", userPicked = false;
  const $ = s => document.querySelector(s);
  const uid = () => Math.random().toString(36).slice(2,10);
  const fmt = n => (Math.round(n*10)/10).toString();
  const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const today = () => iso(new Date());
  const days = (a,b) => Math.round((new Date(b+"T00:00") - new Date(a+"T00:00"))/864e5);
  const niceDate = d => new Date(d+"T00:00").toLocaleDateString(undefined,{day:"numeric",month:"short"});
  const longDate = d => new Date(d+"T00:00").toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"short"});
  const esc = s => { const d=document.createElement("div"); d.textContent=s??""; return d.innerHTML; };
  const unitLabel = u => ({"kg/side":"kg/side","min":"min","km":"km"})[u] || "kg";
  let activeDate = null, em = null, showAll = false;
  let archOpen = {};
  const ad = () => em ? em.orig : (activeDate || today());
  const monthStart = () => { const d = new Date(); return iso(new Date(d.getFullYear(), d.getMonth(), 1)); };
  const REST = "__rest__";
  const PKEY = "gainz-demo-profile";
  let pid = "p1";
  try{ pid = localStorage.getItem(PKEY) || "p1"; }catch(e){}
  const prof = () => (state.profiles||[]).find(x=>x.id===pid) || state.profiles[0];
  const mine = l => (l.p || "p1") === prof().id;
  const rests = () => (prof().rests ||= []);
  const isRest = d => rests().includes(d);
  // Splits are lists of day names; an exercise shows on every day it is tagged with.
  const SPLITS = {
    "Bro split": ["Chest & Shoulders","Back","Arms","Legs"],
    "Push Pull Legs": ["Push","Pull","Legs"],
    "Upper Lower": ["Upper","Lower"],
    "Upper Lower 4-day": ["Upper","Lower","Rest","Upper","Lower"],
    "Full body": ["Full body"]
  };
  const BASE_TAGS = ["Chest & Shoulders","Back","Arms","Legs","Push","Pull","Upper","Lower","Full body","Cardio"];
  const tagsOf = e => e.tags && e.tags.length ? e.tags : (e.group ? [e.group] : []);
  const inDay = (e, d) => tagsOf(e).includes(d) || (d==="Full body" && !tagsOf(e).includes("Cardio"));
  const splitOf = x => (x.split && x.split.length) ? x.split : (x.rotation && x.rotation.length ? x.rotation : DEFAULT_ROT);
  // The split is the cycle in order and may repeat days or include "Rest" (e.g. Upper, Lower 1, Rest, Upper, Lower 2).
  const rot = () => [...new Set(splitOf(prof()).filter(d=>d!=="Rest"))];
  // optional per-profile gym label shown next to a day name, e.g. {"Upper A":"RBD"}
  const dayLabel = d => { const g = ((prof().gyms)||{})[d]; return g ? `${d} · ${g}` : d; };
  // Weights are always stored in kg. Each gym can default to lb (profile.gymUnits), and tapping the unit overrides it per exercise and gym (profile.units).
  const KG2LB = 2.2; // rounded on purpose: 1 kg = 2.2 lb
  const isWt = ex => !ex.unit || ex.unit==="kg" || ex.unit==="kg/side";
  const gymOfDay = d => ((prof().gyms)||{})[d] || "";
  const unitKey = (ex, d) => gymOfDay(d)+"|"+ex.id;
  const wUnit = (ex, d) => {
    if(!isWt(ex)) return null;
    const o = ((prof().units)||{})[unitKey(ex,d)];
    if(o==="kg" || o==="lb") return o;
    return ((prof().gymUnits)||{})[gymOfDay(d)]==="lb" ? "lb" : "kg";
  };
  const toDisp = (v, ex, d) => wUnit(ex,d)==="lb" ? Math.round(v*KG2LB*10)/10 : v;
  const fromDisp = (v, ex, d) => wUnit(ex,d)==="lb" ? Math.round(v/KG2LB*10000)/10000 : v;
  const unitText = (ex, d) => wUnit(ex,d)==="lb" ? (ex.unit==="kg/side" ? "lb/side" : "lb") : unitLabel(ex.unit);
  const fmtW = (v, ex, d) => `${fmt(toDisp(v,ex,d))} ${unitText(ex,d)}`;
  // An exercise tagged "<day>~archive" is kept out of that day's main list and sits in its collapsible Archive instead.
  const ARCH = "~archive";
  const isArch = (e, d) => tagsOf(e).includes(d+ARCH);
  const inArchAny = e => tagsOf(e).some(t=>t.endsWith(ARCH));
  const dayNames = () => {
    const days = [...rot()];
    if(!days.includes("Cardio")) days.push("Cardio");
    if(myExercises().some(e=>!days.some(d=>inDay(e,d)) && !inArchAny(e))) days.push("Other");
    return days;
  };
  const exInDay = (e, d) => d==="Other" ? (!rot().concat("Cardio").some(x=>inDay(e,x)) && !inArchAny(e)) : (inDay(e,d) && !isArch(e,d));
  const allTags = () => [...new Set([...BASE_TAGS, ...state.exercises.flatMap(tagsOf), ...state.profiles.flatMap(splitOf)])].filter(t=>!t.endsWith(ARCH) && t!=="Rest");
  // which day a logged session counts as
  const dayForItems = items => {
    const days = dayNames();
    const stored = items.map(x=>x.l.day).find(d=>d && days.includes(d));
    if(stored) return stored;
    let best = days[0], n = -1;
    days.forEach(d=>{ const c = items.filter(x=>exInDay(x.ex,d)).length; if(c > n){ n = c; best = d; } });
    return best;
  };
  const PCOLORS = {p1:"#4A7243", p2:"#9A4A0A", p3:"#2D63A6"};
  const INITIALS = {p1:"S", p2:"A", p3:"J"};
  const initial = x => INITIALS[x.id] || (x.name||"?").trim()[0].toUpperCase();
  const TAG_MAP = {"Chest & Shoulders":["Chest & Shoulders","Push","Upper"], "Back":["Back","Pull","Upper"], "Arms":["Arms","Pull","Upper"], "Legs":["Legs","Lower"], "Cardio":["Cardio"]};
  function migrateTags(){
    let changed = false;
    state.exercises.forEach(e=>{ if(!e.tags){ e.tags = (TAG_MAP[e.group] || [e.group||"Other"]).slice(); changed = true; } });
    (state.profiles||[]).forEach(x=>{ if(!x.split){ x.split = x.id==="p2" ? ["Lower","Upper","Cardio"] : splitOf(x).slice(); delete x.days; changed = true; } });
    return changed;
  }
  function migrate(){
    if(state.profiles){ const w = state.profiles.find(x=>x.id==="p2"); if(w && w.name==="Partner") w.name = "Alex"; addGuest(); return; }
    state.logs.forEach(l=>{ if(!l.p) l.p = "p1"; });
    state.profiles = [
      {id:"p1", name:"Sam", days:null, rotation: state.rotation || DEFAULT_ROT.slice(), rests: state.rests || []},
      {id:"p2", name:"Alex", days:[{name:"Lower",cats:["Legs"]},{name:"Upper",cats:["Chest & Shoulders","Back","Arms"]},{name:"Cardio",cats:["Cardio"]}], rotation:["Lower","Upper","Cardio"], rests:[]}
    ];
    delete state.rotation; delete state.rests;
    addGuest();
  }
  function addGuest(){ return;
    if(state.profiles.some(x=>x.id==="p3")) return;
    const a = state.profiles.find(x=>x.id==="p1");
    state.profiles.push({id:"p3", name:"Jordan", days:null, rotation:(a && a.rotation ? a.rotation : DEFAULT_ROT).slice(), rests:[]});
  }

  try{ const s = localStorage.getItem(LS); if(s) state = JSON.parse(s); }catch(e){}
  const ensureGroups = () => { if(!state.groups) state.groups = ["Cardio"]; migrate(); migrateTags(); };
  ensureGroups();

  let db = null;
  const lastSent = {}, writing = {}, dirty = {};
  const docOf = id => db.doc("gainz/" + id);
  const bodyOf = id => id==="directory"
    ? {exercises: state.exercises, groups: state.groups || ["Cardio"]}
    : {profile: state.profiles.find(x=>x.id===id), logs: state.logs.filter(l=>(l.p||"p1")===id)};
  async function flush(id){
    if(writing[id] && Date.now() - writing[id] < 15000) { dirty[id] = true; return "queued"; }
    const body = JSON.parse(JSON.stringify(bodyOf(id)));
    const key = JSON.stringify(body);
    if(key === lastSent[id]) return "same";
    writing[id] = Date.now();
    let out = "ok";
    try{
      await Promise.race([docOf(id).set(body), new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout"}),15000))]);
      lastSent[id] = key;
    }
    catch(e){
      out = (e && (e.code || e.message)) || "error";
      toast(id==="directory" ? `Exercise list not saved (${out})` : out==="permission_denied" ? "You can't change this profile" : `Couldn't save (${out})`);
      console.warn("save failed", id, e);
    }
    writing[id] = 0;
    if(dirty[id]){ dirty[id] = false; flush(id); }
    return out;
  }
  function persist(){
    if(em){ if(db && role.all) flush("directory"); return; }
    try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){}
    if(!db) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>{
      saveTimer = null;
      if(role.all) flush("directory");
      state.profiles.forEach(x=>{ if(canWriteProfile(x.id)) flush(x.id); });
    }, 500);
  }


  const logsFor = id => state.logs.filter(l=>l.exId===id && mine(l)).sort((a,b)=>((a.base?0:1)-(b.base?0:1)) || (a.date<b.date?-1:a.date>b.date?1:0) || (a.t-b.t));
  const listOf = id => id==="p3" ? "p1" : id;
  const listProf = () => state.profiles.find(x=>x.id===listOf(prof().id)) || prof();
  const hiddenSet = () => new Set(listProf().hidden || []);
  const visible = e => !hiddenSet().has(e.id);
  // permissions: owner edits everything; others edit only the guest log
  const role = { all: true, known: false };
  const canWriteProfile = id => role.all || id === "p3";
  const ro = () => !canWriteProfile(prof().id);
  const myExercises = () => state.exercises.filter(visible);

  const exById = id => state.exercises.find(e=>e.id===id);
  const doneToday = id => state.logs.some(l=>l.exId===id && mine(l) && !l.base && l.date===ad());

  function sessions(){
    const by = {};
    for(const l of state.logs){ if(l.base || !mine(l)) continue; const ex = exById(l.exId); if(!ex) continue; (by[l.date] ||= []).push({l,ex}); }
    return Object.keys(by).sort().reverse().map(date=>{
      const items = by[date].sort((a,b)=>a.l.t-b.l.t);
      return {date, group: dayForItems(items), items};
    });
  }

  // Walk the split day by day since it was set: a logged day moves to just past that day in the cycle,
  // a planned Rest step passes when nothing is logged that day, and a missed training day just waits.
  function cyclePos(){
    const C = splitOf(prof()), t = today(), since = prof().splitSince;
    const byDate = {}; sessions().forEach(x=>{ byDate[x.date] = x.group; });
    const evs = [...Object.keys(byDate), ...rests()].filter(d=>d<t && (!since || d>=since)).sort();
    const start = since || evs[0];
    let pos = 0;
    if(!start) return 0;
    for(let d=new Date(start+"T00:00"); iso(d) < t; d.setDate(d.getDate()+1)){
      const g = byDate[iso(d)];
      if(g){ for(let k=0;k<C.length;k++){ const jx=(pos+k)%C.length; if(C[jx]===g){ pos=(jx+1)%C.length; break; } } }
      else if(C[pos]==="Rest") pos = (pos+1)%C.length;
    }
    return pos;
  }
  const finisher = g => ((prof().cardioAfter)||[]).includes(g) ? " Finish with 10 min cardio." : "";
  function plan(){
    const C = splitOf(prof()), all = sessions(), t = today();
    const pos = cyclePos();
    const nextTrain = p => { for(let k=0;k<C.length;k++){ const g = C[(p+k)%C.length]; if(g!=="Rest") return g; } return C[0]; };
    const todays = all.find(x=>x.date===t);
    const last = all.find(x=>x.date<t && C.includes(x.group));
    if(isRest(t)){ const nx = nextTrain(C[pos]==="Rest" ? pos+1 : pos); return {rest:true, group:nx, note:`Marked as rest. ${dayLabel(nx)} is next in your cycle.`, marked:true}; }
    if(todays){
      let p2 = pos; for(let k=0;k<C.length;k++){ const jx=(pos+k)%C.length; if(C[jx]===todays.group){ p2=(jx+1)%C.length; break; } }
      const nx = nextTrain(p2);
      return {group:todays.group, note:`Logged today.${finisher(todays.group)} ${C[p2]==="Rest" ? `Rest tomorrow, then ${dayLabel(nx)}.` : `${dayLabel(nx)} is next in your cycle.`}`, done:true};
    }
    if(C[pos]==="Rest"){ const nx = nextTrain(pos+1); return {rest:true, group:nx, note:`Rest day in your split. ${dayLabel(nx)} is next.`}; }
    const g = C[pos];
    if(!C.includes("Rest")){
      // three training days in a row: suggest a rest day
      let streak = 0; for(let k=1;k<=3;k++){ const d = new Date(t+"T00:00"); d.setDate(d.getDate()-k); if(all.some(x=>x.date===iso(d))) streak++; else break; }
      if(streak >= 3) return {rest:true, group:g, note:`3 training days in a row, so rest is a good call. Otherwise go for ${dayLabel(g)}.`};
    }
    return {group:g, note:(last ? `${dayLabel(last.group)} was last on ${niceDate(last.date)}. ${dayLabel(g)} is next in your cycle.` : `Start of your cycle.`) + finisher(g)};
  }

  function renderPlan(p){
    $("#plan").innerHTML = `<div class="plan ${p.rest?"rest":""}"><span>${p.rest?"Today":p.done?"Today":"Up next today"}</span><b>${p.rest?"Rest":esc(dayLabel(p.group))}</b><span>${esc(p.note)}</span></div>`;
  }

  // Progress chart for one exercise: every logged max in order, starting max first.
  function trend(ex, ls, d){
    const pts = ls.filter(l=>typeof l.value==="number");
    if(pts.length < 2) return `<p class="trend-empty">Log ${esc(ex.name)} a couple more times to see your progress here.</p>`;
    const vals = pts.map(l=>toDisp(l.value, ex, d)), u = unitText(ex, d);
    const W = 320, H = 120, PX = 14, PT = 22, PB = 14;
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if(hi === lo){ hi += 1; lo = Math.max(0, lo - 1); }
    const x = i => PX + (W - 2*PX) * (vals.length===1 ? .5 : i/(vals.length-1));
    const y = v => PT + (H - PT - PB) * (1 - (v - lo)/(hi - lo));
    const line = vals.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
    const area = `${line}L${x(vals.length-1).toFixed(1)},${H-PB}L${x(0).toFixed(1)},${H-PB}Z`;
    const best = Math.max(...vals), bi = vals.lastIndexOf(best), last = vals.length-1;
    const diff = vals[last] - vals[0], gid = "tg-"+ex.id;
    const when = l => l.base ? "Start" : niceDate(l.date);
    const lblX = i => Math.min(W - PX, Math.max(PX, x(i)));
    const anchor = i => i===0 ? "start" : i===last ? "end" : "middle";
    const label = (i, txt, cls) => `<text class="${cls}" x="${lblX(i).toFixed(1)}" y="${(y(vals[i]) - 9).toFixed(1)}" text-anchor="${anchor(i)}">${txt}</text>`;
    const desc = `${ex.name}: ${fmt(vals[0])} to ${fmt(vals[last])} ${u} over ${vals.length} entries, best ${fmt(best)} ${u}.`;
    return `<figure class="trend">
      <figcaption><span>Progress</span><b class="${diff>0?"up":diff<0?"down":""}">${diff>0?"+":""}${fmt(diff)} ${u}</b></figcaption>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(desc)}">
        <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--moss);stop-opacity:.28"/><stop offset="1" style="stop-color:var(--moss);stop-opacity:0"/></linearGradient></defs>
        <line class="t-base" x1="${PX}" x2="${W-PX}" y1="${H-PB}" y2="${H-PB}"/>
        <path d="${area}" fill="url(#${gid})"/>
        <path class="t-line" d="${line}"/>
        ${vals.map((v,i)=>`<circle class="t-dot${i===bi?" best":""}${i===last?" last":""}" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${i===last||i===bi?4.5:3}"/>`).join("")}
        ${label(0, fmt(vals[0]), "t-lbl")}${bi!==0 && bi!==last ? label(bi, fmt(best), "t-lbl best") : ""}${last!==0 ? label(last, fmt(vals[last]), "t-lbl strong") : ""}
      </svg>
      <div class="trend-x"><span>${when(pts[0])}</span><span>${pts.length} entries</span><span>${when(pts[last])}</span></div>
    </figure>`;
  }

  const COLORS = ["var(--t1)","var(--t2)","var(--t3)","var(--t4)","var(--t5)","var(--t6)"]; // Moss, Winter, Autumn, Summer, Soft Bark, Bark
  const colorOf = g => COLORS[Math.max(0, rot().indexOf(g) >= 0 ? rot().indexOf(g) : dayNames().indexOf(g)) % COLORS.length];
  const shortOf = g => g.includes("&") ? g.split("&").map(w=>w.trim()[0]).join("&") : g.split(" ")[0].slice(0,6);
  let calMonth = null, selDate = null;

  function renderHistory(){
    const ss = sessions(), byDate = Object.fromEntries(ss.map(x=>[x.date,x])), t = today();
    const starts = [...(ss.length?[ss[ss.length-1].date]:[]), ...rests()].sort();
    const firstDate = starts.length ? starts[0] : null;
    if(!calMonth){ const d=new Date(); calMonth = new Date(d.getFullYear(), d.getMonth(), 1); }
    if(!selDate) selDate = t;
    const y = calMonth.getFullYear(), m = calMonth.getMonth();
    const startPad = (new Date(y,m,1).getDay()+6)%7, dim = new Date(y,m+1,0).getDate();
    const nowM = new Date(); const atCurrent = y===nowM.getFullYear() && m===nowM.getMonth();
    const minM = new Date(nowM.getFullYear()-1, nowM.getMonth(), 1);
    const atFirst = y<minM.getFullYear() || (y===minM.getFullYear() && m<=minM.getMonth());
    let cells = ["M","T","W","T","F","S","S"].map(d=>`<div class="dow">${d}</div>`).join("");
    for(let i=0;i<startPad;i++) cells += `<div class="day blank"></div>`;
    for(let d=1; d<=dim; d++){
      const ds = iso(new Date(y,m,d)), sess = byDate[ds];
      let cls="day", tag="", sty="";
      if(ds > t) cls += " future";
      else if(sess){ cls += " done"; sty = ` style="--c:${colorOf(sess.group)}"`; tag = `<span class="tag">${esc(shortOf(sess.group))}</span>`; }
      else if(isRest(ds) || (firstDate && ds >= firstDate && ds < t)){ cls += " rest"; tag = `<span class="tag">Rest</span>`; }
      if(ds===t) cls += " today";
      cells += `<button class="${cls}"${sty} data-date="${ds}" aria-pressed="${ds===selDate}" ${ds>t?"disabled":""} aria-label="${longDate(ds)}${sess?", "+esc(sess.group):""}"><span>${d}</span>${tag}</button>`;
    }
    const sel = byDate[selDate];
    let detail;
    const canLog = selDate <= t;
    const btn = label => canLog ? `<button class="btn ghost" data-act="logday">${label}</button>` : "";
    if(sel) detail = `<div class="sess"><h3>${esc(dayLabel(sel.group))}</h3><div class="when">${longDate(sel.date)}</div><ul>${sel.items.map(({l,ex})=>`<li><span>${esc(ex.name)}</span><b>${fmtW(l.value, ex, sel.group)}</b></li>`).join("")}</ul><div class="btns"><button class="btn" data-act="editday">Edit</button><button class="btn ghost danger" data-act="deleteday">Delete</button></div></div>`;
    else if(isRest(selDate)) detail = `<div class="sess"><h3>Rest</h3><div class="when">${longDate(selDate)}, marked as rest</div><div class="btns"><button class="btn" data-act="editday">Edit</button><button class="btn ghost danger" data-act="deleteday">Delete</button></div></div>`;
    else if(selDate===t) detail = `<div class="sess"><h3>Today</h3><div class="when">Nothing logged yet.</div>${btn("Log today's workout")}</div>`;
    else detail = `<div class="sess"><h3>Rest</h3><div class="when">${longDate(selDate)}</div>${btn("Log a workout for this day")}</div>`;
    const used = [...new Set(ss.map(x=>x.group))];
    const allGroups = rot().concat(used.filter(g=>!rot().includes(g)));
    const mPrefix = `${y}-${String(m+1).padStart(2,"0")}`;
    const count = pred => { const c = {}; ss.filter(pred).forEach(x=>c[x.group]=(c[x.group]||0)+1); return c; };
    const mc = count(x=>x.date.startsWith(mPrefix)), ac = count(()=>true);
    let mRest = 0, aRest = 0;
    if(firstDate){
      for(let d=new Date(firstDate+"T00:00"); iso(d) <= t; d.setDate(d.getDate()+1)){
        const ds = iso(d); if(!byDate[ds] && (ds < t || isRest(ds))){ aRest++; if(ds.startsWith(mPrefix)) mRest++; }
      }
    }
    const plural = n => n===1?"day":"days";
    const rows = allGroups.map(g=>`<li><span><i style="background:${colorOf(g)}"></i>${esc(g)}</span><b>${mc[g]||0} <small>${plural(mc[g]||0)}</small></b></li>`).join("")
      + `<li><span><i style="background:var(--line)"></i>Rest</span><b>${mRest} <small>${plural(mRest)}</small></b></li>`;
    const allTotal = Object.values(ac).reduce((a,b)=>a+b,0);
    const summary = `<div class="summary"><h3>${calMonth.toLocaleDateString(undefined,{month:"long"})} summary</h3><ul>${rows}</ul>
      <div class="tot">All time: ${allTotal} workout ${plural(allTotal)}${allGroups.map(g=>`, ${esc(g)} ${ac[g]||0}`).join("")}, rest ${aRest}.</div></div>`;
    $("#historyView").innerHTML = `<div class="cal">
      <div class="cal-head"><button class="nav" data-cal="-1" aria-label="Previous month" ${atFirst?"disabled":""}><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button><h3>${calMonth.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</h3><button class="nav" data-cal="1" aria-label="Next month" ${atCurrent?"disabled":""}><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button></div>
      <div class="grid7">${cells}</div>
    </div><div class="daydetail">${detail}</div>${summary}`;
  }

  function ask(msg, yes="OK", title="Are you sure?"){
    return new Promise(res=>{
      const d = $("#askDlg"); $("#askTitle").textContent = title; $("#askMsg").textContent = msg; $("#askYes").textContent = yes;
      const done = v => { d.close(); $("#askYes").onclick = $("#askNo").onclick = null; d.oncancel = null; res(v); };
      $("#askYes").onclick = () => done(true); $("#askNo").onclick = () => done(false);
      d.oncancel = e => { e.preventDefault(); done(false); };
      d.showModal();
    });
  }
  function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove("show"),2000); }

  function log(ex, value){
    const ls = logsFor(ex.id), prevBest = ls.length ? Math.max(...ls.map(l=>l.value??0)) : null;
    const todays = state.logs.find(l=>l.exId===ex.id && mine(l) && !l.base && l.date===ad());
    if(todays){ todays.value = value; todays.t = Date.now(); }
    else state.logs.push({id:uid(), exId:ex.id, p:prof().id, date:ad(), t:Date.now(), value, ...(filter && filter!==REST ? {day:filter} : {})});
    prof().rests = rests().filter(d=>d!==ad());
    userPicked = true;
    persist(); render();
    toast(prevBest!=null && value>prevBest ? `New max on ${ex.name}` : `${ex.name} done`);
  }

  document.addEventListener("input", e=>{

  document.addEventListener("click", e=>{
    if(e.target.closest("#avatarBtn")){
      if(em){ toast("Save or discard your edit first"); return; }
      $("#pfList").innerHTML = state.profiles.map(x=>`<button class="pfrow" data-pf="${x.id}" aria-current="${x.id===prof().id}"><span class="avatar big" style="background:${PCOLORS[x.id]||"#6B5A4A"}">${esc(initial(x))}</span><span>${esc(x.name)}${canWriteProfile(x.id)?"":"<small>View only</small>"}</span>${x.id===prof().id?'<b class="chk" aria-hidden="true">✓</b>':""}</button>`).join("");
      renderSplitBox();
      $("#pfSheet").showModal(); return;
    }
    if(e.target === $("#pfSheet")){ $("#pfSheet").close(); return; }
    const pf = e.target.closest("[data-pf]"); if(pf){
      $("#pfSheet").close();
      if(pf.dataset.pf === prof().id) return;
      pid = pf.dataset.pf; try{ localStorage.setItem(PKEY, pid); }catch(_){}
      activeDate = null; userPicked = false; filter = null; openId = null; selDate = null; render(); toast(`Switched to ${prof().name}`); return; }
    const tab = e.target.closest(".tab"); if(tab){
      if(em && tab.dataset.view!=="workout"){ ask("You have unsaved changes to this day.", "Discard", "Discard changes?").then(ok=>{ if(ok) cancelEdit(); }); return; }
      view = tab.dataset.view; render(); return; }
    const nav = e.target.closest("[data-cal]"); if(nav && !nav.disabled){ calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + +nav.dataset.cal, 1); render(); return; }
    const day = e.target.closest(".day[data-date]"); if(day && !day.disabled){ selDate = day.dataset.date; render(); return; }
    const chip = e.target.closest(".chip"); if(chip){ filter = chip.dataset.g; userPicked = true; openId=null; render(); return; }
    const a = e.target.closest("[data-act]"); if(!a) return;
    const WRITE = ["unit","save","tick","rest","unrest","editday","deleteday","logday","edit","delete","saveEdit"];
    if(WRITE.includes(a.dataset.act) && ro()){ toast(`${prof().name}'s profile is view only`); return; }
    if(a.dataset.act==="delete" && !role.all){ toast("Only the owner can change the exercise list"); return; }
    const card = a.closest(".ex"), ex = card && exById(card.dataset.id);
    switch(a.dataset.act){
      case "unit": { const nx = wUnit(ex, filter)==="lb" ? "kg" : "lb"; (prof().units ||= {})[unitKey(ex, filter)] = nx; persist(); render(); toast(`${ex.name}: ${nx}`); break; }
      case "archive": archOpen[pid+"|"+filter] = a.getAttribute("aria-expanded")!=="true"; render(); break;
      case "toggle": openId = openId===ex.id?null:ex.id; render(); break;
      case "save": { const v = parseFloat(card.querySelector(".val input").value); if(v>=0) log(ex, fromDisp(v, ex, filter)); break; }
      case "tick":
        if(doneToday(ex.id)){ state.logs = state.logs.filter(l=>!(l.exId===ex.id && mine(l) && !l.base && l.date===ad())); persist(); render(); }
        else { const ls = logsFor(ex.id).filter(l=>l.base || l.date<=ad()); log(ex, ls.length ? ls[ls.length-1].value : 0); }
        break;
      case "edit": openDialog(ex); break;
      case "gotoday": setDate(today()); break;
      case "rest": {
        const n = state.logs.filter(l=>mine(l) && !l.base && l.date===ad()).length;
        const doRest = () => { state.logs = state.logs.filter(l=>!mine(l) || l.base || l.date!==ad()); if(!isRest(ad())) rests().push(ad()); userPicked = true; filter = REST; persist(); render(); toast("Rest day logged"); };
        if(n) ask(`You logged ${n} exercise${n>1?"s":""} on this day. Marking it as rest removes ${n>1?"them":"it"}.`, "Mark as rest", "Make this a rest day?").then(ok=>ok&&doRest());
        else doRest();

      case "unrest": prof().rests = rests().filter(d=>d!==ad()); userPicked = false; persist(); render(); break;
      case "editday": startEdit(selDate); break;
      case "deleteday": {

        const target = selDate;
        ask(n ? `This removes everything logged on ${longDate(target)}.` : `This removes the rest day on ${longDate(target)}.`, "Delete", "Delete this day?").then(ok=>{
          if(!ok) return;

      case "delete":
        ask(`${ex.name} is removed from ${listProf().name}'s list only${listOf(prof().id)!==prof().id?` (and ${prof().name}'s, which follows it)`:""}, along with ${prof().name}'s history for it. Everyone else keeps it.`, "Remove", "Remove from your list?").then(ok=>{ if(ok){ (listProf().hidden ||= []).push(ex.id); state.logs = state.logs.filter(l=>!(l.exId===ex.id && mine(l))); persist(); render(); } });

    }
  });

  async function saveEdit(){

      const moving = state.logs.filter(l=>mine(l) && !l.base && l.date===orig);
      const other = state.logs.filter(l=>mine(l) && !l.base && l.date===moveTo).length;
      if((other || (isRest(moveTo) && moving.length)) && !(await ask(`${longDate(moveTo)} already has ${other ? other+" exercise"+(other>1?"s":"")+" logged" : "a rest day"}. Replace ${other?"matching exercises":"it"} with this workout?`, "Replace", "Day already logged"))) return;
      const ids = new Set(moving.map(l=>l.exId));
      state.logs = state.logs.filter(l=>!mine(l) || l.base || l.date!==moveTo || !ids.has(l.exId));
      moving.forEach(l=>l.date = moveTo);
      const wasRest = isRest(orig);
      prof().rests = rests().filter(d=>d!==orig && !(moving.length && d===moveTo));
      if(wasRest && !moving.length && !rests().includes(moveTo)) rests().push(moveTo);
    }
    em = null; persist(); toast(moveTo!==orig ? `Moved to ${niceDate(moveTo)}` : "Changes saved");
    backToHistory(moveTo);
  }

  function renderSplitBox(){
    const me = prof(), cur = splitOf(me), can = canWriteProfile(me.id);
    const core = cur.filter(d=>d!=="Cardio");
    const days = [...new Set(cur.filter(d=>d!=="Rest" && d!=="Cardio"))], fa = me.cardioAfter || [];
    const preset = Object.keys(SPLITS).find(k=>SPLITS[k].join("|")===core.join("|"));
    $("#splitBox").innerHTML = `<h3>${esc(me.name)}'s split</h3>
      <p>${esc(cur.join(" → "))}${can?"":" · view only"}</p>
      ${can ? `<div class="chips">${Object.keys(SPLITS).map(k=>`<button class="chip" data-split="${esc(k)}" aria-pressed="${k===preset}">${esc(k)}</button>`).join("")}</div>
      <label><input type="checkbox" id="cardioRot" ${cur.includes("Cardio")?"checked":""}> Cardio is a day in the rotation</label>
      <p style="margin:10px 0 6px">10-min cardio finisher after:</p>
      <div class="chips">${days.map(d=>`<button class="chip" data-fin="${esc(d)}" aria-pressed="${fa.includes(d)}">${esc(d)}</button>`).join("")}</div>
      <div class="tagadd"><input id="customSplit" placeholder="Custom: e.g. Upper, Lower, Rest, Upper, Lower" value="${preset?"":esc(core.join(", "))}" aria-label="Custom split"><button class="btn ghost" data-act2="customSplit">Use</button></div>` : ""}`;
  }
  function setSplit(days){
    const me = prof(); if(!canWriteProfile(me.id) || !days.length) return;
    const withCardio = $("#cardioRot") && $("#cardioRot").checked;
    const changed = JSON.stringify(days.filter(d=>d!=="Cardio")) !== JSON.stringify(splitOf(me).filter(d=>d!=="Cardio"));
    me.split = [...days.filter(d=>d!=="Cardio"), ...(withCardio ? ["Cardio"] : [])];
    if(changed) me.splitSince = today();
    userPicked = false; filter = null; persist(); renderSplitBox(); render();
    toast(`${me.name}'s split: ${me.split.join(" → ")}`);
  }
  $("#splitBox").addEventListener("click", e=>{
    const b = e.target.closest("[data-split]"); if(b){ setSplit(SPLITS[b.dataset.split]); return; }
    const f = e.target.closest("[data-fin]"); if(f){
      const me = prof(); if(!canWriteProfile(me.id)) return;
      const d = f.dataset.fin, fa = me.cardioAfter || [];
      me.cardioAfter = fa.includes(d) ? fa.filter(x=>x!==d) : [...fa, d];
      persist(); renderSplitBox(); render(); return;
    }
    if(e.target.closest("[data-act2=customSplit]")){ setSplit($("#customSplit").value.split(",").map(x=>x.trim()).filter(Boolean)); }
  });
  $("#splitBox").addEventListener("change", e=>{ if(e.target.id==="cardioRot") setSplit(splitOf(prof())); });

  function setDate(d){
    showAll = false;
    if(em){ if(d > today()) d = today(); em.moveTo = d; render(); return; }
    if(!d) return;
    if(d > today()) d = today();
    activeDate = d === today() ? null : d;
    const sess = sessions().find(x=>x.date===d);
    if(sess){ filter = sess.group; userPicked = true; }
    else if(isRest(d)){ filter = REST; userPicked = true; }
    else if(d === today()) userPicked = false;
    openId = null; render();
  }
  $("#wDate").addEventListener("change", e=>setDate(e.target.value));
  const shift = n => { const d = new Date((em ? em.moveTo : ad())+"T00:00"); d.setDate(d.getDate()+n); setDate(iso(d)); };
  $("#prevDay").onclick = () => shift(-1);
  $("#nextDay").onclick = () => shift(1);
  $("#wDate").addEventListener("click", e=>{ try{ e.target.showPicker && e.target.showPicker(); }catch(_){} });

  function moveInGroup(id, toIdx){
    const inList = e => visible(e) && exInDay(e, filter);
    const ids = state.exercises.filter(inList).map(e=>e.id);
    const from = ids.indexOf(id); if(from<0) return;
    toIdx = Math.max(0, Math.min(ids.length-1, toIdx));
    if(from===toIdx) return;
    ids.splice(from,1); ids.splice(toIdx,0,id);
    let k = 0;
    const byId = Object.fromEntries(state.exercises.map(e=>[e.id,e]));
    state.exercises = state.exercises.map(e => inList(e) ? byId[ids[k++]] : e);
    persist();
  }

  // Reordering needs a deliberate press-and-hold on the handle, so a tap or a scroll never moves anything.
  let drag = null, pend = null;
  const HOLD_MS = 500, HOLD_SLOP = 8;
  const clearPend = () => { if(pend){ clearTimeout(pend.timer); pend.row.classList.remove("pressing"); pend = null; } };
  function beginDrag(){
    const {h, row, y} = pend; clearPend();
    const items = [...$("#list").querySelectorAll(".ex:not(.arch):not(.fin)")];
    openId = null;
    drag = { h, row, items, idx: items.indexOf(row), startY: y, rects: items.map(el=>el.getBoundingClientRect()), target: items.indexOf(row), id: row.dataset.id };
    row.classList.add("dragging"); document.body.classList.add("is-dragging");
    try{ navigator.vibrate && navigator.vibrate(15); }catch(_){}
  }
  document.addEventListener("pointerdown", e=>{
    const h = e.target.closest("[data-handle]"); if(!h || !role.all) return;
    e.preventDefault();
    clearPend();
    const row = h.closest(".ex");
    try{ h.setPointerCapture(e.pointerId); }catch(_){}
    pend = { h, row, x:e.clientX, y:e.clientY, sx:e.clientX, sy:e.clientY, timer:setTimeout(beginDrag, HOLD_MS) };
    row.classList.add("pressing");
  });
  document.addEventListener("contextmenu", e=>{ if(e.target.closest && e.target.closest("[data-handle]")) e.preventDefault(); });
  document.addEventListener("pointermove", e=>{
    if(pend){ pend.y = e.clientY; if(Math.abs(e.clientX-pend.sx)>HOLD_SLOP || Math.abs(e.clientY-pend.sy)>HOLD_SLOP) clearPend(); return; }
    if(!drag) return;
    const {row, items, idx, rects} = drag;
    const top = rects[0].top, bottom = rects[rects.length-1].bottom;
    let dy = e.clientY - drag.startY;
    dy = Math.max(top - rects[idx].top, Math.min(bottom - rects[idx].bottom, dy));
    row.style.transform = `translateY(${dy}px)`;
    const h = rects[idx].height, center = rects[idx].top + h/2 + dy;
    let target = idx;
    items.forEach((el,j)=>{
      if(j===idx) return;
      const mid = rects[j].top + rects[j].height/2;
      if(j>idx && mid < center){ el.style.transform = `translateY(${-h}px)`; target++; }
      else if(j<idx && mid > center){ el.style.transform = `translateY(${h}px)`; target--; }
      else el.style.transform = "";
    });
    drag.target = target;
  });
  const endDrag = ()=>{
    if(pend){ clearPend(); toast("Press and hold to reorder"); return; }
    if(!drag) return;
    const {id, target} = drag;
    drag.items.forEach(el=>el.style.transform="");
    drag.row.classList.remove("dragging"); document.body.classList.remove("is-dragging");
    drag = null;
    moveInGroup(id, target); render();
  };
  document.addEventListener("pointerup", endDrag);
  document.addEventListener("pointercancel", endDrag);
  document.addEventListener("keydown", e=>{
    const h = e.target.closest && e.target.closest("[data-handle]"); if(!h) return;
    if(e.key!=="ArrowUp" && e.key!=="ArrowDown") return;
    e.preventDefault();
    const id = h.closest(".ex").dataset.id;
    const ids = state.exercises.filter(x=>visible(x) && exInDay(x, filter)).map(x=>x.id);
    moveInGroup(id, ids.indexOf(id) + (e.key==="ArrowUp"?-1:1)); render();
    const again = document.querySelector(`.ex[data-id="${id}"] [data-handle]`); again && again.focus();
  });

  function openDialog(ex){
    editingId = ex ? ex.id : null;
    $("#dlgTitle").textContent = ex ? "Edit exercise" : "Add exercise";
    $("#fName").value = ex?.name || "";
    pickTags = ex ? tagsOf(ex).slice() : (filter && filter!==REST && filter!=="Other" ? [...new Set([filter, ...(TAG_MAP[filter]||[])])] : []);
    renderTagPick();
    const base = ex && state.logs.find(l=>l.exId===ex.id && l.base && mine(l));
    $("#fMax").value = base ? fmt(base.value) : "";
    $("#fMaxLabel").textContent = `${prof().name}'s current max (PR)`;
    ["#fName","#fUnit","#fNewTag","#addTagBtn"].forEach(k=>$(k).disabled = !role.all);
    $("#dlgTitle").textContent = !role.all ? `${prof().name}'s PR` : ex ? "Edit exercise" : "Add exercise";
    $("#fUnit").value = ex && ["kg/side","min","km"].includes(ex.unit) ? ex.unit : (!ex && filter==="Cardio" ? "min" : "kg");
    $("#dlg").showModal();
  }
  let pickTags = [];
  function renderTagPick(){
    const tags = [...new Set([...rot(), "Cardio", ...allTags(), ...pickTags])].filter(t=>!t.endsWith(ARCH));
    $("#tagPick").innerHTML = tags.map(t=>`<button type="button" class="chip" data-tag="${esc(t)}" aria-pressed="${pickTags.includes(t)}" ${role.all?"":"disabled"}>${esc(t)}</button>`).join("");
  }
  $("#tagPick").addEventListener("click", e=>{
    const b = e.target.closest("[data-tag]"); if(!b || !role.all) return;
    const t = b.dataset.tag;
    if(pickTags.includes(t)) pickTags = pickTags.filter(x=>x!==t);
    else pickTags = [...new Set([...pickTags, t, ...((TAG_MAP[t]||[]).filter(x=>x!==t))])]; // Back also tags Pull and Upper, and so on
    renderTagPick();
  });
  const addTag = () => { const t = $("#fNewTag").value.trim(); if(!t) return; if(!pickTags.includes(t)) pickTags.push(t); $("#fNewTag").value = ""; renderTagPick(); };
  $("#addTagBtn").onclick = addTag;
  $("#fNewTag").addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); addTag(); } });
  $("#addBtn").onclick = () => openDialog();
  $("#cancelBtn").onclick = () => $("#dlg").close();
  $("#exForm").addEventListener("submit", ev=>{
    try{ submitExercise(); }
    catch(err){ ev.preventDefault(); toast(`Couldn't add: ${(err && err.message) || err}`); console.error(err); }
  });
  function submitExercise(){
    const d = {name:$("#fName").value.trim(), tags: pickTags.length ? pickTags.slice() : ["Other"], unit:$("#fUnit").value};
    if(!d.name) return;
    if(ro()) return;
    let target;
    if(editingId){
      // replace the object rather than editing it in place
      if(role.all){ const k = state.exercises.findIndex(x=>x.id===editingId); const nx = {...state.exercises[k], ...d}; delete nx.group; state.exercises = state.exercises.map((x,i)=>i===k?nx:x); }
      target = exById(editingId);
    }
    else if(!role.all) return;
    else {
      target = {id:uid(), ...d}; state.exercises = [...state.exercises, target];
      if(db) flush("directory").then(r=>{ if(r==="ok"||r==="same"||r==="queued") toast(`${d.name} added for everyone`); });
      else toast(`${d.name} added`);
    }
    const mv = $("#fMax").value.trim();
    const base = state.logs.find(l=>l.exId===target.id && l.base && mine(l));
    if(mv === ""){ if(base && editingId) state.logs = state.logs.filter(l=>l!==base); }
    else if(base) state.logs = state.logs.map(l=>l===base ? {...l, value:+mv} : l);
    else state.logs.push({id:uid(), exId:target.id, p:prof().id, base:true, date:today(), t:0, value:+mv});
    if(!exInDay(target, filter)) filter = dayNames().find(x=>exInDay(target,x)) || filter;
    userPicked = true; persist(); render();
  }

  render();
  $("#sync").textContent = "Demo · sample data"; $("#sync").hidden = false;

  (async ()=>{
    if(!window.claude || !claude.use) return;
    const [d, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if(!d) return;
    const owner = user ? await user.isOwner() : false;
    role.all = owner; role.known = true;
    if(!owner){
      let saved = null; try{ saved = localStorage.getItem(PKEY); }catch(e){}
      if(!saved) pid = "p3";
    }
    render();
    const IDS = ["directory","p1","p2","p3"];
    let snaps;
    try{ snaps = await Promise.all(IDS.map(id=>d.doc("gainz/"+id).get())); }
    catch(e){ toast("Couldn't load shared data"); return; }
    db = d;
    const apply = (id, frozen) => {
      const data = JSON.parse(JSON.stringify(frozen));
      if(id==="directory"){ state.exercises = data.exercises || []; state.groups = data.groups || ["Cardio"]; }
      else {
        const i = state.profiles.findIndex(x=>x.id===id);
        if(data.profile){ if(i>=0) state.profiles[i] = data.profile; else state.profiles.push(data.profile); }
        state.logs = state.logs.filter(l=>(l.p||"p1")!==id).concat((data.logs||[]).map(l=>({...l, p: l.p || id})));
      }
      lastSent[id] = JSON.stringify(JSON.parse(JSON.stringify(bodyOf(id))));
    };
    if(!snaps[0].exists){
      if(!owner){ $("#list").innerHTML = `<div class="empty">This tracker has not been set up yet.</div>`; return; }
      // first run: move the owner's private data into the shared documents
      if(user){ try{ const id = await user.id(); const old = id && await d.doc(`data/users/${id}/tracker`).get(); if(old && old.exists && (old.data().logs||[]).length >= state.logs.length){ state = JSON.parse(JSON.stringify(old.data())); } }catch(e){} }
      ensureGroups(); state.logs.forEach(l=>{ if(!l.p) l.p = "p1"; });
      for(const id of IDS) await flush(id);
    } else {
      state = {exercises:[], logs:[], profiles:[], groups:["Cardio"]};
      IDS.forEach((id,k)=>{ if(snaps[k].exists) apply(id, snaps[k].data()); });
      ensureGroups();
      if(owner && state.exercises.some(e=>e.group!==undefined)){ state.exercises.forEach(e=>{ if(e.tags) delete e.group; }); flush("directory"); }
      state.profiles.forEach(x=>{ if(canWriteProfile(x.id)) flush(x.id); });
      if(owner) state.profiles.forEach(x=>{ if(!snaps[IDS.indexOf(x.id)]?.exists) flush(x.id); });
    }
    if(owner && state.exercises.some(e=>e.owner)){ state.exercises.forEach(e=>delete e.owner); flush("directory"); }
    const order = {p1:0, p2:1, p3:2};
    state.profiles.sort((a,b)=>(order[a.id]??9)-(order[b.id]??9));
    try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){}
    render();
    IDS.forEach(id=>docOf(id).onSnapshot(snap=>{
      if(!snap.exists || writing[id] || saveTimer || em) return;
      const data = snap.data();
      const stable = o => JSON.stringify(o, (k,v)=> v && typeof v==="object" && !Array.isArray(v) ? Object.keys(v).sort().reduce((a,k2)=>(a[k2]=v[k2],a),{}) : v);
      if(stable(data) === stable(JSON.parse(lastSent[id]||"null"))) return;
      apply(id, data); migrateTags(); render();
    }, ()=>{}));
  })();
})();
</script>
</body>
</html>
