<style>
/* Plate on Naturalé: Earth grounds, Bark ink, Moss for what is eaten. One day, four plates. */
:root{
  --linen:#F4EFE6; --paper:#FFFDF8; --bark:#3B2F25; --bark-soft:#6B5A4A; --rule:#E0D6C4;
  --moss:#6B9B63; --moss-ink:#456B3F; --open-bg:#4A7243; --open-fg:#FFFDF8;
  --sun:#9A4A0A; --fire:#B42318; --rain:#2D63A6;
  --pick:color-mix(in srgb,var(--moss) 20%,transparent);
  --lift:rgba(59,47,37,.18); --scrim:rgba(59,47,37,.45);
  --display:"Young Serif",Georgia,"Times New Roman",serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r2:8px; --r4:16px; --r5:24px;
  --gust:cubic-bezier(.34,1.56,.64,1); --breeze:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --linen:#1D1914; --paper:#25201A; --bark:#EFE6D8; --bark-soft:#BCAB95; --rule:#3A3229;
    --moss:#9DC394; --moss-ink:#A9CF9F; --open-bg:#9DC394; --open-fg:#1D1914;
    --sun:#F5A65B; --fire:#F59A92; --rain:#9CC3F0; --lift:rgba(0,0,0,.45); --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --linen:#1D1914; --paper:#25201A; --bark:#EFE6D8; --bark-soft:#BCAB95; --rule:#3A3229;
  --moss:#9DC394; --moss-ink:#A9CF9F; --open-bg:#9DC394; --open-fg:#1D1914;
  --sun:#F5A65B; --fire:#F59A92; --rain:#9CC3F0; --lift:rgba(0,0,0,.45); --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--linen);color:var(--bark);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--bark);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-block:24px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}
h1{font:400 40px/1 var(--display);letter-spacing:-.01em;margin:0}
.sync{font-size:13px;color:var(--bark-soft)}
.nav{flex:none;display:grid;place-items:center;width:44px;height:44px;padding:0;border-radius:50%;border:1px solid var(--rule);background:var(--paper);color:var(--bark);cursor:pointer;transition:border-color .2s,background .2s}
.nav:hover:not(:disabled){border-color:var(--moss);background:var(--linen)}
.nav:disabled{opacity:.35;cursor:default}
.nav svg{display:block;width:20px;height:20px}

.bnav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;gap:4px;background:var(--paper);border-top:1px solid var(--rule);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{flex:1;max-width:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:transparent;color:var(--bark-soft);font:500 12px/1 var(--body);min-height:54px;border-radius:16px;cursor:pointer;transition:background .3s,color .3s}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{background:var(--pick);color:var(--moss-ink);font-weight:600}
html.kb .bnav{display:none}
html.kb #pantryView{padding-bottom:calc(var(--kb,0px) + 70vh)}

.datebar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.datepick{cursor:pointer;color:var(--bark);font-family:inherit;position:relative;flex:1;background:var(--paper);border:1px solid var(--rule);border-radius:999px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 12px}
.datepick b{font:400 18px/1.15 var(--display)}
.datepick small{font-size:12px;color:var(--bark-soft)}
.datepick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0;margin:0;font-size:16px}
.datepick:focus-within{outline:3px solid var(--bark);outline-offset:2px}
.datepick.is-today{border-color:var(--bark);box-shadow:inset 0 0 0 1px var(--bark)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--paper);color:var(--bark);font:500 14px/1 var(--body);padding:12px 16px;min-height:40px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.chip[aria-pressed="true"]{background:var(--pick);border-color:color-mix(in srgb,var(--moss) 45%,transparent);color:var(--moss-ink);font-weight:600}

/* day totals: quiet, Paper card */
.dayc{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r5);padding:16px;margin-bottom:16px;display:flex;flex-direction:column;gap:12px}
.plate{display:flex;align-items:center;gap:20px}
.rings{flex:none;width:136px;height:136px;display:block}

.rings .arc.e{stroke:var(--sun)}
.rings .face{fill:var(--paper);stroke:var(--rule);stroke-width:1}
.rings .big{font:600 24px var(--body);fill:var(--bark);font-variant-numeric:tabular-nums;text-anchor:middle}
.rings .sm{font:500 9px var(--body);fill:var(--bark-soft);text-anchor:middle}
.legend2{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.leg{display:flex;flex-direction:column;gap:2px}
.leg .lbl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--bark-soft)}
.leg .lbl i{width:10px;height:10px;border-radius:50%;flex:none}
.leg .num{font:600 20px/1.1 var(--body);font-variant-numeric:tabular-nums}
.leg .num small{font:500 13px var(--body);color:var(--bark-soft)}
.hint{margin:0;font-size:13px;color:var(--bark-soft)}
.logo{display:block;width:40px;height:40px;color:var(--bark)}
h1{display:flex;align-items:center;gap:12px}

/* plates */
.list{display:flex;flex-direction:column;gap:20px}
.sec{display:flex;flex-direction:column;gap:8px}
.sech{display:flex;align-items:center;gap:12px;padding:0 4px}
.sech h3{flex:1;margin:0;font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--bark-soft)}
.addi{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border:1px solid var(--rule);border-radius:999px;background:var(--linen);color:var(--moss-ink);font:600 13px var(--body);cursor:pointer}
.addi svg{width:16px;height:16px}
.slot{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r5);overflow:hidden}
.slot .top+.top{border-top:1px solid var(--rule)}
.slot .top{display:flex;align-items:flex-start;gap:12px;padding:16px}
.slot .top+.acts{padding-top:0}
.name{flex:1;min-width:0;background:none;border:0;padding:0;color:inherit;font:600 17px/1.3 var(--body);text-align:left;cursor:pointer}
.name small{display:block;margin-top:4px;font-weight:500;font-size:13px;color:var(--bark-soft);font-variant-numeric:tabular-nums}
.name .when{display:block;font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--moss-ink);margin-bottom:4px}
.chev{flex:none;width:20px;height:20px;margin-top:1px;color:var(--bark-soft);transition:transform .3s var(--breeze)}
.chev{cursor:pointer}
.acts{display:flex;gap:8px;padding:0 16px 16px;margin-top:-4px}
.acts .btn{flex:1;min-height:44px;padding:0 12px;font-size:14px;gap:8px}
.acts .btn.sq{flex:none;width:44px;padding:0}
.btn svg{width:18px;height:18px;flex:none}
.portion{display:flex;align-items:center;gap:8px;padding:0 16px 12px;font-size:13px;color:var(--bark-soft)}
.portion b{min-width:44px;text-align:center;font:600 14px var(--body);color:var(--bark);font-variant-numeric:tabular-nums}
.step{width:36px;height:36px;border-radius:50%;border:1px solid var(--rule);background:var(--linen);color:var(--bark);display:grid;place-items:center;cursor:pointer;padding:0}
.step svg{width:16px;height:16px}
.step:disabled{opacity:.35;cursor:default}
.skipped{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 16px 16px;font-size:14px;font-weight:600;color:var(--sun)}
.slot.skip .name{color:var(--bark-soft)}
.portion .link{margin-left:auto}
.slot .top:last-child{padding-bottom:16px}
.g{color:var(--moss-ink);font-weight:600}
.name .g{font-weight:600}
.undo{margin-top:1px;flex:none}
.edited{display:block;margin-top:2px;font-size:12px;color:var(--moss-ink);font-weight:600}
.edrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px 12px;padding:10px 12px 10px 16px;border:1px solid var(--rule);border-radius:var(--r4);background:var(--linen)}
.edrow .nm{min-width:0;overflow-wrap:anywhere;font:500 15px/1.25 var(--body)}

.logged{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 16px 16px;font-size:14px;font-weight:600;color:var(--moss-ink)}
.link{background:none;border:0;padding:0;min-height:32px;color:var(--moss-ink);font:500 14px var(--body);text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.slot.done .name{color:var(--bark-soft)}
.sh-list.recipe{padding:0 16px 8px}
.recipe h4{margin:12px 0 8px;font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--bark-soft)}
.recipe ul,.recipe ol{margin:0;padding-left:20px;font-size:15px;display:flex;flex-direction:column;gap:6px}
.recipe .mx{font-size:13px;color:var(--bark-soft);font-variant-numeric:tabular-nums}
.add{margin-top:12px;width:100%;font:600 15px var(--body);background:transparent;color:var(--bark);border:1.5px dashed color-mix(in srgb,var(--bark-soft) 45%,var(--rule));border-radius:999px;min-height:48px;cursor:pointer}
.add:hover{background:var(--paper)}
.x{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--linen);color:var(--fire);font-size:18px;cursor:pointer}
.empty{padding:32px 16px;text-align:center;color:var(--bark-soft)}

.btn{display:inline-flex;align-items:center;justify-content:center;font:600 15px/1 var(--body);border:1px solid transparent;border-radius:999px;padding:0 24px;min-height:48px;cursor:pointer;background:var(--bark);color:var(--paper);transition:background .2s,color .2s,transform .2s}
.btn:hover{background:var(--open-bg);color:var(--open-fg)}

.btn.go{background:var(--open-bg);color:var(--open-fg)}
.btn.go:hover{background:var(--bark);color:var(--paper)}

/* history */
.cal{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r5);padding:16px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head h3{margin:0;font:400 22px var(--display)}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-size:12px;font-weight:600;color:var(--bark-soft);text-align:center;padding-bottom:4px}
.day{aspect-ratio:1/1.15;border-radius:var(--r2);border:0;background:var(--linen);color:var(--bark);padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font:600 13px var(--body);font-variant-numeric:tabular-nums;cursor:pointer;min-width:0}

.day .tag{font:500 11px/1.2 var(--body);white-space:nowrap}

.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:13px;color:var(--bark-soft)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:4px;margin-right:4px;vertical-align:-1px}
.summary{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r5);padding:16px;margin-top:12px}
.summary h3{margin:0 0 8px;font:400 20px var(--display)}
.summary ul{list-style:none;margin:0;padding:0}
.summary li{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--rule);font-size:15px}
.summary li:first-child{border-top:0}
.summary b{font:600 18px var(--body);font-variant-numeric:tabular-nums}
.summary b small{font:500 13px var(--body);color:var(--bark-soft)}
.note{margin:12px 0 0;font-size:13px;color:var(--bark-soft)}
.seg{display:flex;gap:4px;background:var(--linen);border-radius:999px;padding:4px;margin-bottom:16px}
.segb{flex:1;border:0;background:transparent;color:var(--bark);font:500 14px/1 var(--body);min-height:40px;border-radius:999px;cursor:pointer;transition:background .3s,color .3s}
.segb[aria-pressed="true"]{background:var(--paper);color:var(--moss-ink);font-weight:600;box-shadow:0 1px 2px var(--lift)}
.day.over{background:color-mix(in srgb,var(--fire) 16%,var(--paper))}

/* picker sheet */
dialog{border:0;background:var(--paper);color:var(--bark);padding:0}

dialog.sheet[open]{display:flex;flex-direction:column}
.sh-top{flex:none;padding:12px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}

.sh-top input{width:100%;font:400 16px var(--body);color:var(--bark);background:var(--linen);border:1.5px solid var(--rule);border-radius:999px;padding:0 16px;min-height:48px}

#pnq{scroll-margin-top:12px}

.sh-list{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:56px;padding:8px 16px;border:1px solid var(--rule);border-radius:var(--r4);background:var(--linen);color:var(--bark);font:500 15px/1.25 var(--body);text-align:left;cursor:pointer}
.opt[aria-pressed="true"]{background:var(--pick);border-color:color-mix(in srgb,var(--moss) 45%,transparent);color:var(--moss-ink);font-weight:600}
.opt .m{flex:none;text-align:right;font-size:13px;color:var(--bark-soft);font-variant-numeric:tabular-nums;line-height:1.3}
.opt[aria-pressed="true"] .m{color:var(--moss-ink)}
.sh-foot{flex:none;display:flex;gap:8px;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--rule);background:var(--paper)}
.sh-foot .btn{flex:1;min-height:48px}

.toast{z-index:20;position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-6px);background:var(--bark);color:var(--paper);font:600 14px var(--body);padding:12px 16px;border-radius:999px;box-shadow:0 12px 28px -10px var(--lift);opacity:0;transition:opacity .25s,transform .45s var(--breeze);pointer-events:none;white-space:nowrap;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}
[hidden]{display:none !important}
@media (prefers-reduced-motion:reduce){.toast,.tick,.tab,.chip,.rings .arc,.chev{transition:none}}
.edrow .rm{width:32px;height:32px;border-radius:50%;border:1px solid var(--rule);background:transparent;color:var(--bark-soft);display:grid;place-items:center;cursor:pointer;padding:0}
.edrow .rm svg{width:16px;height:16px}
.edrow .rm:hover{color:var(--sun);border-color:var(--sun)}
.edrow.flash{animation:flash 1.2s var(--breeze)}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--moss)}100%{box-shadow:0 0 0 3px transparent}}
.edrow{grid-template-columns:minmax(0,1fr) auto 32px;align-items:center;gap:12px}
.edrow .qin{gap:6px}
.edrow .qin input{width:72px;text-align:center}
.edrow .qin span{width:40px;min-width:0;white-space:nowrap}
.edacts{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.edacts .btn{width:100%}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 4px;font:600 15px/1.3 var(--body);cursor:pointer}
.swrow small{display:block;margin-top:2px;font-weight:500;font-size:12px;color:var(--bark-soft)}
.sw{appearance:none;-webkit-appearance:none;flex:none;width:48px;height:28px;border-radius:14px;background:var(--rule);position:relative;cursor:pointer;transition:background .2s;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw:checked{background:var(--moss)}

.edacts .note{margin:0;font-size:13px;color:var(--bark-soft);text-align:center}
.addrow{gap:12px;justify-content:space-between;font-weight:500;margin-bottom:8px}
.addrow .nm{min-width:0;display:block;font:500 15px/1.25 var(--body)}
.addrow .nm small{display:block;margin-top:2px;font-size:12px;color:var(--bark-soft)}
.addrow .amt{flex:none;font:600 13px var(--body);color:var(--moss-ink)}
.seg{display:flex;gap:8px;margin:0 0 12px}
.mrow.sel{background:var(--pick);border-color:color-mix(in srgb,var(--moss) 45%,transparent);color:var(--moss-ink);font-weight:600}
.chipb{display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:1;min-height:40px;border:1px solid var(--rule);border-radius:999px;background:var(--linen);color:var(--bark);font:500 14px var(--body);cursor:pointer}
.chipb[aria-pressed="true"]{background:var(--pick);color:var(--moss-ink);border-color:color-mix(in srgb,var(--moss) 45%,transparent);font-weight:600}
.pn-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px}
.pn-head p{margin:0;font-size:14px;color:var(--bark-soft)}
.lines{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r5);overflow:hidden}

.pn-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.pnrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--rule);border-radius:var(--r4);background:var(--linen)}
.pnrow.own{background:var(--pick);border-color:color-mix(in srgb,var(--moss) 45%,transparent)}
.pnrow .nm{flex:1;min-width:0;overflow-wrap:anywhere;font:500 15px/1.25 var(--body)}
.pnrow .nm small{display:block;margin-top:2px;font-size:12px;color:var(--bark-soft);font-variant-numeric:tabular-nums}
.pnrow .btn{min-height:36px;padding:0 12px;font-size:13px;flex:none;gap:6px}
.pnrow .btn svg{width:16px;height:16px}
.wk-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px}
.wk-nav>div{text-align:center;font:500 15px var(--body)}
.wk-nav small{display:block;font-size:12px;color:var(--bark-soft);margin-top:2px}
.need{flex:none;font:600 14px var(--body);color:var(--moss-ink);font-variant-numeric:tabular-nums}
.pnrow.got .nm{color:var(--bark-soft);text-decoration:line-through}
.fxl{margin:0;padding-left:20px;font-size:15px;display:flex;flex-direction:column;gap:6px}
.chipb svg{width:18px;height:18px;flex:none}
.ico{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--pick);color:var(--moss-ink)}
.ico svg{width:20px;height:20px}
.edh{margin:12px 0 4px;font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--bark-soft)}
.edh:first-child{margin-top:0}
.mrow{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 16px;border:1px solid var(--rule);border-radius:var(--r4);background:var(--linen);color:var(--bark);font:600 16px var(--body);text-align:left;cursor:pointer}
.mrow svg{width:20px;height:20px;flex:none;color:var(--bark-soft)}
.mrow.warn{color:var(--sun)}
.mrow.warn svg{color:var(--sun)}
.qin{display:flex;align-items:center;gap:2px;min-width:0}
.qin input{width:64px;text-align:right;font:600 16px var(--body);font-variant-numeric:tabular-nums;color:var(--bark);background:var(--paper);border:1.5px solid var(--rule);border-radius:12px;padding:0 6px;min-height:40px}
.qin input:focus{border-color:var(--bark-soft);outline:none}
.qin span{font-size:13px;color:var(--bark-soft);min-width:22px}
.opt span:first-child{min-width:0;overflow-wrap:anywhere}
.name{overflow-wrap:anywhere}
.edsearch{display:block;width:100%;box-sizing:border-box;min-height:44px;margin:0 0 4px;padding:0 16px;border:1px solid var(--rule);border-radius:999px;background:var(--linen);color:var(--bark);font:500 15px var(--body);-webkit-appearance:none;appearance:none}
.edsearch:focus-visible{outline:2px solid var(--moss-ink);outline-offset:2px}
</style>
</head>

w", 25]], "ing": ["25 g Toblerone White (about 3 triangles)"], "steps": ["Break off about 3 triangles, around 25 g."]}, {"id": "s12-ferrero", "n": "Ferrero Rocher (2 pieces)", "cat": "Snack", "bahar": false, "lib": false, "parts": [["ferrero", 2]], "ing": ["2 Ferrero Rocher"], "steps": ["Unwrap and enjoy."]}, {"id": "s13-makhana-lime-chilli", "n": "Mr Makhana Lime & Chilli", "cat": "Snack", "bahar": false, "lib": false, "parts": [["mmlc", 30]], "ing": ["30 g Mr Makhana Lime & Chilli"], "steps": ["Pour out 30 g from the pack."]}, {"id": "s14-makhana-peri-peri", "n": "Mr Makhana Peri Peri", "cat": "Snack", "bahar": false, "lib": false, "parts": [["mmpp", 30]], "ing": ["30 g Mr Makhana Peri Peri"], "steps": ["Pour out 30 g from the pack."]}, {"id": "s15-caramel-popcorn", "n": "4700BC Salted Caramel popcorn (60 g pack)", "cat": "Snack", "bahar": false, "lib": false, "parts": [["pop", 60]], "ing": ["1 pack (60 g) 4700BC Salted Caramel popcorn"], "steps": ["Open the 60 g pack."]}, {"id": "b10-paneer-white-scramble-toast", "n": "Paneer & egg-white scramble on toast + coffee", "cat": "Brunch", "bahar": false, "lib": false, "steps": ["Crumble the paneer into a hot non-stick pan with the egg whites, olives, pepper and salt.", "Stir 3 to 4 minutes until just set.", "Toast the bread and pile the scramble on top.", "Coffee (hot or iced): whisk 1 tsp Nescafe Classic, 1 tsp sugar and a splash of hot water until frothy. Top with 150 ml Amul Slim n Trim, hot or poured over ice."], "parts": [["toast", 2], ["paneer", 60], ["white", 4], ["olives", 10], ["cap", 1]]}, {"id": "b11-achari-paratha-bhurji", "n": "Achari paratha + egg bhurji + coffee", "cat": "Brunch", "bahar": false, "lib": false, "steps": ["Heat 1 tsp oil in a pan and cook the frozen paratha 2 to 3 minutes each side on medium flame until golden.", "Scramble the egg and whites in the same pan with pepper and salt, 2 minutes.", "Serve the bhurji alongside the paratha.", "Coffee (hot or iced): whisk 1 tsp Nescafe Classic, 1 tsp sugar and a splash of hot water until frothy. Top with 150 ml Amul Slim n Trim, hot or poured over ice."], "parts": [["para", 1], ["egg", 1], ["white", 4], ["oil", 1], ["cap", 1]]}, {"id": "s16-paneer-jalapeno-dip", "n": "Paneer cubes, jalapeno cheese dip", "cat": "Snack", "bahar": false, "lib": false, "steps": ["Cube the paneer, sear 1 minute in a dry pan if you like, and dip in the Amul jalapeno cheese sauce."], "parts": [["paneer", 125], ["jsauce", 20]]}, {"id": "s17-white-feta-cup", "n": "Egg-white feta cup", "cat": "Snack", "bahar": false, "lib": false, "steps": ["Whisk the whites in a mug with the crumbled feta, olives, corn, pepper and a pinch of salt.", "Microwave 90 seconds, stir, then another 30 to 60 seconds until set."], "parts": [["white", 5], ["feta", 30], ["olives", 10], ["corn", 20]]}, {"id": "s18-boiled-eggs-dip", "n": "2 boiled eggs + 2 whites, jalapeno cheese dip", "cat": "Snack", "bahar": false, "lib": false, "steps": ["Boil the 2 eggs and 2 egg whites together for about 8 minutes.", "Halve and dip in the Amul jalapeno cheese sauce."], "parts": [["egg", 2], ["white", 2], ["jsauce", 20]]}, {"id": "s19-strawberry-whey-icecream", "n": "Go Zero vanilla + strawberries, whey stirred in", "cat": "Snack", "bahar": false, "lib": false, "steps": ["Let 100 ml Go Zero soften for a minute and stir in a scoop of Avvatar whey until smooth.", "Top with sliced strawberries."], "parts": [["gozero", 100], ["whey", 1], ["straw", 100]]}]}</script>
<script>
addEventListener("error",function(e){var b=document.getElementById("err");if(b){b.hidden=false;b.textContent="Plate hit an error: "+(e.message||"unknown")}});
(function(){
  const yr = t => t.replace(/\b20(\d\d)\b/, "\u2019$1");
  const TARGET = {kcal:1800, protein:150, floor:140};
  const SLOTS = [
    {id:"brunch", label:"Brunch", when:"Brunch", cat:"Brunch"},
    {id:"snack", label:"Snack", when:"Snack, 4:30 to 7 pm", cat:"Snack"},
    {id:"snack2", label:"Second snack", when:"Second snack", cat:"Snack", opt:true},
    {id:"dinner", label:"Dinner", when:"Dinner", cat:"Dinner"},
    {id:"shake", label:"Shake", when:"Shake", cat:"Shake"},
    {id:"shake2", label:"Second shake", when:"Second shake", cat:"Shake", opt:true}
  ];
  // A second shake is optional: it only counts once you add it for that day.
  const slotsFor = d => {
    const on = (state.days[d] && state.days[d].on) || {};
    const auto = {}; SLOTS.filter(s=>!s.opt).forEach(s=>{ const m = chosen(d,s); if(m && m.also) auto[m.also] = true; });
    return SLOTS.filter(s=>!s.opt || on[s.id]===true || (auto[s.id] && on[s.id]!==false));
  };
  const POOL = {
    brunch:["b7-omelette-toasts-coffee", "b9-paneer-cheese-toasts-coffee", "b7-omelette-toasts-coffee", "b6-beans-cheese-toast-omelette", "b8-skyr-bowl-coffee", "b7-omelette-toasts-coffee", "b8-skyr-bowl-coffee"],
    snack:["s6-apple-skyr", "s16-paneer-jalapeno-dip", "s6-apple-skyr", "s1-yoghurt-bowl", "s17-white-feta-cup", "s19-strawberry-whey-icecream", "s16-paneer-jalapeno-dip"],
    dinner:["n3-paneer-pasta-toast", "n4-cheela-dinner", "n1-paneer-masala-roti", "n5-uttapam-dinner", "n1-paneer-masala-roti", "n3-paneer-pasta-toast", "n2-burrito-skyr-dip"],
    shake:["sh7-choc-banana-shake", "sh5-thick-choc-skyr-shake-banana", "sh7-choc-banana-shake", "sh2-avvatar-shake-banana", "sh7-choc-banana-shake", "sh4-thick-choc-skyr-shake", "sh2-avvatar-shake-banana"],
    shake2:["sh7-choc-banana-shake", "sh5-thick-choc-skyr-shake-banana", "sh8-coffee-shake", "sh5-thick-choc-skyr-shake-banana", "sh6-mocha-shake", "sh4-thick-choc-skyr-shake", "sh1-avvatar-shake"]
  };
  POOL.snack2 = ["s17-white-feta-cup", "s6-apple-skyr", "s16-paneer-jalapeno-dip", "s18-boiled-eggs-dip", "s18-boiled-eggs-dip", "s16-paneer-jalapeno-dip", "s17-white-feta-cup"];
  const IC = {
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    skip:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    swap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>',
    minus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12"/></svg>',
    plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg>',
    more:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
    tune:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>'
  };
  const GROUPS = ["Brunch","Snack","Dinner","Shake","Dessert","Order in","Library"];

  // Library: ingredients and meals. A meal is a list of ingredients with quantities (or fixed macros for order-ins and home-cooked dishes).
  const SEED = JSON.parse(document.getElementById("seed").textContent);
  const ING = {}; SEED.ingredients.forEach(i=>ING[i.id]=i);
  const lib = SEED.meals;
  const byId = id => lib.find(x=>x.id===id);

  const LS = "plate-v3";
  let state = {days:{}, custom:{}, pantry:{}, shop:{}, v:3};
  try{ const s = localStorage.getItem(LS); if(s) state = Object.assign(state, JSON.parse(s)); else { const o = localStorage.getItem("plate-v2") || localStorage.getItem("plate-v1"); if(o){ state = Object.assign(state, JSON.parse(o)); Object.keys(state.days||{}).forEach(d=>{ delete state.days[d].ov; }); } } }catch(e){}
  let db = null, dbP = null, saveTimer = null;
  let view = "today", cur = null, openSlot = null, calMonth = null, pick = null, editSlot = null, moreSlot = null;

  const $ = s => document.querySelector(s);
  const esc = s => { const d=document.createElement("div"); d.textContent=s==null?"":s; return d.innerHTML; };
  const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const todayIso = () => iso(new Date());
  const addDays = (s,n) => { const d = new Date(s+"T00:00"); d.setDate(d.getDate()+n); return iso(d); };
  const epochDay = s => Math.floor(new Date(s+"T00:00").getTime()/864e5);
  const nice = d => new Date(d+"T00:00").toLocaleDateString(undefined,{weekday:"long"});
  const rec = d => (state.days[d] ||= {picks:{}, logged:{}, extra:[], ov:{}});
  const hasRec = d => { const r = state.days[d]; return r && (Object.keys(r.logged||{}).length || (r.extra||[]).length); };
  const fq = q => String(Math.round(q*10)/10);
  const UNITS = ["g","ml","tsp","tbsp","scoop"];
  const qtxt = (g,q) => UNITS.includes(g.u) ? fq(q)+" "+g.u : fq(q)+" ×";
  const qshort = (g,q) => UNITS.includes(g.u) ? fq(q)+(g.u==="g"||g.u==="ml"?g.u:" "+g.u) : fq(q);

  /* meal maths */
  const ovOf = (d,sid) => { const r = state.days[d]; return (r && r.ov && r.ov[sid]) || {}; };
  // The meal's own recipe, or the version you saved as your default.
  const defOf = m => ((state.custom||{})[m.id]) || m.parts || [];
  const defMap = m => { const o = {}; defOf(m).forEach(([i,q])=>o[i]=q); return o; };
  // Order is stable: default items first, then anything added, in the order it was added.
  function partsOf(m, ov){
    const order = defOf(m).map(a=>a[0]); Object.keys(ov||{}).forEach(i=>{ if(!order.includes(i)) order.push(i); });
    const map = defMap(m); Object.keys(ov||{}).forEach(i=>map[i]=ov[i]);
    return order.filter(i=>map[i]>0 && ING[i]).map(i=>[i,map[i]]);
  }
  function macOf(m, ov){
    let k=m.k||0, p=m.p||0, c=m.c||0, f=m.f||0;
    partsOf(m,ov).forEach(([i,q])=>{ const g=ING[i]; k+=g.k*q; p+=g.p*q; c+=g.c*q; f+=g.f*q; });
    return {k:Math.round(k), p:Math.round(p), c:Math.round(c), f:Math.round(f)};
  }
  function editText(m, ov){
    const def = defMap(m);
    return Object.keys(ov||{}).filter(i=>ING[i] && (ov[i]||0)!==(def[i]||0)).map(i=>{ const d=(ov[i]||0)-(def[i]||0); return (d>0?"+":"−")+qshort(ING[i],Math.abs(d))+" "+ING[i].s.toLowerCase(); }).join(", ");
  }

  // Edited meals get a title built from what is actually in them.
  function titleOf(m, ov){
    if(!editText(m,ov) && !(state.custom && state.custom[m.id])) return m.n;
    const parts = partsOf(m,ov).map(([i,q])=>({i,q,k:ING[i].k*q,p:ING[i].p*q}));
    if(!m.parts){ const add = parts.map(x=>ING[x.i].s).filter((v,j,a)=>a.indexOf(v)===j); return add.length ? m.n+" + "+add.join(" + ") : m.n; }
    const main = parts.filter(x=>x.k>=40||x.p>=3).slice(0,5).map(x=>ING[x.i].s).filter((v,j,a)=>a.indexOf(v)===j);
    return main.length ? main.join(" + ") : m.n;
  }
  function suggested(d, slot){
    const pool = POOL[slot.id], n = epochDay(d);
    for(let i=0;i<pool.length;i++){ const m = byId(pool[(((n+i)%pool.length)+pool.length)%pool.length]); if(m) return m; }
    return lib.find(x=>x.cat===slot.cat && !x.bahar && !x.lib) || null;
  }
  function chosen(d, slot){
    const r = state.days[d], id = r && r.picks && r.picks[slot.id];
    return (id && byId(id)) || suggested(d, slot);
  }
  function totals(d){
    const r = state.days[d] || {logged:{},extra:[]};
    let planned = {k:0,p:0}, eaten = {k:0,p:0};
    slotsFor(d).forEach(s=>{
      const l = r.logged && r.logged[s.id];
      if(l && l.skip){ }
      else if(l){ eaten.k += l.k; eaten.p += l.p; planned.k += l.k; planned.p += l.p; }
      else { const m = chosen(d,s); if(m){ const v = macOf(m, ovOf(d,s.id)); planned.k += v.k; planned.p += v.p; } }
    });
    (r.extra||[]).forEach(x=>{ eaten.k += x.k; eaten.p += x.p; planned.k += x.k; planned.p += x.p; });
    return {planned, eaten};
  }

  function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("show"),2200); }
  function setSync(t){ const s=$("#sync"); s.hidden=false; s.textContent=t; clearTimeout(setSync.t); setSync.t=setTimeout(()=>{s.hidden=true},2000); }
  const wait = (p,ms) => Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),ms))]);
  // The database is only touched when you log something or open History, never on first paint.
  function getDb(){
    return dbP || (dbP = (async()=>{
      try{
        const c = window.claude; if(!c || !c.use) return null;
        const d = await wait(c.use("db"), 8000); if(!d) return null;
        const lg = await wait(d.doc("plate/log").get(), 8000);
        if(lg.exists){
          const remote = (lg.data()||{}).days || {};
          state = {days: Object.assign({}, remote, state.days), custom: Object.assign({}, (lg.data()||{}).custom||{}, state.custom||{}), pantry: Object.assign({}, (lg.data()||{}).pantry||{}, state.pantry||{}), shop: Object.assign({}, (lg.data()||{}).shop||{}, state.shop||{}), v:3}; if(!state.v){ Object.keys(state.days).forEach(d=>{ delete state.days[d].ov; }); }
          try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){}
        }
        db = d; return d;
      }catch(e){ console.warn("db unavailable", e); dbP = null; return null; }
    })());
  }
  function persist(){
    try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){}
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async ()=>{
      const d = await getDb(); if(!d) return;
      try{ await d.doc("plate/log").set(JSON.parse(JSON.stringify(state))); setSync("Saved"); }
      catch(e){ setSync("Not saved"); console.warn("save failed", e); }
    }, 600);
  }

  function renderDay(){
    const d = cur;
    $("#dateLabel").textContent = d===todayIso() ? "Today" : nice(d);
    $("#dateSub").textContent = yr(new Date(d+"T00:00").toLocaleDateString(undefined,{day:"numeric",month:"long",year:"numeric"}));
    $("#datepick").classList.toggle("is-today", d===todayIso());
    const t = totals(d);
    const pctK = Math.min(100, t.eaten.k/TARGET.kcal*100), pctP = Math.min(100, t.eaten.p/TARGET.protein*100);
    const dash = pc => (100 - Math.max(0.0001, pc)).toFixed(2);
    $("#dayCard").innerHTML = `<div class="dayc">
      <div class="plate">
        <svg class="rings" viewBox="0 0 120 120" role="img" aria-label="${Math.round(t.eaten.p)} of ${TARGET.protein} grams protein, ${Math.round(t.eaten.k)} of ${TARGET.kcal} kilocalories">
          <circle class="trk" cx="60" cy="60" r="53"/><circle class="arc e" cx="60" cy="60" r="53" pathLength="100" stroke-dasharray="100" stroke-dashoffset="${dash(pctK)}"/>
          <circle class="trk" cx="60" cy="60" r="39"/><circle class="arc p" cx="60" cy="60" r="39" pathLength="100" stroke-dasharray="100" stroke-dashoffset="${dash(pctP)}"/>
          <circle class="face" cx="60" cy="60" r="29"/>
          <text class="big" x="60" y="62">${Math.round(t.eaten.p)}</text><text class="sm" x="60" y="75">g protein</text>
        </svg>
        <div class="legend2">
          <div class="leg"><span class="lbl"><i style="background:var(--open-bg)"></i>Protein</span><span class="num">${Math.round(t.eaten.p)}<small> of ${TARGET.protein} g</small></span></div>
          <div class="leg"><span class="lbl"><i style="background:var(--sun)"></i>Energy</span><span class="num">${Math.round(t.eaten.k).toLocaleString()}<small> of ${TARGET.kcal.toLocaleString()} kcal</small></span></div>
        </div>
      </div>
      <p class="hint">If you stick to plan: ${Math.round(t.planned.k)} kcal, ${Math.round(t.planned.p)} g protein.</p></div>`;
    renderList();
  }

  function recipeHtml(m, ov){
    const v = macOf(m, ov);
    const parts = partsOf(m, ov);
    const ing = parts.length ? `<h4>You need</h4><ul>${parts.map(([i,q])=>`<li>${qtxt(ING[i],q)} ${esc(ING[i].n)}</li>`).join("")}</ul>`
      : (m.ing||[]).length ? `<h4>You need</h4><ul>${m.ing.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>` : "";
    const st = (m.steps||[]).length ? `<h4>${m.bahar?"How":"How to make it"}</h4><ol>${m.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>` : "";
    return `<p class="mx">${v.k} kcal · ${v.p} g protein · ${v.c} g carbs · ${v.f} g fat</p>${ing}${st}`;
  }

  function renderList(){
    const d = cur, r = state.days[d] || {logged:{},extra:[]};
    let h = "";

    if(t.id==="prevDay") return go(addDays(cur,-1));
    if(t.id==="nextDay") return go(addDays(cur,1));
    if(t.id==="datepick"){ calMonth = new Date(new Date(cur+"T00:00").getFullYear(), new Date(cur+"T00:00").getMonth(), 1); renderHistory(); $("#calSheet").showModal(); if(!db) getDb().then(d=>{ if(d && $("#calSheet").open) renderHistory(); }); return; }
    if(t.dataset.cal){ calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+Number(t.dataset.cal), 1); return renderHistory(); }
    if(t.classList.contains("day") && t.dataset.d){ $("#calSheet").close(); return go(t.dataset.d); }
    if(t.id==="addBtn") return openPicker("add");
    if(t.id==="shCancel") return closePicker();
    if(t.id==="edDone") return closeEditor();
    if(t.id==="edReset"){ const r = rec(cur); if(r.ov) delete r.ov[editSlot]; return commit(); }
    if(t.id==="edAdd") return openAdd();
    if(t.dataset.pntab){ pnTab = t.dataset.pntab; return renderPantry(); }
    if(t.dataset.pnadd){
      slotFor = t.dataset.pnadd; const g = ING[slotFor], r = state.days[cur]||{};
      $("#slHint").textContent = `Which meal did you have ${g.n} with?`;
      $("#slList").innerHTML = slotsFor(cur).map(sl=>{ const m = chosen(cur,sl), sk = r.logged && r.logged[sl.id] && r.logged[sl.id].skip; return `<button class="mrow" data-slpick="${sl.id}" ${sk?"disabled":""}><span class="nm">${esc(sl.label)}<small style="display:block;font-weight:500;font-size:12px;color:var(--bark-soft)">${esc(titleOf(m,ovOf(cur,sl.id)))}${sk?" · missed":""}</small></span></button>`; }).join("");
      return $("#slotSheet").showModal();
    }
    if(t.dataset.slpick){
      const sid = t.dataset.slpick, mm = chosen(cur,SLOTS.find(x=>x.id===sid)); $("#slotSheet").close(); openEditor(sid);
      if(partsOf(mm,ovOf(cur,sid)).some(a=>a[0]===slotFor)){ const el = $("#edList").querySelector(`[data-row="${slotFor}"]`); if(el){ el.scrollIntoView({block:"nearest"}); el.classList.add("flash"); } return toast("Already in this meal. Change the amount here."); }
      return addIng(slotFor); }
    if(t.dataset.dupto){ dupTo = t.dataset.dupto; return renderDup(); }
    if(t.id==="dupCancel") return $("#dupSheet").close();
    if(t.id==="dupOk") return doDup();
    if(t.id==="slCancel") return $("#slotSheet").close();
    if(t.id==="edRestore") return restoreDefault();
    if(t.id==="adCancel") return $("#addSheet").close();
    if(t.id==="rcClose") return $("#recipeSheet").close();
    if(t.dataset.add) return addIng(t.dataset.add);
    if(t.dataset.rm) return removeIng(t.dataset.rm);
    if(t.dataset.ed) return bumpIng(t.dataset.ed, Number(t.dataset.dir));
    if(t.dataset.more){
      const sid = moreSlot; $("#moreSheet").close();
      if(t.dataset.more==="change") return openPicker("replace", sid);
      if(t.dataset.more==="adjust") return openEditor(sid);
      if(t.dataset.more==="how") return openRecipe(sid);
      if(t.dataset.more==="dup") return openDup(sid);
      if(t.dataset.more==="skip"){ rec(cur).logged[sid] = {skip:true}; persist(); return renderDay(); }
      return;
    }
    if(t.id==="moreCancel") return $("#moreSheet").close();
    if(t.id==="shOk"){
      const m = byId(pick.sel); if(!m) return; const v = macOf(m,{});
      rec(cur).extra.push({id:m.id,n:m.n,k:v.k,p:v.p}); persist(); closePicker(); renderDay(); toast("Logged "+m.n); return;
    }
    if(t.dataset.g && pick){ pick.group = t.dataset.g; $("#q").value = ""; return renderPicker(); }
    if(t.classList.contains("opt") && pick){
      if(pick.mode==="replace"){
        const r = rec(cur); r.picks[pick.slot] = t.dataset.id; delete r.logged[pick.slot]; if(r.ov) delete r.ov[pick.slot];
        persist(); closePicker(); renderDay(); return toast("Changed");
      }
      pick.sel = t.dataset.id; $("#shOk").hidden = false;
      const m = byId(pick.sel), v = macOf(m,{}); $("#shOk").textContent = `Log ${m.n} (${v.k} kcal, ${v.p} g)`;
      return renderPicker();
    }
    const slotEl = t.closest("[data-slot]"), act = t.dataset.act;
    if(!act) return;
    if(act==="addshake2"){ const r = rec(cur); (r.on ||= {}).shake2 = true; persist(); return renderDay(); }
    if(act==="rmextra"){ rec(cur).extra.splice(Number(t.dataset.j),1); persist(); return renderDay(); }
    if(!slotEl) return;
    const sid = slotEl.dataset.slot;
    if(act==="rmslot"){ const r = rec(cur); (r.on ||= {})[sid] = false; delete r.logged[sid]; delete r.picks[sid]; if(r.ov) delete r.ov[sid]; persist(); return renderDay(); }
    if(act==="additem"){ editSlot = sid; return openAdd(); }
    if(act==="open") return tapSlot(sid);
    if(act==="more"){ moreSlot = sid; return $("#moreSheet").showModal(); }
    if(act==="ate"){
      const s = SLOTS.find(x=>x.id===sid), m = chosen(cur,s), v = macOf(m, ovOf(cur,sid));
      rec(cur).logged[sid] = {id:m.id,n:titleOf(m,ovOf(cur,sid)),k:v.k,p:v.p}; persist(); return renderDay();
    }
    if(act==="undo"){ delete rec(cur).logged[sid]; persist(); return renderDay(); }
  });
  $("#edList").addEventListener("input", e=>{ const i = e.target.dataset && e.target.dataset.edin; if(!i) return; const q = parseFloat(e.target.value)||0, g = ING[i], sm = e.target.closest(".edrow").querySelector("[data-mac]"); if(sm) sm.textContent = `${Math.round(g.k*q)} kcal · ${Math.round(g.p*q*10)/10} g protein`; });
  $("#edList").addEventListener("change", e=>{ if(e.target.id==="edLive"){ editLive = e.target.checked; return commit(); } const i = e.target.dataset && e.target.dataset.edin; if(i) setIng(i, parseFloat(e.target.value)); });
  $("#adq").addEventListener("input", renderAdd);
  $("#addSheet").addEventListener("close", ()=>{ if(!$("#edSheet").open) editSlot = null; });
  $("#pantryView").addEventListener("input", e=>{ if(e.target.id==="pnq"){ pnQ = e.target.value; renderPantry(); } });
  $("#pantryView").addEventListener("change", e=>{     const i = e.target.dataset && e.target.dataset.own; if(i){ state.pantry ||= {}; if(e.target.checked) state.pantry[i]=1; else delete state.pantry[i]; persist(); renderPantry(); } });
  $("#q").addEventListener("input", ()=>{ if(pick) renderPicker(); });
  $("#sheet").addEventListener("close", ()=>{ pick = null; });
  $("#edSheet").addEventListener("close", ()=>{ editSlot = null; renderDay(); });

  // Keep sheets above the on-screen keyboard.
  (function(){
    const vv = window.visualViewport, root = document.documentElement; if(!vv) return;
    const sync = () => {
      const kb = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
      root.style.setProperty("--kb", kb+"px"); root.style.setProperty("--vvh", Math.round(vv.height)+"px"); root.classList.toggle("kb", kb>80);
      const a = document.activeElement; if(kb>80 && a && a.id==="pnq") requestAnimationFrame(()=>{ try{ a.scrollIntoView({block:"start"}); }catch(_){} });
    };
    vv.addEventListener("resize", sync); vv.addEventListener("scroll", sync); sync();
  })();
  ["calSheet","moreSheet","recipeSheet","dupSheet","slotSheet"].forEach(id=>{ const dlg = $("#"+id); dlg.addEventListener("click", e=>{ const r = dlg.getBoundingClientRect(); if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom) dlg.close(); }); });
  $("#pantryView").addEventListener("focusin", e=>{ if(e.target.id==="pnq") setTimeout(()=>{ try{ e.target.scrollIntoView({block:"start",behavior:"smooth"}); }catch(_){} }, 320); });

  cur = todayIso();
  show("today");
})();
</script>
</body>
</html>
