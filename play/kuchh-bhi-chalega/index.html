<style>
body{margin:0}
/* Layout: one turmeric page, a single slot window as the hero, the menu list underneath. */
:root{
  --bg:#F3BC36; --surface:#FFF4D6; --fg:#45101C; --muted:#7A4A35; --accent:#B81D38; --on-accent:#FFF4D6;
  --ok:#1C7355; --line:#45101C33;
  --display:"Rozha One","Georgia",serif; --body:"Hind","Segoe UI",system-ui,sans-serif;
  --row:92px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#260B12; --surface:#3A131D; --fg:#FBE7B4; --muted:#D3A98A; --accent:#F3BC36; --on-accent:#260B12;
  --ok:#6FD3A8; --line:#FBE7B433; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#260B12; --surface:#3A131D; --fg:#FBE7B4; --muted:#D3A98A; --accent:#F3BC36; --on-accent:#260B12;
  --ok:#6FD3A8; --line:#FBE7B433; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:28px 56px;display:flex;flex-direction:column;gap:28px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,10vw,3.4rem);line-height:1;margin:0;text-wrap:balance}
.sub{margin:8px 0 0;color:var(--muted)}
.eyebrow{margin:0 0 6px;font-family:var(--body);font-size:.95rem;font-weight:600;letter-spacing:.04em;color:var(--muted)}
h2{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--fg);outline-offset:2px}

.machine{background:var(--surface);border:3px solid var(--fg);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:14px;box-shadow:6px 6px 0 var(--fg)}
.window{height:var(--row);overflow:hidden;border-radius:12px;border:2px solid var(--fg);background:var(--bg);position:relative}
.reel{will-change:transform}
.reel div{height:var(--row);display:flex;align-items:center;justify-content:center;text-align:center;padding:0 12px;
  font-family:var(--display);font-size:clamp(1.25rem,5.6vw,1.8rem);line-height:1.1;overflow-wrap:anywhere}
.reel.spin{transition:transform 2.4s cubic-bezier(.12,.72,.12,1)}
.window.blur .reel div{filter:blur(1.2px)}
.pull{background:var(--accent);color:var(--on-accent);border:2px solid var(--fg);border-radius:14px;padding:14px 16px;
  font-family:var(--display);font-size:1.35rem;width:100%}
.pull:active{transform:translateY(2px)}
.pull:disabled{opacity:.6;cursor:default}

.detail{display:flex;flex-direction:column;gap:12px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.stats li{border:1.5px solid var(--line);border-radius:999px;padding:3px 12px;font-variant-numeric:tabular-nums}
.stats b{font-weight:600}
.note{color:var(--muted);margin:0;font-size:.95rem}
.ings{display:flex;flex-wrap:wrap;gap:8px}
.ing{background:transparent;border:1.5px solid var(--fg);border-radius:10px;padding:6px 12px}
.ing[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.ing[aria-pressed="true"]::before{content:"✓ "}
.have{font-weight:600}
.have.all{color:var(--ok)}

.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ghost{background:transparent;border:2px solid var(--fg);border-radius:10px;padding:7px 14px;font-weight:600}
.list{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--line)}
.list li{border-bottom:1.5px solid var(--line);display:flex;align-items:center;gap:8px}
.list li.g{font-family:var(--display);font-size:1.15rem;padding:16px 2px 6px;justify-content:space-between}
.list li.g small{font-family:var(--body);font-size:.85rem;color:var(--muted)}
.list .item{flex:1;min-width:0}
.x{background:transparent;border:1.5px solid var(--line);border-radius:8px;padding:4px 10px;color:var(--accent);font-weight:600;white-space:nowrap}
.x.sure{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.tabs{display:flex;gap:8px}
.tab{flex:1;min-width:0;background:transparent;border:2px solid var(--fg);border-radius:999px;padding:7px 4px;font-weight:600}
.tab[aria-pressed="true"]{background:var(--fg);color:var(--surface)}
select{font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--fg);border-radius:8px;padding:9px 10px;width:100%}
.item{display:flex;align-items:baseline;gap:10px;width:100%;background:none;border:0;padding:12px 2px;text-align:left}
.item .n{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.item .m{color:var(--muted);font-size:.9rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.tag{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted)}

form{background:var(--surface);border:2px solid var(--fg);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;font-weight:600;min-width:0}
label small{font-weight:400;color:var(--muted)}
input,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--fg);border-radius:8px;padding:9px 10px;width:100%}
textarea{resize:vertical;min-height:64px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:440px){.grid{grid-template-columns:repeat(2,1fr)}}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.save{background:var(--fg);color:var(--surface);border:2px solid var(--fg);border-radius:10px;padding:8px 18px;font-weight:600}
.del{margin-left:auto;color:var(--accent);border-color:var(--accent)}
.err{color:var(--accent);margin:0;font-weight:600}
@media (prefers-reduced-motion: reduce){.reel.spin{transition:none}.window.blur .reel div{filter:none}}
/* ---------- polish ---------- */
.wrap{padding-block:36px 120px;gap:32px}
h1{font-size:clamp(2.1rem,9.5vw,3.2rem);line-height:1.02}
.machine{gap:16px;padding:16px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border:2px solid var(--fg);border-radius:999px;background:var(--bg)}
.tab{border:0;border-radius:999px;padding:8px 4px;font-weight:600;font-size:.95rem}
.tab[aria-pressed="true"]{background:var(--fg);color:var(--surface)}
.pull{font-size:1.5rem;letter-spacing:.01em;box-shadow:0 4px 0 var(--fg);transition:transform .12s,box-shadow .12s}
.pull:active{transform:translateY(3px);box-shadow:0 1px 0 var(--fg)}
.head{display:grid;gap:4px;margin-bottom:12px}
.head h2{font-size:1.75rem;line-height:1.1}
.status{margin:0;font-size:.85rem;line-height:1.4;color:var(--muted);opacity:.85}
.list{border-top:0}
.list li{border-bottom:1.5px solid var(--line)}
.list li.g{display:flex;align-items:baseline;justify-content:space-between;font-family:var(--display);font-size:1.25rem;padding:24px 0 8px;border-bottom:2px solid var(--fg)}
.list li.g:first-child{padding-top:4px}
.list li.g small{font-family:var(--body);font-size:.8rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.list li.empty{padding:14px 0;color:var(--muted);font-size:.9rem}
.list li.sw{position:relative;overflow:hidden;display:block;transition:height .26s ease,opacity .2s}
.list li.sw.gone{opacity:0}
.list li.sw .x{position:absolute;inset:0 0 0 auto;width:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;border-radius:0;padding:0;background:var(--accent);color:var(--on-accent);font-size:.8rem;font-weight:600}
.list li.sw .x svg{width:20px;height:20px}
.item{position:relative;z-index:1;display:grid;gap:2px;padding:12px 0;background:var(--bg);transition:transform .28s cubic-bezier(.2,.8,.2,1);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.list li.sw.drag .item{transition:none}
.item .n{font-weight:600;font-size:1.05rem;line-height:1.3}
.item .m{font-size:.85rem;line-height:1.3;color:var(--muted);white-space:normal}
.fab{position:fixed;z-index:20;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));display:inline-flex;align-items:center;gap:8px;height:56px;padding:0 22px 0 18px;border-radius:999px;border:2px solid var(--fg);background:var(--accent);color:var(--on-accent);font-weight:600;font-size:1rem;box-shadow:4px 4px 0 var(--fg);transition:transform .15s,box-shadow .15s}
.fab svg{width:22px;height:22px}
.fab:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--fg)}
html.embedded .fab{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
html.sheet-open .fab{opacity:0;pointer-events:none}
.scrim{position:fixed;inset:0;z-index:30;background:rgba(40,10,16,.45)}
.sheet{position:fixed;z-index:31;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;border-bottom:0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px -10px rgba(0,0,0,.35)}
.sheet-head{display:flex;align-items:center;justify-content:space-between}
.sheet-head h3{margin:0;font-family:var(--display);font-weight:400;font-size:1.5rem}
.sheet label{display:block;font-size:.9rem;font-weight:600}
.sheet label small{display:inline;margin-left:6px;font-weight:400;font-size:.8rem;color:var(--muted)}
.sheet input,.sheet select,.sheet textarea{display:block;margin-top:6px;background:#FFFDF6;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px}
.sheet input:focus,.sheet select:focus,.sheet textarea:focus{border-color:var(--fg);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.sheet .grid{gap:12px}
.sheet .actions .save{flex:1;padding:12px 18px;border-radius:12px}
.sheet .actions .ghost{padding:12px 18px;border-radius:12px}
.icon{background:transparent;border:1.5px solid var(--line);border-radius:999px;width:36px;height:36px}

:root{--field:#FFFDF6;--edge:#7A4A35}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--field:#1C080D;--edge:#D3A98A} }
:root[data-theme="dark"]{--field:#1C080D;--edge:#D3A98A}
.sheet{display:flex;flex-direction:column;gap:14px}
.sheet[hidden],.scrim[hidden]{display:none}
.sheet label{margin:0}
.sheet label[for]{margin-bottom:-8px}
.sheet input,.sheet select,.sheet textarea{min-height:48px;font-size:1rem;color:var(--fg);background:var(--field);border:1.5px solid var(--edge)}
.sheet input::placeholder,.sheet textarea::placeholder{color:var(--muted);opacity:1}
.sheet input:focus,.sheet select:focus,.sheet textarea:focus{border-color:var(--fg);outline:3px solid var(--fg);outline-offset:1px;box-shadow:none}
.sheet [aria-invalid="true"]{border-color:var(--accent);outline-color:var(--accent)}
.sheet .macros{border:0;margin:0;padding:0;min-width:0}
.sheet .macros legend{padding:0;margin-bottom:8px;font-size:.9rem;font-weight:600}
.sheet .macros legend small{margin-left:6px;font-weight:400;font-size:.8rem;color:var(--muted)}
.sheet label.num{font-weight:500}
.sheet label.num small{margin-left:2px}
.sheet .hint{margin:-6px 0 0;font-size:.85rem;color:var(--muted)}
.sheet .err{padding:10px 12px;border-radius:10px;border:1.5px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.sheet .actions .save,.sheet .actions .ghost{min-height:48px}
.sheet .del{color:var(--accent);border-color:var(--accent)}
.icon{display:grid;place-items:center;color:var(--fg);border-color:var(--edge);width:44px;height:44px}
@media (prefers-reduced-motion: no-preference){ .sheet:not([hidden]){animation:up .32s cubic-bezier(.2,.8,.2,1)} @keyframes up{from{transform:translateY(100%)}} }
@media (prefers-reduced-motion: reduce){ .item,.list li.sw{transition:none} }

</style>

<body>
<div class="wrap">
  <header class="hero">
    <p class="eyebrow">Aaj kya khana hai?</p>
    <h1>Kuchh bhi chalega</h1>
  </header>

  <section class="machine" aria-label="Meal picker">
    <div class="tabs" id="tabs" role="group" aria-label="Meal type"></div>
    <div class="window" id="window"><div class="reel" id="reel"><div>Menu khul raha hai…</div></div></div>
    <button class="pull" id="pull" disabled>Batao na</button>
    <div class="detail" id="detail" aria-live="polite" hidden></div>
  </section>

  <section>
    <div class="head">
      <h2>Menu</h2>
      <p class="status" id="status" hidden></p>
    </div>
    <span id="count" hidden></span>

    <ul class="list" id="list"></ul>
  </section>
</div>
<div class="scrim" id="scrim" hidden></div>
    <form id="form" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="f-title" novalidate>
      <div class="sheet-head"><h3 id="f-title">Add a meal</h3><button class="icon" type="button" id="close" aria-label="Close"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      <label for="f-name">Meal name</label><input id="f-name" required aria-required="true" aria-describedby="f-err" maxlength="80" autocomplete="off" autocapitalize="sentences" enterkeyhint="next" placeholder="e.g. Rajma chawal">
      <label for="f-cat">Category</label><select id="f-cat"><option>Brunch</option><option>Dinner</option><option>Dessert</option></select>
      <fieldset class="grid macros"><legend>Macros <small>optional</small></legend>
        <label class="num">Calories <small>(kcal)</small><input id="f-cal" type="text" inputmode="decimal" enterkeyhint="next" autocomplete="off"></label>
        <label class="num">Protein <small>(g)</small><input id="f-p" type="text" inputmode="decimal" enterkeyhint="next" autocomplete="off"></label>
        <label class="num">Carbs <small>(g)</small><input id="f-c" type="text" inputmode="decimal" enterkeyhint="next" autocomplete="off"></label>
        <label class="num">Fat <small>(g)</small><input id="f-f" type="text" inputmode="decimal" enterkeyhint="next" autocomplete="off"></label>
      </fieldset>
      <label for="f-ing">Ingredients <small>optional</small></label><textarea id="f-ing" aria-describedby="f-ing-hint" placeholder="rajma, rice, onion, tomato"></textarea><p class="hint" id="f-ing-hint">Separate with commas.</p>
      <p class="err" id="f-err" role="alert" hidden></p>
      <div class="actions">
        <button class="save" type="submit">Save meal</button>
        <button class="ghost" type="button" id="cancel">Cancel</button>
        <button class="ghost del" type="button" id="del" hidden aria-live="polite">Delete</button>
      </div>
    </form>
<button class="fab" id="addBtn" aria-label="Add a meal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Add meal</span></button>

<script>
const $ = id => document.getElementById(id);
const LS = 'kbc-demo-meals-v2';
let db = null, meals = [], ready = false, spinning = false;
let lastId = null, current = null, seen = [], editing = null, confirmDel = false;
const have = {}; // mealId -> Set of ingredients ticked as "at home"

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = v => (v === '' || v == null || isNaN(+v)) ? null : +v;
const rowH = () => $('window').clientHeight;

function loadLocal(){ var m; try{ m = JSON.parse(localStorage.getItem(LS)) }catch(e){} return (m && m.length) ? m : (window.__KBC_SEED__ || []).slice() }
function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify(meals)) }catch(e){} }

function setMeals(list){
  meals = list.slice().sort((a,b) => a.name.localeCompare(b.name));
  ready = true;
  if (current) current = meals.find(m => m.id === current.id) || null;
  renderList();
  if (!spinning){ renderIdle(); renderDetail(); }
}

const CATS = ['Brunch','Dinner','Dessert'];
const HR = new Date().getHours();
let cat = (HR >= 5 && HR < 17) ? 'Brunch' : (HR >= 17 && HR < 22) ? 'Dinner' : 'Dessert', delId = null;
const inCat = () => meals.filter(m => m.category === cat);

function renderIdle(){
  $('tabs').innerHTML = CATS.map(c => '<button class="tab" data-c="' + c + '" aria-pressed="' + (c === cat) + '">' + c + '</button>').join('');
  const n = inCat().length;
  $('pull').disabled = n === 0;
  if (current) return;
  $('reel').className = 'reel'; $('reel').style.transform = 'none';
  $('reel').innerHTML = '<div>' + (n ? '?  ?  ?' : 'No ' + cat.toLowerCase() + ' meals yet') + '</div>';
  $('pull').textContent = 'Batao na';
}

function renderList(){
  if (!meals.length){ $('list').innerHTML = '<li class="note" style="padding:14px 2px">No meals yet. Add the things you usually eat and the machine will pick from them.</li>'; return; }
  const row = m => {
    const bits = [];
    if (m.calories != null) bits.push(m.calories + ' kcal');
    if (m.protein != null) bits.push(m.protein + 'g protein');
    if (m.carbs != null) bits.push(m.carbs + 'g carbs');
    if (m.fat != null) bits.push(m.fat + 'g fat');
    return '<li class="sw" data-id="' + esc(m.id) + '"><button class="x" tabindex="-1" data-del="' + esc(m.id) + '" aria-label="Delete ' + esc(m.name) + '">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Delete</button>' +
      '<button class="item" data-id="' + esc(m.id) + '"><span class="n">' + esc(m.name) + '</span>' +
      (bits.length ? '<span class="m">' + esc(bits.join(' · ')) + '</span>' : '') + '</button></li>';
  };
  const groups = CATS.map(c => [c, meals.filter(m => m.category === c)]);
  const rest = meals.filter(m => !CATS.includes(m.category));
  if (rest.length) groups.push(['Uncategorised', rest]);
  $('list').innerHTML = groups.map(g => '<li class="g"><span>' + g[0] + '</span><small>' + (g[1].length || '') + '</small></li>' +
    (g[1].length ? g[1].map(row).join('') : '<li class="empty">Nothing here yet.</li>')).join('');
}

async function removeMeal(id){
  if (db) await db.collection('meals').doc(id).delete();
  else { setMeals(meals.filter(m => m.id !== id)); saveLocal(); }
  if (current && current.id === id){ current = null; renderIdle(); renderDetail(); }
}

function renderDetail(){
  const d = $('detail'), m = current;
  if (!m){ d.hidden = true; return; }
  let h = '';
  const st = [['calories','kcal',''],['protein','g','Protein '],['carbs','g','Carbs '],['fat','g','Fat ']]
    .filter(x => m[x[0]] != null).map(x => '<li>' + x[2] + '<b>' + m[x[0]] + '</b> ' + x[1] + '</li>');
  h += st.length ? '<ul class="stats">' + st.join('') + '</ul>' : '<p class="note">Macros not tracked for this one.</p>';
  const ings = m.ingredients || [];
  if (ings.length){
    const set = have[m.id] || (have[m.id] = new Set());
    const n = ings.filter(i => set.has(i)).length;
    h += '<p class="have' + (n === ings.length ? ' all' : '') + '">' + (n === ings.length ? 'Sab kuchh hai. Bana lo!' :
      'Tap what you have at home · ' + n + ' of ' + ings.length) + '</p><div class="ings">' +
      ings.map((i,k) => '<button class="ing" data-k="' + k + '" aria-pressed="' + set.has(i) + '">' + esc(i) + '</button>').join('') + '</div>';
  } else h += '<p class="note">No ingredients listed.</p>';
  d.innerHTML = h; d.hidden = false;
}

function pick(){
  const menu = inCat();
  let pool = menu.filter(m => !seen.includes(m.id));
  if (!pool.length){ seen = seen.filter(id => !menu.some(m => m.id === id)); if (lastId) seen.push(lastId); pool = menu.filter(m => m.id !== lastId); }
  if (!pool.length) pool = menu; // only one meal in this category
  return pool[Math.floor(Math.random() * pool.length)];
}

function spin(){
  const meals = inCat();
  if (spinning || !meals.length) return;
  const choice = pick();
  const reel = $('reel'), H = rowH(), N = meals.length > 1 ? 26 : 1;
  const names = [current ? current.name : '?  ?  ?'];
  for (let i = 1; i < N; i++){
    let m; do { m = meals[Math.floor(Math.random() * meals.length)] } while (meals.length > 2 && m.name === names[i-1]);
    names.push(m.name);
  }
  names.push(choice.name);
  spinning = true; $('pull').disabled = true; $('detail').hidden = true;
  reel.className = 'reel'; reel.style.transform = 'translateY(0)';
  reel.innerHTML = names.map(n => '<div>' + esc(n) + '</div>').join('');
  void reel.offsetHeight;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  reel.className = 'reel spin'; $('window').classList.add('blur');
  reel.style.transform = 'translateY(' + (-(names.length - 1) * H) + 'px)';
  setTimeout(() => $('window').classList.remove('blur'), 1500);
  setTimeout(() => {
    spinning = false; current = choice; lastId = choice.id; seen.push(choice.id);
    reel.className = 'reel'; reel.style.transform = 'none';
    reel.innerHTML = '<div>' + esc(choice.name) + '</div>';
    $('pull').disabled = false; $('pull').textContent = 'Nahi. Kuchh aur';
    renderDetail();
    if (db) db.doc('state/last').set({ mealId: choice.id }).catch(() => {});
    else { try{ localStorage.setItem('kbc-demo-last', choice.id) }catch(e){} }
  }, reduce ? 50 : 2500);
}

function openForm(m){
  editing = m || null; confirmDel = false;
  $('f-name').value = m ? m.name : ''; $('f-cal').value = m && m.calories != null ? m.calories : '';
  $('f-p').value = m && m.protein != null ? m.protein : ''; $('f-c').value = m && m.carbs != null ? m.carbs : '';
  $('f-f').value = m && m.fat != null ? m.fat : ''; $('f-ing').value = m ? (m.ingredients || []).join(', ') : '';
  $('f-cat').value = m && CATS.includes(m.category) ? m.category : cat;
  $('del').hidden = !m; $('del').textContent = 'Delete'; $('f-err').hidden = true;
  $('f-title').textContent = m ? 'Edit meal' : 'Add a meal';
  $('f-name').removeAttribute('aria-invalid'); ['f-cal','f-p','f-c','f-f'].forEach(k => $(k).removeAttribute('aria-invalid'));
  opener = document.activeElement;
  $('form').hidden = false; $('scrim').hidden = false; document.documentElement.classList.add('sheet-open');
  document.querySelectorAll('.wrap, .fab').forEach(el => { el.inert = true; });
  setTimeout(() => $('f-name').focus(), 60);
}
function fail(e){ $('f-err').textContent = e && e.code === 'invalid_argument' ? "You can view this menu but can't change it." : "Couldn't save. Try again."; $('f-err').hidden = false; }

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('f-name').value.trim();
  const NUMS = ['f-cal','f-p','f-c','f-f']; NUMS.forEach(k => $(k).removeAttribute('aria-invalid'));
  if (!name){ $('f-name').setAttribute('aria-invalid', 'true'); $('f-err').textContent = 'Give the meal a name.'; $('f-err').hidden = false; $('f-name').focus(); return; }
  const bad = NUMS.filter(k => $(k).value.trim() !== '' && isNaN(+$(k).value.trim().replace(',', '.')));
  if (bad.length){ bad.forEach(k => $(k).setAttribute('aria-invalid', 'true')); $('f-err').textContent = 'Macros need to be numbers, like 12 or 12.5.'; $('f-err').hidden = false; $(bad[0]).focus(); return; }
  const data = { name, category: $('f-cat').value, calories: num($('f-cal').value.trim().replace(',', '.')), protein: num($('f-p').value.trim().replace(',', '.')), carbs: num($('f-c').value.trim().replace(',', '.')), fat: num($('f-f').value.trim().replace(',', '.')),
    ingredients: [...new Set($('f-ing').value.split(/[,\n]/).map(s => s.trim()).filter(Boolean))] };
  try{
    if (db){
      const ref = editing ? db.collection('meals').doc(editing.id) : db.collection('meals').doc();
      await ref.set(data);
    } else {
      const id = editing ? editing.id : 'm' + Date.now();
      setMeals(meals.filter(m => m.id !== id).concat([{ id, ...data }])); saveLocal();
    }
    closeSheet();
  }catch(err){ fail(err); }
});
$('del').addEventListener('click', async () => {
  if (!confirmDel){ confirmDel = true; $('del').textContent = 'Tap again to delete'; return; }
  try{
    await removeMeal(editing.id);
    closeSheet();
  }catch(err){ fail(err); }
});
let opener = null;
function closeSheet(){ if ($('form').hidden) return; $('form').hidden = true; $('scrim').hidden = true; document.documentElement.classList.remove('sheet-open'); document.querySelectorAll('.wrap, .fab').forEach(el => { el.inert = false; }); if (opener && document.contains(opener) && opener.offsetParent) opener.focus(); else $('addBtn').focus(); }
$('form').addEventListener('keydown', e => { if (e.key !== 'Tab') return; const f = [...$('form').querySelectorAll('button, input, select, textarea')].filter(x => !x.hidden && x.offsetParent !== null); const a = f[0], z = f[f.length - 1]; if (e.shiftKey && document.activeElement === a){ e.preventDefault(); z.focus(); } else if (!e.shiftKey && document.activeElement === z){ e.preventDefault(); a.focus(); } });
$('f-name').addEventListener('input', () => { $('f-name').removeAttribute('aria-invalid'); $('f-err').hidden = true; });
$('cancel').addEventListener('click', closeSheet);
$('close').addEventListener('click', closeSheet);
$('scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('form').hidden) closeSheet(); });
$('addBtn').addEventListener('click', () => openForm(null));
$('pull').addEventListener('click', spin);
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b || spinning || b.dataset.c === cat) return;
  cat = b.dataset.c; current = null; renderIdle(); renderDetail();
});
/* swipe left to reveal Delete, like iOS */
let openRow = null, sx = 0, sy = 0, dx = 0, dragRow = null, dragging = false, moved = false;
const OPEN = -96;
function closeRow(li){ if (!li) return; li.classList.remove('open'); li.querySelector('.item').style.transform = ''; li.querySelector('.x').tabIndex = -1; if (openRow === li) openRow = null; }
function openIt(li){ if (openRow && openRow !== li) closeRow(openRow); li.classList.add('open'); li.querySelector('.item').style.transform = 'translateX(' + OPEN + 'px)'; li.querySelector('.x').tabIndex = 0; openRow = li; }
$('list').addEventListener('pointerdown', e => {
  const li = e.target.closest('li.sw'); if (!li || e.target.closest('.x')) return;
  dragRow = li; sx = e.clientX; sy = e.clientY; dx = 0; dragging = false; moved = false;
});
window.addEventListener('pointermove', e => {
  if (!dragRow) return;
  const mx = e.clientX - sx, my = e.clientY - sy;
  if (!dragging){ if (Math.abs(mx) > 8 && Math.abs(mx) > Math.abs(my)) { dragging = true; dragRow.classList.add('drag'); } else if (Math.abs(my) > 10) { dragRow = null; return; } else return; }
  moved = true;
  const base = dragRow.classList.contains('open') ? OPEN : 0;
  dx = Math.min(0, Math.max(-dragRow.clientWidth * .8, base + mx));
  dragRow.querySelector('.item').style.transform = 'translateX(' + dx + 'px)';
});
window.addEventListener('pointerup', () => {
  if (!dragRow) return;
  const li = dragRow; dragRow = null; li.classList.remove('drag');
  if (!dragging) return;
  if (dx < -li.clientWidth * .6) { del(li); return; }
  dx < OPEN / 2 ? openIt(li) : closeRow(li);
});
function del(li){
  const id = li.dataset.id;
  li.style.height = li.offsetHeight + 'px'; li.classList.add('gone');
  requestAnimationFrame(() => { li.style.height = '0px'; });
  setTimeout(() => removeMeal(id).catch(() => { $('status').textContent = "Couldn't delete that meal."; $('status').hidden = false; renderList(); }), 260);
  openRow = null;
}
$('list').addEventListener('click', e => {
  const x = e.target.closest('.x'); if (x) { del(x.closest('li')); return; }
  const b = e.target.closest('.item'); if (!b) return;
  if (moved) { moved = false; return; }
  const li = b.closest('li'); if (li.classList.contains('open')) { closeRow(li); return; }
  if (openRow) { closeRow(openRow); return; }
  openForm(meals.find(m => m.id === b.dataset.id));
});
$('list').addEventListener('keydown', e => {
  const b = e.target.closest('.item'); if (!b) return;
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); openIt(b.closest('li')); b.closest('li').querySelector('.x').focus(); }
  if (e.key === 'Escape' && openRow) closeRow(openRow);
});
$('detail').addEventListener('click', e => {
  const b = e.target.closest('.ing'); if (!b || !current) return;
  const i = current.ingredients[+b.dataset.k], set = have[current.id];
  set.has(i) ? set.delete(i) : set.add(i); renderDetail();
});

function goLocal(msg){
  db = null; try{ lastId = localStorage.getItem('kbc-demo-last') }catch(e){}
  $('status').textContent = msg; $('status').hidden = false; setMeals(loadLocal());
}
(async () => {
  const d = window.claude && window.claude.use ? await window.claude.use('db') : null;
  if (!d) return goLocal('Demo menu with sample meals. Tap a meal to edit, swipe left to delete.');
  db = d;
  db.doc('state/last').get().then(s => { if (s.exists && !lastId) lastId = s.data().mealId; }).catch(() => {});
  db.collection('meals').onSnapshot(
    snap => setMeals(snap.docs.map(x => ({ id: x.id, ...x.data() })).filter(m => m.name)),
    () => { if (!ready) goLocal('Could not reach the shared menu. Meals are saved on this device only.'); }
  );
})();
</script>
