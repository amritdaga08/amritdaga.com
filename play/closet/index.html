<script>try{Object.defineProperty(window,"claude",{value:undefined,configurable:true,writable:true})}catch(e){try{window.claude=undefined}catch(_){}}</script><meta name="robots" content="noindex"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}html,body,*{scrollbar-width:none;-ms-overflow-style:none}*::-webkit-scrollbar{display:none;width:0;height:0}</style>
<meta charset="utf-8">

<style>
:root{
  --paper:#F3F4F0;--card:#FFFFFF;--tile:#E8EAE3;--ink:#18202E;--muted:#5D6574;--line:#D8DBD2;
  --tag:#E8C46A;--tag-ink:#3A2E0F;--thread:#B5432F;--ok:#2F6B4F;--shade:rgba(24,32,46,.08);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11151C;--card:#1A1F29;--tile:#232A36;--ink:#ECEEE8;--muted:#9AA1AE;--line:#2B3240;
  --tag:#D6B35C;--tag-ink:#231B06;--thread:#E0735E;--ok:#6CC49A;--shade:rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--paper:#11151C;--card:#1A1F29;--tile:#232A36;--ink:#ECEEE8;--muted:#9AA1AE;--line:#2B3240;
  --tag:#D6B35C;--tag-ink:#231B06;--thread:#E0735E;--ok:#6CC49A;--shade:rgba(0,0,0,.35)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--thread);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 120px}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 18px}
.brand{font-size:clamp(2.2rem,9vw,3.2rem);font-weight:800;letter-spacing:-.045em;line-height:.9;margin:0}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--ink);color:var(--paper);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.danger{background:transparent;color:var(--thread);box-shadow:inset 0 0 0 1px var(--thread)}
.btn.small{padding:7px 12px;font-size:.9rem;font-weight:600}
.notice{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;color:var(--muted);margin-bottom:16px}
.notice:empty{display:none}

/* summary */
.summary{margin-bottom:18px}
.total{display:flex;align-items:baseline;gap:10px;margin:0 0 10px}
.total b{font-size:2.6rem;font-weight:800;letter-spacing:-.04em;line-height:1}
.total span{color:var(--muted)}
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.cat{flex:none;min-width:92px;text-align:left;border:0;cursor:pointer;background:var(--card);border-radius:12px;padding:10px 12px;box-shadow:inset 0 0 0 1px var(--line)}
.cat b{display:block;font-size:1.5rem;font-weight:700;line-height:1.1}
.cat span{font-size:.85rem;color:var(--muted)}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--paper);box-shadow:none}
.cat[aria-pressed="true"] span{color:inherit;opacity:.75}

/* closet grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.item{border:0;padding:0;text-align:left;cursor:pointer;background:none}
.tilebox{position:relative;aspect-ratio:3/4;border-radius:12px;background:var(--tile);display:grid;place-items:center;overflow:hidden}
.tilebox img{position:absolute;inset:0;width:100%;height:100%}
.tilebox img.cut{object-fit:contain;filter:drop-shadow(0 4px 6px var(--shade))}
.tilebox img.photo{object-fit:cover}
.swatch{width:44%;aspect-ratio:1;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line)}
.item .nm{font-size:.84rem;line-height:1.3;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{text-align:center;padding:36px 16px;background:var(--card);border-radius:16px;box-shadow:0 1px 0 var(--line)}
.empty p{color:var(--muted);margin:6px auto 16px;max-width:36ch}
.foot{margin-top:22px;text-align:center}
.linkbtn{border:0;background:none;padding:4px 0;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* FAB */
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:5;
  border:0;cursor:pointer;background:var(--tag);color:var(--tag-ink);font-weight:800;font-size:1.05rem;
  padding:15px 22px 15px 40px;clip-path:polygon(18px 0,100% 0,100% 100%,18px 100%,0 50%);
  filter:drop-shadow(0 6px 14px var(--shade))}
.fab::before{content:none}
.fab:disabled{opacity:.5}
.fab{clip-path:none!important;padding:0!important;background:transparent!important;width:112px;height:94px;display:grid;place-items:center;
  filter:drop-shadow(0 10px 16px var(--shade)) drop-shadow(0 2px 3px var(--shade))!important;-webkit-tap-highlight-color:transparent;
  transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.fab .tee{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fab .tee path{fill:var(--tag);stroke:var(--tag-ink);stroke-width:2.5;stroke-linejoin:round}
.fab .tee .collar{fill:none;stroke-width:3}
.fab .lbl{position:relative;margin-top:22px;font-size:.9rem;line-height:1.05;font-weight:800;color:var(--tag-ink);text-align:center;letter-spacing:-.01em}
.fab:not(:disabled):hover{transform:translateY(-3px) rotate(-3deg)}
.fab:not(:disabled):active{transform:scale(.94)}
.fab:focus-visible{outline:none}.fab:focus-visible .tee path:first-child{stroke:var(--ink);stroke-width:4}
html.embedded .fab{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
html.framed .fab{right:26px;bottom:34px}
@media (prefers-reduced-motion:no-preference){.fab:not(:disabled){animation:teesway 3.2s ease-in-out 1s 2}
 @keyframes teesway{0%,100%{transform:none}20%{transform:rotate(-5deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-2deg)}}}

/* dialogs */
dialog{border:0;padding:0;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(10,14,20,.55)}
dialog.sheet{border-radius:18px;width:min(520px,calc(100% - 20px));max-height:calc(100% - 20px)}
.sheetin{padding:18px;overflow:auto;max-height:calc(100vh - 20px)}
.sheetin h2{margin:0 0 4px;font-size:1.3rem}
.sub{color:var(--muted);margin:0 0 14px;font-size:.92rem}
.preview{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.preview .tilebox{width:120px;flex:none;cursor:pointer;color:var(--muted);font-size:.85rem;text-align:center;padding:0}
.toggle{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.92rem;cursor:pointer;margin-bottom:8px}
.toggle input{width:18px;height:18px;accent-color:var(--ink)}
.field{margin-bottom:14px}
.field label,.field .lbl{display:block;font-weight:600;font-size:.92rem;margin-bottom:6px}
.field input[type=text],.field input[type=date]{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.colrow{display:flex;gap:8px;align-items:center}
.colrow input{flex:1;min-width:0}
.cswatch{flex:none;width:40px;height:40px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line);background:var(--paper)}
.chip{border:0;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);box-shadow:none}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px;position:sticky;bottom:0;background:var(--card);padding-top:10px}
.err{color:var(--thread);font-size:.9rem;min-height:1.2em;margin:0 0 6px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0 0 12px;font-size:.95rem}
.facts dt{color:var(--muted)}.facts dd{margin:0}
.detailimg{width:min(240px,70%);margin:0 auto 14px}

/* Dress me */
dialog.full{width:100%;height:100%;max-width:100%;max-height:100%;margin:0;border-radius:0}
@media (min-width:700px){dialog.full{width:min(560px,100%);height:min(900px,calc(100% - 32px));margin:auto;border-radius:20px}}
.dress{height:100%;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px))}
.dhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dhead h2{margin:0;font-size:1.35rem;letter-spacing:-.02em}
.iconbtn{border:0;background:var(--paper);width:38px;height:38px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.occs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;flex:none}
.htag{flex:none;position:relative;border:0;cursor:pointer;background:var(--paper);color:var(--ink);padding:8px 14px 8px 28px;font-weight:600;
  clip-path:polygon(13px 0,100% 0,100% 100%,13px 100%,0 50%);box-shadow:inset 0 0 0 1px var(--line)}
.htag::before{content:"";position:absolute;left:12px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.htag[aria-pressed="true"]{background:var(--tag);color:var(--tag-ink);box-shadow:none}
.noteline{display:flex;gap:8px;margin-bottom:12px;flex:none}
.noteline input{flex:1;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.stage{flex:1;min-height:0;position:relative}
.ocard{position:absolute;inset:0;background:var(--paper);border-radius:18px;display:flex;flex-direction:column;overflow:hidden;touch-action:pan-y;user-select:none;will-change:transform}
.ocard.anim{transition:transform .28s ease,opacity .28s ease}
.flat{flex:1;min-height:0;display:grid;grid-template-columns:1.55fr 1fr;gap:8px;padding:12px}
.flat .col{display:flex;flex-direction:column;gap:8px;min-height:0}
.flat .col.side{justify-content:flex-end}
.flat .tilebox{aspect-ratio:auto;flex:1;min-height:0;background:var(--card)}
.flat .col.side .tilebox{flex:0 1 32%}
.obar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 12px 12px 16px;flex:none}
.obar h3{margin:0;font-size:1.15rem;letter-spacing:-.01em;line-height:1.25}
.qbtn{flex:none;width:36px;height:36px;border-radius:50%;border:0;cursor:pointer;background:var(--card);color:var(--ink);font-weight:800;font-size:1.05rem;box-shadow:inset 0 0 0 1px var(--line)}
.qbtn[aria-expanded="true"]{background:var(--ink);color:var(--paper);box-shadow:none}
.why{position:absolute;left:10px;right:10px;bottom:62px;max-height:calc(100% - 82px);overflow:auto;background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:0 10px 30px var(--shade),inset 0 0 0 1px var(--line)}
.why .for{font-weight:700;font-size:.92rem;margin:0 0 2px}
.why .for~.for{margin-top:12px}
.why p{margin:0;color:var(--muted)}
.why ul{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:.9rem}
.stamp{position:absolute;top:18px;padding:4px 12px;border-radius:8px;font-weight:800;font-size:1.3rem;opacity:0;pointer-events:none;border:3px solid}
.stamp.no{right:18px;color:var(--thread);transform:rotate(8deg)}
.stamp.yes{left:18px;color:var(--ok);transform:rotate(-8deg)}
.msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted);background:var(--paper);border-radius:18px}
.msg h3{color:var(--ink);margin:0 0 6px}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.decide{display:flex;justify-content:center;gap:28px;padding-top:14px;flex:none}
.round{width:64px;height:64px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 14px var(--shade)}
.round.no{background:var(--card);color:var(--thread);box-shadow:inset 0 0 0 2px var(--thread),0 4px 14px var(--shade)}
.round.yes{background:var(--ok);color:#fff}
.round:disabled{opacity:.4}
.decide label{display:block;text-align:center;font-size:.8rem;color:var(--muted);margin-top:4px}
@media (prefers-reduced-motion:reduce){.ocard.anim{transition:none}.dots::after{animation:none;content:"..."}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="brand">Closet</h1>
    <button class="btn" id="addBtn"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>Add</button>
  </header>
  <div class="notice" id="notice"></div>
  <section class="summary" id="summary" hidden>
    <p class="total"><b id="total">0</b><span id="totalLbl">pieces in your closet</span></p>
    <div class="cats" id="cats"></div>
  </section>
  <div id="grid"></div>
  <div class="foot"><button class="btn ghost small" id="tidyBtn" hidden></button><p class="sub" id="tidyStatus" style="margin:8px 0 14px" aria-live="polite"></p><button class="linkbtn" id="discBtn" hidden></button></div>
</div>

<button class="fab" id="fab" disabled aria-label="Dress me"><svg class="tee" viewBox="0 0 148 124" aria-hidden="true"><path d="M52 4 C58 14 90 14 96 4 L124 14 Q132 17 136 25 L146 46 Q148 51 143 54 L124 63 Q119 65 117 60 L113 52 L113 116 Q113 121 108 121 L40 121 Q35 121 35 116 L35 52 L31 60 Q29 65 24 63 L5 54 Q0 51 2 46 L12 25 Q16 17 24 14 Z"/><path class="collar" d="M52 4 C58 14 90 14 96 4"/></svg><span class="lbl">Dress<br>me</span></button>
<input type="file" id="fileIn" accept="image/*" multiple hidden>

<!-- Add / edit -->
<dialog class="sheet" id="formSheet"><div class="sheetin">
  <h2 id="formTitle">Add an item</h2>
  <p class="sub" id="formSub">Tag it so outfits come out right.</p>
  <div class="preview">
    <div class="tilebox" id="photoBox" tabindex="0" role="button" aria-label="Choose photo">Tap to add a photo</div>
    <div style="flex:1;min-width:0">
      <label class="toggle" id="bgWrap"><input type="checkbox" id="bgOn" checked>Clean up photo</label>
      <p class="sub" id="bgStatus" style="margin:0 0 10px"></p>
      <button type="button" class="btn ghost small" id="autoBtn" hidden>Fill details from photo</button>
      <p class="sub" id="autoStatus" style="margin-top:8px"></p>
    </div>
  </div>
  <div class="field"><span class="lbl">Type</span><div class="chips" id="catChips"></div></div>
  <div class="field"><label for="color">Main colour</label><div class="colrow"><span class="cswatch" id="cswatch" aria-hidden="true"></span><input type="text" id="color" list="colors" placeholder="Navy, white, olive…"></div><p class="sub" id="colorStatus" style="margin:6px 0 0"></p></div>
  <datalist id="colors"><option>White<option>Off-white<option>Cream<option>Light grey<option>Grey<option>Charcoal<option>Black<option>Navy<option>Blue<option>Royal blue<option>Light blue<option>Sky blue<option>Denim blue<option>Light denim<option>Teal<option>Olive<option>Green<option>Bottle green<option>Mint<option>Sage<option>Khaki<option>Beige<option>Tan<option>Camel<option>Brown<option>Dark brown<option>Maroon<option>Burgundy<option>Red<option>Rust<option>Orange<option>Mustard<option>Yellow<option>Pink<option>Dusty pink<option>Rose<option>Lavender<option>Purple</datalist>
  <div class="field"><span class="lbl">Good for</span><div class="chips" id="styleChips"></div></div>
  <div class="field"><label for="name">Name (optional)</label><input type="text" id="name" placeholder="e.g. Linen shirt, slim chinos" maxlength="60"></div>
  <div class="field"><span class="lbl">Fit</span><div class="chips" id="fitChips"></div></div>
  <div class="field"><span class="lbl">Pattern</span><div class="chips" id="patChips"></div></div>
  <p class="err" id="formErr"></p>
  <div class="actions">
    <button type="button" class="btn ghost" id="skipBtn">Cancel</button>
    <button type="button" class="btn" id="saveBtn">Save item</button>
  </div>
</div></dialog>

<!-- Detail -->
<dialog class="sheet" id="detailSheet"><div class="sheetin">
  <div class="tilebox detailimg" id="dImg"></div>
  <h2 id="dTitle"></h2>
  <dl class="facts" id="dFacts"></dl>
  <div class="actions" id="dActions"></div>
</div></dialog>

<!-- Dress me -->
<dialog class="full" id="dressSheet"><div class="dress">
  <div class="dhead"><h2>What's the occasion?</h2>
    <button class="iconbtn" id="dressClose" aria-label="Close"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
  <div class="occs" id="occs"></div>
  <div class="noteline"><input id="note" type="text" maxlength="140" placeholder="Anything else? e.g. rainy, rooftop, want to look sharp"><button class="btn small ghost" id="noteGo">Apply</button></div>
  <div class="stage" id="stage"><div class="msg"><div><h3>Pick an occasion</h3>Outfits appear here. Swipe right to wear one, left for another.</div></div></div>
  <div class="decide">
    <div><button class="round no" id="noBtn" disabled aria-label="Not this one"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button><label>Not this</label></div>
    <div><button class="round yes" id="yesBtn" disabled aria-label="Wear this"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><label>Wear this</label></div>
  </div>
</div></dialog>

<script>

async function gunzipB64(id){
  const r=await fetch('/_blob/'+id);if(!r.ok)throw new Error('asset');
  const bin=Uint8Array.from(atob((await r.text()).trim()),c=>c.charCodeAt(0));
  return new Uint8Array(await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
}

    ort.env.wasm.wasmBinary=w.buffer;ort.env.wasm.numThreads=1;ort.env.wasm.proxy=false;

    for(let y=-r;y<=r;y++)s+=tmp[Math.min(h-1,Math.max(0,y))*w+x];
    for(let y=0;y<h;y++){out[y*w+x]=s/d;s+=tmp[Math.min(h-1,y+r+1)*w+x]-tmp[Math.max(0,y-r)*w+x];}}

    while(stack.length){const p=stack.pop();c++;const x=p%S,y=(p/S)|0;
      for(const q of [x>0?p-1:-1,x<S-1?p+1:-1,y>0?p-S:-1,y<S-1?p+S:-1])if(q>=0&&on[q]&&!lab[q]){lab[q]=n;stack.push(q);}}
    if(c>bestN){bestN=c;best=n;}}

  for(let i=0;i<S;i++)for(const p of [i,(S-1)*S+i,i*S,i*S+S-1])if(lab[p]!==best&&!outside[p]){outside[p]=1;stack.push(p);}
  while(stack.length){const p=stack.pop();const x=p%S,y=(p/S)|0;
    for(const q of [x>0?p-1:-1,x<S-1?p+1:-1,y>0?p-S:-1,y<S-1?p+S:-1])if(q>=0&&!outside[q]&&lab[q]!==best){outside[q]=1;stack.push(q);}}

  const pts=[];for(let i=0;i<S*S;i+=2)if(mask[i]>.5)pts.push(i%S,(i/S)|0);
  const area=a=>{const c=Math.cos(a),s=Math.sin(a);let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
    for(let k=0;k<pts.length;k+=2){const x=pts[k]*c-pts[k+1]*s,y=pts[k]*s+pts[k+1]*c;
      if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}return(x1-x0)*(y1-y0);};

  else if(A.neutral!==B.neutral){score=4;const acc=A.neutral?b:t,base=A.neutral?t:b;text=`With ${base.color.toLowerCase()} ${catLabel(base).toLowerCase()} as the neutral base, the ${acc.color.toLowerCase()} ${catLabel(acc).toLowerCase()} is the single accent.`;}
  else if(hd<40){score=3;text=`${t.color} and ${b.color.toLowerCase()} sit next to each other on the colour wheel, an analogous pairing ${cv}.`;}
  else if(hd>150){const muted=Math.min(A.s,B.s)<.45;score=muted?3:-1;text=muted?`${t.color} and ${b.color.toLowerCase()} are near-complementary; one is muted, so they contrast without clashing.`:`${t.color} and ${b.color.toLowerCase()} are complementary and both saturated, which is a bold, high-contrast look.`;}
  else{score=-2;text=`${t.color} and ${b.color.toLowerCase()} are two competing accents; this is the riskiest colour pairing here.`;}
  if(sh){const S=colorInfo(sh.color);if(S&&(S.neutral||Math.abs(S.l-B.l)<.2)){score+=.5;text+=` The ${(sh.color||'').toLowerCase()} shoes stay quiet and anchor the look.`;}}
  return{score,text};
}
function judgeProportion(t,b){
  const busy=x=>['Striped','Checked','Printed'].includes(x.pattern);
  let score=0;const bits=[];
  if(busy(t)&&busy(b)){score-=3;bits.push('two patterned pieces compete for attention');}
  else if(busy(t)||busy(b)){score+=1;bits.push(`one patterned piece against a plain one keeps the visual weight on the ${busy(t)?'top':'bottom'}`);}
  if(t.fit&&b.fit){
    if(t.fit==='Relaxed'&&b.fit==='Relaxed'){score-=1.5;bits.push('relaxed on relaxed adds volume everywhere, so it reads loose');}
    else if((t.fit==='Relaxed')!==(b.fit==='Relaxed')){score+=2;bits.push(`a ${t.fit.toLowerCase()} top over a ${b.fit.toLowerCase()} bottom balances volume with a clean line`);}
    else{score+=1.5;bits.push(`${t.fit.toLowerCase()} top and ${b.fit.toLowerCase()} bottom give one continuous, streamlined silhouette`);}
  }
  const text=bits.length?bits[0][0].toUpperCase()+bits.join('; ').slice(1)+'.':'Tag fit and pattern on these pieces to get a proportion read.';
  return{score,text};
}
function localBatch(g,avoid){
  const fits=i=>(i.styles||[]).some(x=>g.occ.styles.includes(x));
  const pool=slot=>active().filter(i=>slotOf(i)===slot&&fits(i));
  const tops=pool('top'),bots=pool('bottom');let shoes=pool('shoes');if(!shoes.length)shoes=[null];
  const cands=[];
  for(const t of tops)for(const b of bots){
    const base=judgeProportion(t,b);
    for(const sh of shoes){const ids=[t.id,b.id,sh?.id].filter(Boolean),k=keyOf(ids);if(avoid.has(k))continue;
      const col=judgeColour(t,b,sh);cands.push({ids,key:k,t,b,col,prop:base,score:col.score+base.score+Math.random()*1.5});}
  }
  cands.sort((x,y)=>y.score-x.score);
  const out=[],usedT=new Set(),usedB=new Set();
  for(const c of cands){if(out.length>=5)break;if(usedT.has(c.t.id)&&usedB.has(c.b.id))continue;usedT.add(c.t.id);usedB.add(c.b.id);out.push(c);}
  return out.map(c=>({ids:c.ids,key:c.key,title:`${c.t.color||''} ${catLabel(c.t)}, ${(c.b.color||'').toLowerCase()} ${catLabel(c.b).toLowerCase()}`.trim(),colour:c.col.text,proportion:c.prop.text}));
}

/* ---- card ---- */
function setDecide(on){$('noBtn').disabled=!on;$('yesBtn').disabled=!on;}
function stageMsg(html,btn){
  if(gen)gen.current=null;
  const st=$('stage');st.textContent='';const m=document.createElement('div');m.className='msg';const inner=document.createElement('div');inner.innerHTML=html;
  if(btn){const b=document.createElement('button');b.className='btn';b.style.marginTop='14px';b.textContent=btn[0];b.onclick=btn[1];inner.append(b);}
  m.append(inner);st.append(m);setDecide(false);
}
let loadTimer=null;
function loadingMsg(){
  stageMsg(`<h3 class="dots">Putting outfits together</h3><span id="loadSub">Matching colours and proportions.</span>`);
  clearTimeout(loadTimer);const g=gen;
  loadTimer=setTimeout(()=>{const el=$('loadSub');if(el&&gen===g&&!g.current)el.textContent='Still working. The first one can take up to a minute; after that, swipes are quick.';},12000);
}
function showCard(){
  if(!gen)return;
  const o=gen.queue[0];
  if(!o){
    if(!gen.exhausted){if(!gen.fetching)fetchMore();loadingMsg();return;}
    const hint=gen.lastErr?`<p>${sampleErr(gen.lastErr)}</p>`:'';
    stageMsg(`<h3>No fresh combinations left</h3>${hint}Add more ${gen.occ.styles.join(' or ').toLowerCase()} pieces for more variety.`,
      ['Try again',()=>startGen(gen.occ)]);
    return;
  }
  gen.shown.add(o.key);
  const items=o.ids.map(id=>all.find(i=>i.id===id)).filter(Boolean);
  const bySlot=s=>items.filter(i=>slotOf(i)===s);
  const card=document.createElement('article');card.className='ocard';card.tabIndex=0;
  const flat=document.createElement('div');flat.className='flat';
  const main=document.createElement('div');main.className='col';const side=document.createElement('div');side.className='col side';
  [...bySlot('top'),...bySlot('bottom')].forEach(i=>main.append(tile(i)));
  [...bySlot('layer'),...bySlot('acc'),...bySlot('shoes')].forEach(i=>side.append(tile(i)));
  flat.append(main,side);
  const bar=document.createElement('div');bar.className='obar';
  const h=document.createElement('h3');h.textContent=o.title;
  const q=document.createElement('button');q.className='qbtn';q.textContent='?';q.setAttribute('aria-label','Why this works');q.setAttribute('aria-expanded','false');
  bar.append(h,q);
  const why=document.createElement('div');why.className='why';why.hidden=true;why.id='why'+Math.random().toString(36).slice(2);q.setAttribute('aria-controls',why.id);
  for(const [lbl,txt] of [['Colour',o.colour],['Proportion',o.proportion]]){if(!txt)continue;
    const f=document.createElement('p');f.className='for';f.textContent=lbl;const p=document.createElement('p');p.textContent=txt;why.append(f,p);}
  const toggle=()=>{const open=why.hidden;why.hidden=!open;q.setAttribute('aria-expanded',open);};
  q.onclick=toggle;why.onclick=toggle;
  [q,why].forEach(el=>el.addEventListener('pointerdown',e=>e.stopPropagation()));
  const sn=document.createElement('div');sn.className='stamp no';sn.textContent='NOPE';
  const sy=document.createElement('div');sy.className='stamp yes';sy.textContent='WEAR';
  card.append(flat,bar,why,sn,sy);
  const st=$('stage');st.textContent='';st.append(card);setDecide(true);gen.current=o;
  attachSwipe(card,sn,sy);
  card.onkeydown=e=>{if(e.key==='ArrowLeft')decide(false);if(e.key==='ArrowRight')decide(true);};
  if(gen.queue.length<=2)fetchMore();
}
function attachSwipe(card,sn,sy){
  let x0=null,dx=0,id=null;
  card.addEventListener('pointerdown',e=>{if(e.button)return;x0=e.clientX;dx=0;id=e.pointerId;card.classList.remove('anim');});
  card.addEventListener('pointermove',e=>{if(x0==null||e.pointerId!==id)return;dx=e.clientX-x0;
    if(Math.abs(dx)>6&&!card.hasPointerCapture(id))card.setPointerCapture(id);
    card.style.transform=`translateX(${dx}px) rotate(${dx/22}deg)`;sy.style.opacity=Math.max(0,Math.min(1,dx/100));sn.style.opacity=Math.max(0,Math.min(1,-dx/100));});
  const end=()=>{if(x0==null)return;x0=null;
    if(Math.abs(dx)>100)decide(dx>0);else{card.classList.add('anim');card.style.transform='';sn.style.opacity=0;sy.style.opacity=0;}};
  card.addEventListener('pointerup',end);card.addEventListener('pointercancel',end);
}
let deciding=false;
async function decide(like){
  if(deciding||!gen?.queue.length)return;deciding=true;setDecide(false);
  const g=gen,o=g.queue.shift();g.current=null;const card=$('stage').querySelector('.ocard');
  if(card){card.classList.add('anim');card.style.transform=`translateX(${like?'':'-'}130%) rotate(${like?14:-14}deg)`;card.style.opacity=0;}
  await new Promise(r=>setTimeout(r,matchMedia('(prefers-reduced-motion:reduce)').matches?0:260));
  const entry={ids:o.ids,occasion:g.occ.id,at:Date.now(),verdict:like?'wore':'skip'};
  log=[...log,entry].slice(-300);
  const snapshot=log;
  serial(()=>logRef.set({entries:snapshot})).catch(()=>{});
  deciding=false;
  if(like){
    g.hold=true;
    stageMsg(`<h3>Enjoy the ${g.occ.label.toLowerCase()}</h3>This exact outfit won't be suggested again for a couple of weeks. The pieces can still show up in other combinations.`,['Show another',()=>{g.hold=false;showCard();}]);
  }else showCard();
}
$('noBtn').onclick=()=>decide(false);$('yesBtn').onclick=()=>decide(true);


function sampleErr(code){
  return{not_granted:'Claude styling is switched off for this page, so these are quick picks from your tags.',rate_limited:'Too many requests right now. Try again in a minute.',
    invalid_json:'The styling answer came back garbled.',images_unavailable:'Photo reading isn’t available here.'}[code]||'Couldn’t reach Claude just now.';
}
