<title>Vault</title>
<style>
@font-face{font-family:'Young Serif';src:url('young-serif.woff2') format('woff2');font-display:swap}
:root{--bg:#f4f3ef;--card:#fff;--ink:#15171f;--muted:#6a6e7a;--line:#e3e1da;--accent:#2a3fa8;--accent-ink:#fff;--soft:#eceaf6;--danger:#b42318;--warn:#a15c07;--ok:#1f7a4d;--r:16px;--shadow:0 1px 2px rgba(20,20,40,.05),0 8px 24px rgba(20,20,40,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1015;--card:#191b23;--ink:#eceef4;--muted:#9a9eab;--line:#2a2d38;--accent:#8c9cff;--accent-ink:#0f1015;--soft:#22253a;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif}
body.veil #app{filter:blur(24px)}
#app{max-width:560px;margin:0 auto;padding:max(28px,calc(env(safe-area-inset-top) + 16px)) 24px calc(112px + env(safe-area-inset-bottom))}
h1{font-size:26px;letter-spacing:-.02em;margin:0 0 6px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:34px 0 12px;font-weight:600}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.center{min-height:78vh;display:flex;flex-direction:column;justify-content:center}
.logo{width:60px;height:60px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-bottom:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:18px 0 8px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
textarea{min-height:72px;resize:vertical}
.row{display:flex;gap:10px}.row>*{flex:1}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;border-radius:14px;padding:13px 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;min-height:50px}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.ghost{background:transparent}
.btn.block{width:100%;margin-top:24px}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);width:42px;height:42px;border-radius:12px;display:grid;place-items:center;cursor:pointer}
.link{appearance:none;border:0;background:none;color:var(--accent);font:inherit;font-weight:600;padding:12px 0;cursor:pointer}
.warn{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:13px;margin-top:16px}
.err{color:var(--danger);font-size:13px;margin-top:10px;min-height:18px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.top .grow{flex:1;min-width:0}
.top h1{margin:0;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc{width:100%;display:flex;align-items:center;gap:16px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px;cursor:pointer;color:var(--ink);font:inherit;box-shadow:var(--shadow)}
.thumb{width:84px;height:56px;border-radius:8px;object-fit:contain;background:var(--soft);flex:none;border:1px solid var(--line);padding:2px}
.doc .meta{flex:1;min-width:0}
.doc b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc span{font-size:13px;color:var(--muted)}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--soft);white-space:nowrap}
.badge.warn{background:#fdf1dc;color:var(--warn)}.badge.bad{background:#fde4e1;color:var(--danger)}
.fab{position:fixed;left:0;right:0;margin:0 auto;bottom:calc(24px + env(safe-area-inset-bottom));width:min(512px,calc(100% - 48px));box-shadow:0 10px 30px rgba(42,63,168,.3)}
.empty{text-align:center;padding:48px 12px;color:var(--muted)}
.slot{border:1.5px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;background:var(--card)}
.slot.has{border-style:solid;padding:10px}
.slot img{width:100%;border-radius:10px;display:block;border:1px solid var(--line)}
.slot .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.slot .acts .btn{flex:1;font-size:14px;padding:9px 10px}
.side-label{font-size:13px;font-weight:700;margin:16px 0 8px;display:flex;justify-content:space-between}
.docimg{width:100%;border-radius:12px;display:block;border:1px solid var(--line);background:#fff}
.field{display:flex;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field .k{font-size:12px;color:var(--muted);width:64px;flex:none}
.field .v{flex:1;min-width:0;word-break:break-word;font-weight:600}
.mono{white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:0;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink);font-weight:500;margin:12px 0 0}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.banner{background:#fdf1dc;color:#6b3d05;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:14px}
ul.plain{padding-left:18px;margin:0}ul.plain li{margin:6px 0}
.modal{position:fixed;inset:0;background:#0b0c12;z-index:50;display:flex;flex-direction:column;color:#fff}
.editor{display:flex;flex-direction:column;height:100%;padding:max(14px,env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom))}
.ed-top{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}.ed-top span{color:#a7abc0;font-size:13px}
.ed-stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.ed-stage canvas{touch-action:none;border-radius:6px}
.ed-actions{display:flex;gap:8px;margin-top:12px}.ed-actions .btn{flex:1;background:#1c1e29;border-color:#2c2f3d;color:#fff}.ed-actions .btn.primary{background:#8c9cff;border-color:#8c9cff;color:#0b0c12}
.busy{position:fixed;inset:0;background:rgba(10,11,18,.55);z-index:80;display:grid;place-items:center;color:#fff;font-weight:600}
.spin{width:34px;height:34px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:s 0.8s linear infinite;margin:0 auto 12px}@keyframes s{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:#15171f;color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;z-index:90;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast button{background:#8c9cff;color:#0b0c12;border:0;border-radius:8px;padding:8px 12px;font-weight:700;font:inherit;font-weight:700}
.logo svg{width:28px;height:28px}
.logo>svg.wheel{width:34px;height:34px}
.logo:has(svg.wheel),.brand .mark{background:linear-gradient(145deg,#8B6CFF 0%,#5B3FD6 52%,#3A2496 100%);color:#F4EFE6;box-shadow:0 6px 16px rgba(74,44,180,.28)}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand .mark svg{width:23px;height:23px}
.brand b{font:400 22px/1 'Young Serif',Georgia,serif;letter-spacing:0}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:4px 8px;border-radius:99px;background:var(--soft);color:var(--accent)}
.tag svg{width:12px;height:12px}
.help{appearance:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--muted);font:700 14px/1 inherit;cursor:pointer;display:inline-grid;place-items:center;vertical-align:middle;margin-left:8px;padding:0}
.hrow{display:flex;align-items:center}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}

/* ---------- encoding + crypto ---------- */
function b64(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);}
function unb64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function deriveRaw(pass,salt,iter=ITER){
  const base=await crypto.subtle.importKey('raw',TE.encode(pass),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,256));
}
const keyFromRaw=raw=>crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['encrypt','decrypt']);

/* ---------- Face ID (passkey + PRF): wraps the vault key so Face ID can unlock it ---------- */
async function wrapKeyFrom(prfOut){
  const ikm=await crypto.subtle.importKey('raw',prfOut,'HKDF',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'HKDF',hash:'SHA-256',salt:TE.encode('id-vault-faceid-v1'),info:TE.encode('wrap')},ikm,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const Bio={
  webOK(){return !!window.PublicKeyCredential&&(location.protocol==='https:'||location.hostname==='localhost');},
  async available(){try{return this.webOK()&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();}catch(e){return false;}},
  async prf(credId,salt){
    const a=await navigator.credentials.get({publicKey:{challenge:rnd(32),allowCredentials:[{type:'public-key',id:credId,transports:['internal']}],hints:['client-device'],userVerification:'required',timeout:60000,extensions:{prf:{eval:{first:salt}}}}});
    const r=a.getClientExtensionResults();
    if(!r.prf||!r.prf.results||!r.prf.results.first)throw new Error('Face ID unlock for web apps needs iOS 18 or later.');
    return r.prf.results.first;
  },
  async create(){
    const salt=rnd(32);
    const cred=await navigator.credentials.create({publicKey:{rp:{name:'Vault'},user:{id:rnd(16),name:'Vault',displayName:'Vault'},challenge:rnd(32),
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',residentKey:'required',userVerification:'required'},hints:['client-device'],timeout:60000,
      extensions:{prf:{eval:{first:salt}}}}});
    const ext=cred.getClientExtensionResults();
    if(!ext.prf||ext.prf.enabled===false)throw new Error('This device can\'t use Face ID for web apps yet (needs iOS 18 or later).');
    return{credId:new Uint8Array(cred.rawId),salt,out:ext.prf.results&&ext.prf.results.first};
  },
  async finish(p){
    const out=p.out||await this.prf(p.credId,p.salt);
    const wk=await wrapKeyFrom(out),iv=rnd(12);
    const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},wk,rawKey));
    const cfg=await Store.get('kv','config');
    cfg.bio={credId:b64(p.credId),salt:b64(p.salt),iv:b64(iv),ct:b64(ct)};
    await Store.put('kv',cfg,'config');
  },
  async unlock(cfg){
    const out=await this.prf(unb64(cfg.bio.credId),unb64(cfg.bio.salt));
    const wk=await wrapKeyFrom(out);
    return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(cfg.bio.iv)},wk,unb64(cfg.bio.ct)));
  }
};
async function seal(k,obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,TE.encode(JSON.stringify(obj))));
  return {iv:b64(iv),ct:b64(ct)};
}
async function unseal(k,rec){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(rec.iv)},k,unb64(rec.ct));
  return JSON.parse(TD.decode(pt));
}

/* ---------- storage (IndexedDB, this device only) ---------- */
const Store=(()=>{
  let dbp=null,mem=null;
  function open(){
    if(dbp)return dbp;
    dbp=new Promise(res=>{
      const fallback=()=>{mem={kv:new Map(),docs:new Map()};res(null);};
      try{
        const r=indexedDB.open('id-vault',1);
        r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('kv');d.createObjectStore('docs',{keyPath:'id'});};
        r.onsuccess=()=>res(r.result);r.onerror=fallback;r.onblocked=fallback;
      }catch(e){fallback();}
    });
    return dbp;
  }
  async function req(store,mode,make){
    const db=await open();
    return new Promise((res,rej)=>{
      const t=db.transaction(store,mode);const r=make(t.objectStore(store));
      t.oncomplete=()=>res(r&&r.result);t.onerror=t.onabort=()=>rej(t.error||new Error('Storage error'));
    });
  }
  return{
    async get(s,k){await open();return mem?mem[s].get(k):req(s,'readonly',o=>o.get(k));},
    async put(s,v,k){await open();if(mem){mem[s].set(k===undefined?v.id:k,v);return;}return req(s,'readwrite',o=>k===undefined?o.put(v):o.put(v,k));},
    async del(s,k){await open();if(mem){mem[s].delete(k);return;}return req(s,'readwrite',o=>o.delete(k));},
    async all(s){await open();return mem?[...mem[s].values()]:req(s,'readonly',o=>o.getAll());},
    async clear(s){await open();if(mem){mem[s].clear();return;}return req(s,'readwrite',o=>o.clear());},
    persistent(){return !mem;}
  };
})();

/* ---------- session state + auto-lock ---------- */
let key=null,rawKey=null,docs=[],picking=false,idleT=null,hiddenAt=0;
const IDLE_MS=3*60*1000,AWAY_MS=60*1000;
function bump(){if(!key)return;clearTimeout(idleT);idleT=setTimeout(()=>lock(),IDLE_MS);}
['pointerdown','keydown','scroll','touchstart'].forEach(e=>addEventListener(e,bump,{passive:true}));
document.addEventListener('visibilitychange',()=>{
  document.body.classList.toggle('veil',document.hidden&&!!key);
  if(document.hidden){hiddenAt=Date.now();return;}
  if(key&&!picking&&Date.now()-hiddenAt>AWAY_MS)lock();
});
function lock(msg){
  if(rawKey)rawKey.fill(0);key=null;rawKey=null;docs=[];draft=null;srcs=[];current=null;clearTimeout(idleT);
  $$('.modal,.toast').forEach(n=>n.remove());done();
  document.body.classList.remove('veil');renderLock(msg);
}

/* ---------- ui helpers ---------- */
function busy(t){done();const d=document.createElement('div');d.className='busy';d.innerHTML=`<div style="text-align:center"><div class="spin"></div>${esc(t)}</div>`;document.body.appendChild(d);}
function done(){$$('.busy').forEach(n=>n.remove());}
function toast(msg,action){
  $$('.toast').forEach(n=>n.remove());

/* ---------- corner editor ---------- */

    }

      q.forEach((p,i)=>{x.beginPath();x.arc(p[0],p[1],(i===active?14:11)/scale,0,Math.PI*2);x.fillStyle=i===active?'#8c9cff':'#fff';x.fill();x.lineWidth=3/scale;x.strokeStyle='#8c9cff';x.stroke();});
      if(active>=0){

        x.beginPath();x.moveTo(lx-10,ly);x.lineTo(lx+10,ly);x.moveTo(lx,ly-10);x.lineTo(lx,ly+10);x.stroke();
      }
    }

/* ---------- export: watermark, pages, PDF, share ---------- */
function watermark(c,text){
  const x=c.getContext('2d'),fs=Math.max(16,Math.round(Math.min(c.width,c.height)/13));
  x.save();x.font=`700 ${fs}px -apple-system,"Segoe UI",Roboto,sans-serif`;x.fillStyle='rgba(28,30,70,.2)';
  x.translate(c.width/2,c.height/2);x.rotate(-Math.PI/9);
  const tw=x.measureText(text).width+fs*2,diag=Math.hypot(c.width,c.height);let row=0;
  for(let y=-diag/2;y<diag/2;y+=fs*2.8,row++)for(let xx=-diag/2-(row%2?tw/2:0);xx<diag/2;xx+=tw)x.fillText(text,xx,y);

function makePDF(pages){
  const parts=[],offs=[];let pos=0;
  const push=v=>{const u=typeof v==='string'?TE.encode(v):v;parts.push(u);pos+=u.length;};
  const obj=(n,body)=>{offs[n]=pos;push(`${n} 0 obj\n`);typeof body==='string'?push(body):body();push('\nendobj\n');};

  obj(2,`<< /Type /Pages /Kids [${pages.map((_,i)=>`${3+i*3} 0 R`).join(' ')}] /Count ${N} >>`);
  pages.forEach((p,i)=>{
    const pg=3+i*3,ct=pg+1,im=pg+2,s=Math.min(PW/p.w,PH/p.h),dw=p.w*s,dh=p.h*s;
    const cs=`q ${dw.toFixed(2)} 0 0 ${dh.toFixed(2)} ${((PW-dw)/2).toFixed(2)} ${((PH-dh)/2).toFixed(2)} cm /Im0 Do Q`;
    obj(pg,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${ct} 0 R >>`);
    obj(ct,()=>push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(im,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.bytes.length} >>\nstream\n`);push(p.bytes);push('\nendstream');});
  });

  for(let n=1;n<total;n++)x+=String(offs[n]).padStart(10,'0')+' 00000 n \n';
  push(x);push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);

}

      <div id="nameBox"${custom?'':' hidden'}><label for="label">Name</label><input id="label" value="${esc(m.label)}" placeholder="e.g. Rent agreement" autocapitalize="words"></div>
      ${isNew?'':`<label for="number">Document number</label><input id="number" class="mono" value="${esc(m.number)}" placeholder="Read from your document" autocapitalize="characters" spellcheck="false">`}
      <button class="btn primary block" id="save">Save</button>
    </form>`;
  const sync=()=>{m.label=m.type==='other'?$('#label').value.trim():'';if($('#number'))m.number=$('#number').value.trim();};
  const redo=i=>{draft.pages[i]=processPage(srcs[i],m.enhance!==false).toDataURL('image/jpeg',0.92);};
  const finish=async()=>{
    busy('Saving…');
    try{const saved=await saveDraft();done();renderDetail(saved);toast('Saved');autoNumber(saved);}
    catch(err){done();toast('Could not save: '+err.message);}
  };
  $('#bk').onclick=()=>{if(isNew&&!confirm('Discard this document?'))return;draft.id?renderDetail(docs.find(d=>d.id===draft.id)):renderList();};
  $$('[data-tag]').forEach(b=>b.onclick=async()=>{
    sync();m.type=b.dataset.tag;
    $$('[data-tag]').forEach(c=>c.classList.toggle('on',c===b));
    if(m.type==='other'){$('#f').hidden=false;$('#nameBox').hidden=false;$('#label').focus();return;}
    m.label='';$('#nameBox').hidden=true;
    if(isNew)await finish();
  });
  $('#more').onclick=()=>{sync();startAdd(draft);};
  $$('[data-rm]').forEach(b=>b.onclick=()=>{sync();const i=+b.dataset.rm;draft.pages.splice(i,1);srcs.splice(i,1);if(!draft.pages.length&&isNew)return renderList();renderEdit();});
  $$('[data-rot]').forEach(b=>b.onclick=async()=>{sync();const i=+b.dataset.rot;if(srcs[i]){srcs[i].rot^=1;redo(i);}else draft.pages[i]=await rotateDataURL180(draft.pages[i]);renderEdit();});
  $$('[data-crop]').forEach(b=>b.onclick=async()=>{sync();const i=+b.dataset.crop;const q=await cropEditor(srcs[i].c,srcs[i].quad);if(!q)return;srcs[i].quad=q;srcs[i].auto=true;busy('Straightening…');await nextFrame();redo(i);done();renderEdit();});
  $('#f').onsubmit=async e=>{
    e.preventDefault();sync();
    if(m.type==='other'&&!m.label){$('#label').focus();return toast('Give it a name');}
    if(!draft.pages.length)return toast('Add at least one photo');
    if(!isNew)m.ocrTried=!!m.number&&m.ocrTried;
    await finish();
  };
}

/* detail */
function renderDetail(d){
  if(!d)return renderList();
  current=d;const m=d.meta,pg=pagesOf(d),n=pg.length;let shown=false;const isReading=reading.has(d.id);
  app.innerHTML=`<div class="top"><button class="icon-btn" id="bk" aria-label="Back">${I.back}</button><div class="grow"><h1>${esc(docTitle(m))}</h1></div>
      <button class="icon-btn" id="menu" aria-label="More">${I.dots}</button></div>
    ${n>1?`<div class="carousel" id="car">${pg.map((u,i)=>`<div class="slide"><img class="docimg" src="${u}" alt="${pageLabel(i,n)}"><span class="slide-tag">${pageLabel(i,n)}</span></div>`).join('')}</div>
      <div class="cdots">${pg.map((_,i)=>`<span class="${i?'':'on'}"></span>`).join('')}</div>`
      :`<img class="docimg" src="${pg[0]}" alt="">`}
    ${m.number||isReading?`<h2>Number</h2><div class="card" style="padding:4px 20px">
      ${isReading&&!m.number?`<div class="field"><span class="v muted" style="font-weight:500">Reading from your document…</span></div>`:''}
      ${m.number?`<div class="field"><span class="v mono" id="num">${esc(maskNum(m.number))}</span><button class="icon-btn" id="eye" aria-label="Show number">${I.eye}</button><button class="icon-btn" id="cp" aria-label="Copy number">${I.copy}</button></div>`:''}
    </div>`:''}
    <button class="btn primary fab" id="sh">${I.share} Share</button>`;
  $('#bk').onclick=renderList;
  $('#sh').onclick=()=>shareDoc(d);
  $('#menu').onclick=()=>sheet(`<div class="list"><button class="item" id="mEd"><span class="ic">${I.edit}</span><span class="t">Edit</span></button>
      <button class="item danger" id="mDel"><span class="ic">${I.trash}</span><span class="t">Delete</span></button></div>`,(el,close)=>{
    $('#mEd',el).onclick=()=>{close();renderEdit(d);};
    $('#mDel',el).onclick=async()=>{close();if(!confirm(`Delete "${docTitle(m)}"?`))return;await Store.del('docs',d.id);docs=docs.filter(x=>x.id!==d.id);renderList();toast('Deleted');};
  });
  if($('#eye'))$('#eye').onclick=()=>{shown=!shown;$('#num').textContent=shown?m.number:maskNum(m.number);};
  if($('#cp'))$('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(m.number);toast('Number copied');}catch(e){shown=true;$('#num').textContent=m.number;toast('Copy blocked here. Number shown instead');}};
  const car=$('#car');
  if(car)car.onscroll=()=>{const k=Math.round(car.scrollLeft/car.querySelector('.slide').offsetWidth);$$('.cdots span').forEach((s,i)=>s.classList.toggle('on',i===k));};
  if(!isReading)scrollTo(0,0);
  autoNumber(d);
}
/* Shares every page as a photo, straight into the share sheet. */
async function shareDoc(d){
  const pg=pagesOf(d),base=slug(docTitle(d.meta));busy('Preparing…');await nextFrame();
  try{
    const files=[];
    for(let i=0;i<pg.length;i++){const lab=pageLabel(i,pg.length);files.push(new File([await toBlob(await sideCanvas(pg[i],''))],`${base}${lab?'-'+slug(lab):''}.jpg`,{type:'image/jpeg'}));}
    done();await shareOrSave(files);
  }catch(e){done();toast('Could not prepare the file: '+e.message);}
}

/* settings */
async function renderSettings(){
  const cfg=await Store.get('kv','config'),bioAvail=await Bio.available(),bioOn=!!cfg.bio;
  app.innerHTML=`<div class="top"><button class="icon-btn" id="bk" aria-label="Back">${I.back}</button><div class="grow hrow"><h1>Settings</h1><button class="help" id="hp" aria-label="How Vault protects you">?</button></div></div>
    ${storageBanner()}
    <div class="list">
      <button class="item" id="bioSw"${bioAvail?'':' disabled'}><span class="ic">${I.face}</span><span class="t">Face ID</span>${bioAvail?`<span class="sw${bioOn?' on':''}"></span>`:'<span class="r">Unavailable</span>'}</button>
      <button class="item" id="bkp"><span class="ic">${I.backup}</span><span class="t">Backup</span><span class="r">${I.chev}</span></button>
      <button class="item" id="pw"><span class="ic">${I.key}</span><span class="t">Change PIN</span><span class="r">${I.chev}</span></button>
    </div>
    <div class="list" style="margin-top:16px">
      <button class="item" id="out"><span class="ic">${I.lock}</span><span class="t">Log out</span></button>
      <button class="item danger" id="wipe"><span class="ic">${I.trash}</span><span class="t">Erase Vault</span></button>
    </div>`;
  $('#bk').onclick=renderList;
  $('#hp').onclick=helpSheet;
  $('#out').onclick=()=>lock();
  $('#bioSw').onclick=async()=>{
    if(bioOn){const c=await Store.get('kv','config');delete c.bio;await Store.put('kv',c,'config');toast('Face ID off');}
    else await enableFaceID();
    renderSettings();
  };
  $('#bkp').onclick=()=>sheet(`<h3>Backup</h3>
    <div class="list"><button class="item" id="exp"><span class="ic">${I.backup}</span><span class="t">Export backup</span></button>
    <button class="item" id="imp"><span class="ic" style="transform:rotate(180deg)">${I.backup}</span><span class="t">Restore from backup</span></button></div>
    <p class="muted small" style="margin:12px 2px 0">Backups stay encrypted with your PIN.</p>`,(el,close)=>{
      $('#exp',el).onclick=()=>{close();exportBackup();};
      $('#imp',el).onclick=()=>{close();restoreBackup();};
    });
  $('#pw').onclick=()=>choosePin({icon:I.key,title:'New PIN',onCancel:renderSettings,
    onSet:async pin=>{busy('Updating…');await nextFrame();
      try{const hadBio=await rekey(pin);done();toast('PIN updated');hadBio?faceStep(renderSettings):renderSettings();}
      catch(err){done();toast('Failed: '+err.message);renderSettings();}}});
  $('#wipe').onclick=async()=>{
    if(!confirm('Erase all documents from this phone? This can\'t be undone.'))return;
    await Store.clear('docs');await Store.clear('kv');key=null;rawKey=null;docs=[];renderSetup();toast('Vault erased');
  };
}
async function exportBackup(){
  const cfg=await Store.get('kv','config'),recs=await Store.all('docs');
  const data=JSON.stringify({app:'id-vault',v:1,config:cfg,docs:recs});
  const name=`vault-backup-${new Date().toISOString().slice(0,10)}.idvault`;
  download([new File([data],name,{type:'application/octet-stream'})]);toast('Backup saved');
}
function restoreBackup(){
  const i=document.createElement('input');i.type='file';i.accept='.idvault,application/json,application/octet-stream';
  picking=true;
  i.onchange=async()=>{
    picking=false;const f=i.files[0];if(!f)return;
    try{
      const j=JSON.parse(await f.text());
      if(j.app!=='id-vault'||!j.config||!Array.isArray(j.docs))throw new Error('Not a Vault backup');
      if(!confirm(`Restore ${j.docs.length} document(s)? This replaces what's in the vault on this device.`))return;
      await Store.clear('docs');for(const r of j.docs)await Store.put('docs',r);await Store.put('kv',j.config,'config');
      lock('Backup restored. Use that backup\'s PIN.');
    }catch(e){toast('Restore failed: '+e.message);}
  };
  i.addEventListener('cancel',()=>{picking=false;});
  i.click();
}

/* ---------- start ---------- */
(async function init(){
  if(!window.crypto||!crypto.subtle){app.innerHTML='<div class="center"><h1>Can\'t open securely here</h1><p class="muted">Open Vault in Safari or Chrome.</p></div>';return;}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
  (await Store.get('kv','config'))?renderLock(null,true):renderSetup();
})();
</script>
