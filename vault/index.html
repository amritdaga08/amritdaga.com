<script>
'use strict';
/* ---------- basics ---------- */
const $=(s,r=document)=>r.querySelector(s);

const nextFrame=()=>new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0)));

const FORMATS={

const I={

  lock:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>',

  share:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12v7a2 2 0 002 2h12a2 2 0 002-2v-7M16 6l-4-4-4 4M12 2v14"/></svg>'
};

/* ---------- encoding + crypto ---------- */
function b64(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);}
function unb64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function deriveRaw(pass,salt,iter=ITER){
  const base=await crypto.subtle.importKey('raw',TE.encode(pass),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,256));
}
const keyFromRaw=raw=>crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['encrypt','decrypt']);

/* ---------- Face ID (passkey + PRF): wraps the vault key so Face ID can unlock it ---------- */
async function wrapKeyFrom(prfOut){
  const ikm=await crypto.subtle.importKey('raw',prfOut,'HKDF',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'HKDF',hash:'SHA-256',salt:TE.encode('id-vault-faceid-v1'),info:TE.encode('wrap')},ikm,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const Bio={
  webOK(){return !!window.PublicKeyCredential&&(location.protocol==='https:'||location.hostname==='localhost');},
  async available(){try{return this.webOK()&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();}catch(e){return false;}},
  async prf(credId,salt){
    const a=await navigator.credentials.get({publicKey:{challenge:rnd(32),allowCredentials:[{type:'public-key',id:credId}],userVerification:'required',timeout:60000,extensions:{prf:{eval:{first:salt}}}}});
    const r=a.getClientExtensionResults();
    if(!r.prf||!r.prf.results||!r.prf.results.first)throw new Error('Face ID unlock for web apps needs iOS 18 or later.');
    return r.prf.results.first;
  },
  async create(){
    const salt=rnd(32);
    const cred=await navigator.credentials.create({publicKey:{rp:{name:'ID Vault'},user:{id:rnd(16),name:'ID Vault',displayName:'ID Vault'},challenge:rnd(32),
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',residentKey:'required',userVerification:'required'},timeout:60000,
      extensions:{prf:{eval:{first:salt}}}}});
    const ext=cred.getClientExtensionResults();
    if(!ext.prf||ext.prf.enabled===false)throw new Error('This device can\'t use Face ID for web apps yet (needs iOS 18 or later).');
    return{credId:new Uint8Array(cred.rawId),salt,out:ext.prf.results&&ext.prf.results.first};
  },
  async finish(p){
    const out=p.out||await this.prf(p.credId,p.salt);
    const wk=await wrapKeyFrom(out),iv=rnd(12);
    const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},wk,rawKey));
    const cfg=await Store.get('kv','config');
    cfg.bio={credId:b64(p.credId),salt:b64(p.salt),iv:b64(iv),ct:b64(ct)};
    await Store.put('kv',cfg,'config');
  },
  async unlock(cfg){
    const out=await this.prf(unb64(cfg.bio.credId),unb64(cfg.bio.salt));
    const wk=await wrapKeyFrom(out);
    return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(cfg.bio.iv)},wk,unb64(cfg.bio.ct)));
  }
};
async function seal(k,obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,TE.encode(JSON.stringify(obj))));
  return {iv:b64(iv),ct:b64(ct)};
}
async function unseal(k,rec){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(rec.iv)},k,unb64(rec.ct));
  return JSON.parse(TD.decode(pt));
}

/* ---------- storage (IndexedDB, this device only) ---------- */
const Store=(()=>{
  let dbp=null,mem=null;
  function open(){
    if(dbp)return dbp;
    dbp=new Promise(res=>{
      const fallback=()=>{mem={kv:new Map(),docs:new Map()};res(null);};
      try{
        const r=indexedDB.open('id-vault',1);
        r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('kv');d.createObjectStore('docs',{keyPath:'id'});};
        r.onsuccess=()=>res(r.result);r.onerror=fallback;r.onblocked=fallback;
      }catch(e){fallback();}
    });
    return dbp;
  }
  async function req(store,mode,make){
    const db=await open();
    return new Promise((res,rej)=>{
      const t=db.transaction(store,mode);const r=make(t.objectStore(store));
      t.oncomplete=()=>res(r&&r.result);t.onerror=t.onabort=()=>rej(t.error||new Error('Storage error'));
    });
  }
  return{
    async get(s,k){await open();return mem?mem[s].get(k):req(s,'readonly',o=>o.get(k));},
    async put(s,v,k){await open();if(mem){mem[s].set(k===undefined?v.id:k,v);return;}return req(s,'readwrite',o=>k===undefined?o.put(v):o.put(v,k));},
    async del(s,k){await open();if(mem){mem[s].delete(k);return;}return req(s,'readwrite',o=>o.delete(k));},
    async all(s){await open();return mem?[...mem[s].values()]:req(s,'readonly',o=>o.getAll());},
    async clear(s){await open();if(mem){mem[s].clear();return;}return req(s,'readwrite',o=>o.clear());},
    persistent(){return !mem;}
  };
})();

/* ---------- session state + auto-lock ---------- */
let key=null,rawKey=null,docs=[],picking=false,idleT=null,hiddenAt=0;
const IDLE_MS=3*60*1000,AWAY_MS=60*1000;
function bump(){if(!key)return;clearTimeout(idleT);idleT=setTimeout(()=>lock('Locked after 3 minutes of inactivity.'),IDLE_MS);}
['pointerdown','keydown','scroll','touchstart'].forEach(e=>addEventListener(e,bump,{passive:true}));
document.addEventListener('visibilitychange',()=>{
  document.body.classList.toggle('veil',document.hidden&&!!key);
  if(document.hidden){hiddenAt=Date.now();return;}
  if(key&&!picking&&Date.now()-hiddenAt>AWAY_MS)lock('Locked while you were away.');
});
function lock(msg){

      <label for="p1">Passphrase (8+ characters)</label><input id="p1" type="password" autocomplete="new-password" minlength="8" required>
      <label for="p2">Confirm passphrase</label><input id="p2" type="password" autocomplete="new-password" required>
      <div class="warn">There is no recovery. If you forget the passphrase, nobody can open the vault, including you. Use something memorable and export a backup from Settings.</div>
      <div class="err" id="e"></div>
      <button class="btn primary block">Create vault</button>
    </form>
    <button class="link" id="restore">Restore from a backup instead</button>
  </div>`;
  $('#f').onsubmit=async e=>{
    e.preventDefault();const p1=$('#p1').value,p2=$('#p2').value;
    if(p1.length<8)return $('#e').textContent='Use at least 8 characters.';
    if(p1!==p2)return $('#e').textContent="Passphrases don't match.";
    busy('Securing your vault…');await nextFrame();
    try{
      const salt=crypto.getRandomValues(new Uint8Array(16));rawKey=await deriveRaw(p1,salt);key=await keyFromRaw(rawKey);
      await Store.put('kv',{salt:b64(salt),iter:ITER,check:await seal(key,'id-vault-ok')},'config');
      docs=[];bump();done();renderList();offerFaceID();
    }catch(err){done();$('#e').textContent='Could not create the vault: '+err.message;}
  };
  $('#restore').onclick=restoreBackup;
}
async function renderLock(msg,auto){
  const cfg=await Store.get('kv','config');const bio=!!(cfg&&cfg.bio)&&Bio.webOK();
  app.innerHTML=`<div class="center">
    <div class="logo">${I.lock}</div>
    <h1>ID Vault</h1>
    <p class="muted">${esc(msg||(bio?'Unlock with Face ID, or use your passphrase.':'Enter your passphrase to unlock.'))}</p>
    ${bio?`<button class="btn primary block" id="fid">${I.face} Unlock with Face ID</button><button class="link" id="usepw">Use passphrase instead</button>`:''}
    <form id="f" autocomplete="off"${bio?' hidden':''}><input id="p" type="password" autocomplete="current-password" placeholder="Passphrase" required>
    <div class="err" id="e"></div><button class="btn ${bio?'':'primary '}block">Unlock with passphrase</button></form>
  </div>`;
  const showPw=()=>{$('#f').hidden=false;$('#usepw')&&$('#usepw').remove();$('#p').focus();};
  if(bio){
    const go=async quiet=>{
      try{busy('Unlocking…');const raw=await Bio.unlock(cfg);const ok=await openVault(raw);done();if(ok)return renderList();showPw();$('#e').textContent='Face ID key no longer matches. Use your passphrase.';}
      catch(e){done();if(!quiet&&e.name!=='NotAllowedError'&&e.name!=='AbortError')toast(e.message);}
    };
    $('#fid').onclick=()=>go(false);$('#usepw').onclick=showPw;
    if(auto)go(true);
  }
  $('#f').onsubmit=async e=>{
    e.preventDefault();busy('Unlocking…');await nextFrame();
    const ok=await unlock($('#p').value);done();
    if(ok)renderList();else{$('#e').textContent='Wrong passphrase.';$('#f').classList.remove('shake');void $('#f').offsetWidth;$('#f').classList.add('shake');$('#p').select();}
  };
  if(!bio)setTimeout(()=>$('#p')&&$('#p').focus(),50);
}
async function unlock(pass){
  const cfg=await Store.get('kv','config');if(!cfg)return false;
  return openVault(await deriveRaw(pass,unb64(cfg.salt),cfg.iter||ITER));
}
async function openVault(raw){
  const cfg=await Store.get('kv','config');const k=await keyFromRaw(raw);
  try{if(await unseal(k,cfg.check)!=='id-vault-ok')return false;}catch(e){return false;}
  key=k;rawKey=raw;docs=[];
  for(const r of await Store.all('docs')){try{docs.push(Object.assign({id:r.id},await unseal(k,r)));}catch(e){}}
  sortDocs();bump();return true;
}
async function enableFaceID(){
  try{
    const p=await Bio.create();
    try{await Bio.finish(p);toast('Face ID is on');}
    catch(e){
      if(e.name!=='NotAllowedError')throw e;
      toast('One more scan to finish',{label:'Confirm',fn:()=>Bio.finish(p).then(()=>{toast('Face ID is on');if($('#bioSec'))renderSettings();}).catch(err=>toast(err.message))});
    }
  }catch(e){if(e.name!=='NotAllowedError'&&e.name!=='AbortError')toast(e.message);}
}
async function offerFaceID(){
  if(!(await Bio.available()))return;
  const cfg=await Store.get('kv','config');if(cfg.bio)return;
  toast('Unlock with Face ID next time?',{label:'Turn on',fn:async()=>{await enableFaceID();}});
}
function storageBanner(){return Store.persistent()?'':'<div class="banner">This browser isn\'t saving data on this page. Export a backup before you close it, or open the vault in Chrome or Safari directly.</div>';}
function renderList(){
  current=null;draft=null;srcs={};
  app.innerHTML=`${storageBanner()}<div class="top"><div class="grow"><h1>ID Vault</h1><div class="muted small">${docs.length} document${docs.length===1?'':'s'} · encrypted on this device</div></div>
    <button class="icon-btn" id="set" aria-label="Settings">${I.gear}</button><button class="icon-btn" id="lk" aria-label="Lock">${I.lock}</button></div>
    ${docs.length?docs.map(d=>`<button class="doc" data-id="${d.id}"><img class="thumb" alt="" src="${d.front||d.back||''}"><div class="meta"><b>${esc(docTitle(d.meta))}</b><span>${esc(typeName(d.meta))}${d.meta.number?' · '+esc(maskNum(d.meta.number)):''}</span></div>${expiryBadge(d.meta)}</button>`).join('')
      :`<div class="empty">${I.shield}<p style="margin-top:10px"><b>No documents yet</b></p><p class="small">Add your Aadhaar, PAN, passport or licence. Take a photo or pick one from your gallery, and it gets straightened and sized for you.</p></div>`}
    <button class="btn primary fab" id="add">${I.plus} Add document</button>`;
  $$('.doc').forEach(b=>b.onclick=()=>renderDetail(docs.find(d=>d.id===b.dataset.id)));
  $('#add').onclick=()=>renderEdit(null);
  $('#lk').onclick=()=>lock('Locked.');
  $('#set').onclick=renderSettings;
  scrollTo(0,0);
}

/* edit */
let draft=null,srcs={},current=null;
function renderEdit(doc){
  if(doc!==undefined){
    draft=doc?JSON.parse(JSON.stringify(doc)):{id:null,meta:{type:'aadhaar',fmt:'card',label:'',holder:'',number:'',expiry:'',notes:'',enhance:true},front:null,back:null};
    srcs={};
  }
  const m=draft.meta;
  const slot=(side,title)=>`<div class="side-label"><span>${title}</span>${side==='back'?'<span class="muted">optional</span>':''}</div>
    ${draft[side]?`<div class="slot has"><img src="${draft[side]}" alt="${title}"><div class="acts"><button type="button" class="btn" data-rot="${side}">Rotate 180°</button><button type="button" class="btn" data-recrop="${side}">${srcs[side]?'Adjust edges':'Replace'}</button><button type="button" class="btn danger" data-rm="${side}">Remove</button></div></div>`
    :`<div class="slot"><div class="muted small" style="margin-bottom:10px">Add the ${side} side</div><div class="acts"><button type="button" class="btn" data-cam="${side}">${I.cam} Take photo</button><button type="button" class="btn" data-gal="${side}">${I.img} From gallery</button></div></div>`}`;
  app.innerHTML=`<div class="top"><button class="icon-btn" id="bk" aria-label="Back">${I.back}</button><div class="grow"><h1>${draft.id?'Edit document':'Add document'}</h1></div></div>
    <form id="f" autocomplete="off">
      <div class="row"><div><label for="type">Document</label><select id="type">${ORDER.map(k=>`<option value="${k}"${k===m.type?' selected':''}>${TYPES[k][0]}</option>`).join('')}</select></div>
      <div><label for="fmt">Size</label><select id="fmt">${Object.entries(FORMATS).map(([k,v])=>`<option value="${k}"${k===m.fmt?' selected':''}>${v.label}</option>`).join('')}</select></div></div>
      ${slot('front','Front')}${slot('back','Back')}
      <label class="check"><input type="checkbox" id="enh"${m.enhance!==false?' checked':''}> Auto-enhance (clean background, sharper text)</label>
      <h2>Details</h2>
      <label for="holder">Name on document</label><input id="holder" value="${esc(m.holder)}" placeholder="e.g. Amrit">
      <label for="number">Document number</label><input id="number" class="mono" value="${esc(m.number)}" placeholder="Stored unmasked so you can copy it" autocapitalize="characters" spellcheck="false">
      <div class="row"><div><label for="expiry">Expiry date</label><input id="expiry" type="date" value="${esc(m.expiry)}"></div><div><label for="label">Display name</label><input id="label" value="${esc(m.label)}" placeholder="Auto"></div></div>
      <label for="notes">Notes</label><textarea id="notes" placeholder="e.g. Address on this one is the Bengaluru address">${esc(m.notes)}</textarea>
      <button class="btn primary block" id="save">Save to vault</button>
    </form>`;
  const sync=()=>{Object.assign(m,{type:$('#type').value,fmt:$('#fmt').value,holder:$('#holder').value.trim(),number:$('#number').value.trim(),expiry:$('#expiry').value,label:$('#label').value.trim(),notes:$('#notes').value.trim(),enhance:$('#enh').checked});};
  const reprocessAll=async()=>{for(const s of['front','back'])if(srcs[s])await reprocess(s);};
  $('#bk').onclick=()=>draft.id?renderDetail(docs.find(d=>d.id===draft.id)):renderList();
  $('#type').onchange=async()=>{sync();const f=TYPES[m.type][1];if(f!==m.fmt){m.fmt=f;await reprocessAll();}renderEdit();};
  $('#fmt').onchange=async()=>{sync();await reprocessAll();if((draft.front&&!srcs.front)||(draft.back&&!srcs.back))toast('Replace existing photos to resize them');renderEdit();};
  $('#enh').onchange=async()=>{sync();await reprocessAll();renderEdit();};
  $$('[data-cam],[data-gal]').forEach(b=>b.onclick=()=>{sync();addSide(b.dataset.cam||b.dataset.gal,!!b.dataset.cam);});
  $$('[data-rm]').forEach(b=>b.onclick=()=>{sync();draft[b.dataset.rm]=null;delete srcs[b.dataset.rm];renderEdit();});
  $$('[data-rot]').forEach(b=>b.onclick=async()=>{sync();const s=b.dataset.rot;if(srcs[s]){srcs[s].rot^=1;await reprocess(s);}else draft[s]=await rotateDataURL180(draft[s]);renderEdit();});
  $$('[data-recrop]').forEach(b=>b.onclick=async()=>{sync();const s=b.dataset.recrop;
    if(!srcs[s])return addSide(s,false);
    const q=await cropEditor(srcs[s].c,srcs[s].quad);if(!q)return;srcs[s].quad=q;await reprocess(s);renderEdit();});
  $('#f').onsubmit=async e=>{
    e.preventDefault();sync();
    if(!draft.front&&!draft.back)return toast('Add at least one photo');
    busy('Encrypting…');
    try{
      draft.id=draft.id||(crypto.randomUUID?crypto.randomUUID():b64(crypto.getRandomValues(new Uint8Array(12))).replace(/[^a-z0-9]/gi,''));
      m.updated=Date.now();m.created=m.created||m.updated;
      const sealed=await seal(key,{meta:m,front:draft.front,back:draft.back});
      await Store.put('docs',Object.assign({id:draft.id},sealed));
      const saved={id:draft.id,meta:m,front:draft.front,back:draft.back};
      docs=docs.filter(d=>d.id!==saved.id);docs.push(saved);sortDocs();
      done();srcs={};renderDetail(saved);toast('Saved and encrypted');
    }catch(err){done();toast('Could not save: '+err.message);}
  };
}
function pickImage(camera){
  return new Promise(res=>{
    const i=document.createElement('input');i.type='file';i.accept='image/*';if(camera)i.setAttribute('capture','environment');
    i.onchange=()=>{picking=false;res(i.files[0]||null);};
    i.addEventListener('cancel',()=>{picking=false;res(null);});
    picking=true;i.click();
  });
}
async function addSide(side,camera){
  const f=await pickImage(camera);if(!f||!key)return;
  busy('Finding the edges…');await nextFrame();
  let c;try{c=await fileToCanvas(f);}catch(e){done();return toast(e.message);}
  const det=detectQuad(c);done();
  const q=await cropEditor(c,det.quad);if(!q)return;
  srcs[side]={c,quad:q,rot:0};await reprocess(side);renderEdit();
}
async function reprocess(side){
  const s=srcs[side];busy('Straightening and sizing…');await nextFrame();
  try{draft[side]=processSide(s.c,s.quad,draft.meta.fmt,s.rot,draft.meta.enhance!==false).toDataURL('image/jpeg',0.92);}
  finally{done();}
}

/* detail */
function renderDetail(d){
  if(!d)return renderList();
  current=d;const m=d.meta;let shown=false;
  app.innerHTML=`<div class="top"><button class="icon-btn" id="bk" aria-label="Back">${I.back}</button><div class="grow"><h1>${esc(docTitle(m))}</h1><div class="muted small">${esc(typeName(m))} · ${esc(FORMATS[m.fmt]?.label||'')}</div></div>${expiryBadge(m)}</div>
    ${d.front?`<div class="side-label">Front</div><img class="docimg" src="${d.front}" alt="Front">`:''}
    ${d.back?`<div class="side-label">Back</div><img class="docimg" src="${d.back}" alt="Back">`:''}
    <h2>Details</h2><div class="card" style="padding:4px 16px">
      ${m.holder?`<div class="field"><span class="k">Name</span><span class="v">${esc(m.holder)}</span></div>`:''}
      ${m.number?`<div class="field"><span class="k">Number</span><span class="v mono" id="num">${esc(maskNum(m.number))}</span><button class="icon-btn" id="eye" aria-label="Show number">${I.eye}</button><button class="icon-btn" id="cp" aria-label="Copy number">${I.copy}</button></div>`:''}
      ${m.expiry?`<div class="field"><span class="k">Expires</span><span class="v">${esc(new Date(m.expiry+'T00:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}))}</span></div>`:''}
      ${m.notes?`<div class="field"><span class="k">Notes</span><span class="v" style="font-weight:500">${esc(m.notes)}</span></div>`:''}
      ${!m.holder&&!m.number&&!m.expiry&&!m.notes?'<div class="field"><span class="muted small">No details added. Tap Edit to add the number so you can copy it.</span></div>':''}
    </div>
    <h2>Share</h2><div class="card">
      <label for="wm" style="margin-top:0">Watermark (recommended)</label>
      <input id="wm" placeholder="e.g. For HDFC Bank KYC only">
      <label class="check"><input type="checkbox" id="wmd" checked> Add today's date to the watermark</label>
      <div class="grid2" style="margin-top:14px">
        ${d.front?`<button class="btn" data-sh="front">${I.share} Front</button>`:''}
        ${d.back?`<button class="btn" data-sh="back">${I.share} Back</button>`:''}
        ${d.front&&d.back?`<button class="btn primary" data-sh="pdf">${I.share} Both · PDF</button><button class="btn" data-sh="image">${I.share} Both · Image</button>`:`<button class="btn primary" data-sh="pdf">${I.share} PDF</button>`}
      </div>
      <p class="muted small" style="margin:12px 0 0">Shares straight to WhatsApp, email or any app, without going through your gallery.</p>
    </div>
    <div class="row" style="margin-top:22px"><button class="btn" id="ed">Edit</button><button class="btn danger" id="del">Delete</button></div>`;
  $('#bk').onclick=renderList;
  $('#ed').onclick=()=>renderEdit(d);
  $('#del').onclick=async()=>{if(!confirm(`Delete "${docTitle(m)}" from the vault?`))return;await Store.del('docs',d.id);docs=docs.filter(x=>x.id!==d.id);renderList();toast('Deleted');};
  if($('#eye'))$('#eye').onclick=()=>{shown=!shown;$('#num').textContent=shown?m.number:maskNum(m.number);};
  if($('#cp'))$('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(m.number);toast('Number copied');}catch(e){shown=true;$('#num').textContent=m.number;toast('Copy blocked here. Number shown instead');}};
  $$('[data-sh]').forEach(b=>b.onclick=()=>shareDoc(d,b.dataset.sh));
  scrollTo(0,0);
}
async function shareDoc(d,kind){
  const t=$('#wm').value.trim();
  const wm=t?(t+($('#wmd').checked?' · '+new Date().toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'')):'';
  const base=slug(docTitle(d.meta));busy('Preparing…');await nextFrame();
  try{
    let files;
    if(kind==='front'||kind==='back'){
      files=[new File([await toBlob(await sideCanvas(d[kind],wm))],`${base}-${kind}.jpg`,{type:'image/jpeg'})];
    }else{
      const cs=[];for(const s of[d.front,d.back])if(s)cs.push(await sideCanvas(s,wm));
      if(kind==='image'){files=[new File([await toBlob(combinedImage(cs,d.meta.fmt))],`${base}.jpg`,{type:'image/jpeg'})];}
      else{
        const pages=[];for(const p of a4Pages(cs,d.meta.fmt))pages.push({bytes:new Uint8Array(await (await toBlob(p,0.9)).arrayBuffer()),w:p.width,h:p.height});
        files=[new File([makePDF(pages)],`${base}.pdf`,{type:'application/pdf'})];
      }
    }
    done();await shareOrSave(files);
  }catch(e){done();toast('Could not prepare the file: '+e.message);}
}

/* settings */
function renderSettings(){
  app.innerHTML=`<div class="top"><button class="icon-btn" id="bk" aria-label="Back">${I.back}</button><div class="grow"><h1>Settings</h1></div></div>
    ${storageBanner()}
    <h2>How your data is protected</h2><div class="card small"><ul class="plain">
      <li><b>Encrypted:</b> every document and detail is sealed with AES-256-GCM. The key comes from your passphrase (PBKDF2-SHA256, ${ITER.toLocaleString()} rounds) and is never saved.</li>
      <li><b>On this device only:</b> stored in this browser's private storage. There's no account, server or cloud copy.</li>
      <li><b>No internet access:</b> this page's security policy blocks every network request, so nothing can be sent anywhere, including to any AI service. Nothing here can be used for training.</li>
      <li><b>Face ID:</b> uses a passkey stored in your iPhone's Keychain. Face ID releases a secret that unlocks the vault key; your face data never leaves Apple's Secure Enclave.</li>
      <li><b>Auto-lock:</b> after 3 minutes idle or 1 minute in the background. The screen blurs when you switch apps.</li>
    </ul></div>
    <h2>Face ID</h2><div class="card" id="bioSec"><p class="small muted" style="margin:0">Checking…</p></div>
    <h2>Backup</h2><div class="card">
      <p class="small muted">The backup file stays encrypted with your passphrase. Keep it somewhere safe in case you lose this phone or clear browser data.</p>
      <div class="row"><button class="btn" id="exp">Export backup</button><button class="btn" id="imp">Restore</button></div>
    </div>
    <h2>Passphrase</h2><div class="card"><form id="cp" autocomplete="off">
      <input id="n1" type="password" placeholder="New passphrase (8+ characters)" autocomplete="new-password">
      <input id="n2" type="password" placeholder="Confirm new passphrase" style="margin-top:10px" autocomplete="new-password">
      <div class="err" id="e"></div><button class="btn" style="width:100%">Change passphrase</button></form></div>
    <h2>Danger zone</h2><button class="btn danger" id="wipe" style="width:100%">Erase vault from this device</button>`;
  $('#bk').onclick=renderList;
  (async()=>{
    const el=$('#bioSec');if(!el)return;const cfg=await Store.get('kv','config');
    if(!Bio.webOK()){el.innerHTML='<p class="small muted" style="margin:0">Face ID works once the vault is opened from its web address (https) in Safari or from your home screen, not as a downloaded file.</p>';return;}
    if(!(await Bio.available())){el.innerHTML='<p class="small muted" style="margin:0">Face ID or Touch ID isn\'t available on this device.</p>';return;}
    el.innerHTML=cfg.bio?'<p class="small muted">On. Your passphrase still works as a backup.</p><button class="btn danger" id="bioOff" style="width:100%">Turn off Face ID</button>'
      :'<p class="small muted">Unlock with a glance. Your passphrase stays as the fallback.</p><button class="btn primary" id="bioOn" style="width:100%">Turn on Face ID</button>';
    if($('#bioOn'))$('#bioOn').onclick=async()=>{await enableFaceID();renderSettings();};
    if($('#bioOff'))$('#bioOff').onclick=async()=>{const c=await Store.get('kv','config');delete c.bio;await Store.put('kv',c,'config');toast('Face ID turned off');renderSettings();};
  })();
  $('#exp').onclick=exportBackup;
  $('#imp').onclick=restoreBackup;
  $('#cp').onsubmit=async e=>{
    e.preventDefault();const a=$('#n1').value,b=$('#n2').value;
    if(a.length<8)return $('#e').textContent='Use at least 8 characters.';
    if(a!==b)return $('#e').textContent="Passphrases don't match.";
    busy('Re-encrypting everything…');await nextFrame();
    try{
      const salt=crypto.getRandomValues(new Uint8Array(16)),raw=await deriveRaw(a,salt),k=await keyFromRaw(raw);
      for(const d of docs)await Store.put('docs',Object.assign({id:d.id},await seal(k,{meta:d.meta,front:d.front,back:d.back})));
      await Store.put('kv',{salt:b64(salt),iter:ITER,check:await seal(k,'id-vault-ok')},'config');
      key=k;rawKey=raw;done();renderSettings();toast('Passphrase changed. Turn Face ID on again, and export a fresh backup.');
    }catch(err){done();$('#e').textContent='Failed: '+err.message;}
  };
  $('#wipe').onclick=async()=>{
    if(!confirm('Erase every document from this device? This cannot be undone.'))return;
    if(prompt('Type ERASE to confirm')!=='ERASE')return;
    await Store.clear('docs');await Store.clear('kv');key=null;docs=[];renderSetup();toast('Vault erased');
  };
}
async function exportBackup(){
  const cfg=await Store.get('kv','config'),recs=await Store.all('docs');
  const data=JSON.stringify({app:'id-vault',v:1,config:cfg,docs:recs});
  const name=`id-vault-backup-${new Date().toISOString().slice(0,10)}.idvault`;
  download([new File([data],name,{type:'application/octet-stream'})]);toast('Encrypted backup saved');
}
function restoreBackup(){
  const i=document.createElement('input');i.type='file';i.accept='.idvault,application/json,application/octet-stream';
  picking=true;
  i.onchange=async()=>{
    picking=false;const f=i.files[0];if(!f)return;
    try{
      const j=JSON.parse(await f.text());
      if(j.app!=='id-vault'||!j.config||!Array.isArray(j.docs))throw new Error('Not an ID Vault backup');
      if(!confirm(`Restore ${j.docs.length} document(s)? This replaces what's in the vault on this device.`))return;
      await Store.clear('docs');for(const r of j.docs)await Store.put('docs',r);await Store.put('kv',j.config,'config');
      lock('Backup restored. Unlock with the passphrase used for that backup.');
    }catch(e){toast('Restore failed: '+e.message);}
  };
  i.addEventListener('cancel',()=>{picking=false;});
  i.click();
}

/* ---------- start ---------- */
(async function init(){
  if(!window.crypto||!crypto.subtle){app.innerHTML='<div class="center"><h1>Can\'t open securely here</h1><p class="muted">This browser blocks the encryption the vault needs. Open the file in Chrome or Safari.</p></div>';return;}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
  (await Store.get('kv','config'))?renderLock(null,true):renderSetup();
})();
</script>
